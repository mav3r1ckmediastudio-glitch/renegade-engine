<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Renegade Engine Presence</title><style>
:root{color-scheme:dark}*{box-sizing:border-box}html,body,#scene,#orbCanvas{margin:0;padding:0;width:100%;height:100%;overflow:hidden;background:transparent!important}html{user-select:none;-webkit-user-select:none}body{pointer-events:none}#scene{position:relative;pointer-events:none}#orbCanvas{pointer-events:auto;display:block;touch-action:none}.hidden{display:none!important}
</style></head><body>
<div id="scene"><canvas id="orbCanvas" aria-label="Renegade engine energy orb, drag to move; click for chat, right-click for menu."></canvas></div>
<section class="hidden" aria-hidden="true"><div id="sceneTitle"></div><div id="sceneSub"></div><div id="fps"></div><div id="drawTime"></div><div id="sizeValue"></div><div id="energyValue"></div><div id="audioMeta"></div><button id="playAudio" disabled></button><button id="stopAudio" disabled></button><button id="motion" aria-pressed="false"></button><button id="waveSwitch" aria-pressed="true"></button><input type="file" id="audioFile"><input type="range" id="size" min="120" max="320" value="220"><input type="range" id="energy" min="20" max="100" value="75"></section>
<script src="./assets/speech-queue.js"></script><script src="./assets/v1-renderer.js"></script><button id="voiceConversation" type="button" style="position:absolute;bottom:7px;left:50%;transform:translateX(-50%);pointer-events:auto;border:1px solid #3d7183;border-radius:16px;background:#10222deb;color:#b8e9f3;padding:5px 12px;font:11px Segoe UI;cursor:pointer" title="Explicitly enable hands-free voice conversation">Voice conversation</button><script src="./voice/orb-conversation-ui.js"></script></body></html>
