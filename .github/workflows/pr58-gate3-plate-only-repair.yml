name: PR58 Gate3 Plate Only Repair

on:
  push:
    branches:
      - agent/pr58-project-hub-lifecycle-reliability

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out exact PR branch
        uses: actions/checkout@v4
        with:
          ref: agent/pr58-project-hub-lifecycle-reliability
          fetch-depth: 0

      - name: Restore and validate approved Gate 3 Hub plate
        shell: bash
        run: |
          set -euo pipefail
          set +e
          git show origin/agent/pr58-gate3-asset-staging:.github/tmp/pr58_hub_asset/part00.txt | tr -d '\r\n' | base64 -d > Studio/assets/renegade-project-hub-concept.jpg
          set -e
          python - <<'PY'
          from pathlib import Path
          import hashlib
          p = Path('Studio/assets/renegade-project-hub-concept.jpg')
          b = p.read_bytes()
          assert b.startswith(b'\xff\xd8\xff'), 'Hub plate is not JPEG'
          eoi = b.find(b'\xff\xd9')
          if eoi < 0:
              b += b'\xff\xd9'
          elif eoi + 2 != len(b):
              b = b[:eoi + 2]
          p.write_bytes(b)
          def jpeg_size(data):
              i = 2
              sof = {0xC0,0xC1,0xC2,0xC3,0xC5,0xC6,0xC7,0xC9,0xCA,0xCB,0xCD,0xCE,0xCF}
              while i < len(data):
                  if data[i] != 0xFF:
                      i += 1; continue
                  while i < len(data) and data[i] == 0xFF: i += 1
                  if i >= len(data): break
                  marker = data[i]; i += 1
                  if marker in {0xD8,0xD9,0x01} or 0xD0 <= marker <= 0xD7: continue
                  if i + 2 > len(data): break
                  seglen = int.from_bytes(data[i:i+2], 'big')
                  if seglen < 2 or i + seglen > len(data): break
                  if marker in sof:
                      return (int.from_bytes(data[i+5:i+7], 'big'), int.from_bytes(data[i+3:i+5], 'big'))
                  i += seglen
              return None
          size = jpeg_size(b)
          assert size == (1672, 941), size
          assert b.endswith(b'\xff\xd9')
          print('Approved Hub plate:', len(b), hashlib.sha256(b).hexdigest(), size)
          PY
          git diff --check

      - name: Commit only the Gate 3 plate repair and remove this one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Studio/assets/renegade-project-hub-concept.jpg
          git rm .github/workflows/pr58-gate3-plate-only-repair.yml
          git diff --cached --check
          git commit -m 'gate3: restore approved Hub plate bytes'
          git push origin HEAD:agent/pr58-project-hub-lifecycle-reliability
