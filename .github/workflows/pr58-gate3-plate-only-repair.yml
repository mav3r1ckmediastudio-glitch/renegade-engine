name: PR58 Gate3 Plate Only Repair

on:
  push:
    branches:
      - agent/pr58-project-hub-lifecycle-reliability

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out exact PR branch
        uses: actions/checkout@v4
        with:
          ref: agent/pr58-project-hub-lifecycle-reliability
          fetch-depth: 0

      - name: Reconstruct and validate approved Gate 3 Hub plate
        shell: bash
        run: |
          set -euo pipefail
          src=ceaf01a455a6cfdd92d27bbfd0692b14185dae35
          : > /tmp/pr58-hub.b64
          for n in 00 01 02 03 04 05 06 07 08; do
            git show "$src:.github/tmp/pr58-hub-plate/part${n}.b64" >> /tmp/pr58-hub.b64
          done
          tr -d '\r\n' < /tmp/pr58-hub.b64 | base64 -d > Studio/assets/renegade-project-hub-concept.jpg
          python - <<'PY'
          from pathlib import Path
          from PIL import Image
          import hashlib
          p = Path('Studio/assets/renegade-project-hub-concept.jpg')
          b = p.read_bytes()
          assert b.startswith(b'\xff\xd8\xff'), 'Hub plate is not JPEG'
          assert b.endswith(b'\xff\xd9'), 'Hub plate is truncated'
          digest = hashlib.sha256(b).hexdigest()
          assert digest == '3415c609233408872bcc09dc55551b44e92badb8a93a143cd8d9fbcec7473758', digest
          with Image.open(p) as im:
              assert im.size == (1672, 941), im.size
              im.verify()
          print('Approved Hub plate verified:', len(b), digest)
          PY
          git diff --check
          test "$(git diff --name-only -- Studio/assets/renegade-project-hub-concept.jpg | wc -l)" -eq 1

      - name: Commit only the Gate 3 plate repair and remove this one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Studio/assets/renegade-project-hub-concept.jpg
          git rm .github/workflows/pr58-gate3-plate-only-repair.yml
          git diff --cached --check
          git commit -m 'gate3: restore approved Hub plate bytes'
          git push origin HEAD:agent/pr58-project-hub-lifecycle-reliability
