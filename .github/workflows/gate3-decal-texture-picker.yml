name: Gate 3 decal texture picker staging

on:
  push:
    branches:
      - phase5/scene-render-gate3-decals-probes
    paths:
      - .github/gate3_decal_texture_picker.py
      - .github/workflows/gate3-decal-texture-picker.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Gate 3 branch
        uses: actions/checkout@v4
        with:
          ref: phase5/scene-render-gate3-decals-probes
          fetch-depth: 0

      - name: Apply decal texture picker
        run: python .github/gate3_decal_texture_picker.py

      - name: Validate bounded patch
        run: |
          git diff --check
          cmake -DRENEGADE_SOURCE_DIR="$PWD" -P Tests/Phase5Gate3SourceContract.cmake
          git diff -- Studio/src/StudioApplication.cpp Studio/src/StudioApplication.h Tests/Phase5Gate3SourceContract.cmake

      - name: Commit clean production tree
        run: |
          rm .github/gate3_decal_texture_picker.py
          rm .github/workflows/gate3-decal-texture-picker.yml
          git add Studio/src/StudioApplication.cpp Studio/src/StudioApplication.h Tests/Phase5Gate3SourceContract.cmake .github
          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Phase 5 Gate 3: select governed decal textures"
          git push origin HEAD:phase5/scene-render-gate3-decals-probes
