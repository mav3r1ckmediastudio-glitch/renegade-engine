name: Renegade Studio

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/studio.yml"
      - "CMakeLists.txt"
      - "EngineBridge/**"
      - "Studio/**"
      - "Runtime/**"
      - "ScreenRenderer/**"
      - "Tests/**"
      - "Tools/Build-Studio-Windows.ps1"
      - "Tools/Test-Windows-LoggedCommand.ps1"
      - "Tools/TerrainSurfacePacker.cpp"
      - "Tools/Windows-Build.Common.ps1"
      - ".gitmodules"

  pull_request:
    branches:
      - main

  workflow_dispatch:
    inputs:
      diagnostic_only:
        description: "Build and run only the projectile-world Release diagnostic"
        required: false
        type: boolean
        default: false

permissions:
  contents: read

# When a PR receives several quick fixes, keep only the newest validation.
# Prevent duplicate 90-minute cold builds from running at the same time.
concurrency:
  group: studio-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  studio:
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.diagnostic_only != true }}
    name: Renegade Studio Windows x64 ${{ matrix.configuration }}
    runs-on: windows-2025
    # The full Windows Release Studio build exceeded 60 minutes before CTest finished.
    # Preserve complete Debug/Release compilation, tests, startup proof and packaging.
    timeout-minutes: 90
    env:
      # GitHub-hosted Windows runners expose a DX12 device but do not provide
      # the reliable visible-model presentation path used by the owner-hardware
      # importer preview proof. Keep import/commit/reopen and PNG readback in CI;
      # retain pixel-visibility/pose-difference assertions on real owner hardware.
      RENEGADE_HOSTED_HEADLESS_GRAPHICS: "1"
    strategy:
      fail-fast: false
      matrix:
        configuration:
          - Debug
          - Release

    steps:
      - name: Check out Renegade and Wicked
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Configure MSBuild
        uses: microsoft/setup-msbuild@v2
        with:
          msbuild-architecture: x64

      - name: Capture toolchain
        shell: pwsh
        run: >-
          ./Tools/Collect-Windows-Baseline.ps1
          -OutputRoot "artifacts/studio/ci-${{ matrix.configuration }}"

      - name: Verify native command failure propagation
        shell: pwsh
        run: ./Tools/Test-Windows-LoggedCommand.ps1

      - name: Stage LP07 pinned FBX proof fixtures
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $fixtureRoot = 'Tests/Fixtures/LP07'
          New-Item -ItemType Directory -Force -Path $fixtureRoot | Out-Null

          $upstreamCommit = 'fcc5d6ba444cfd3eb80677dba5e37e493941abe5'
          $fixtures = @(
            @{
              Name = 'maya_cube_6100_ascii.fbx'
              Blob = 'b0aa64ea2361060b4f9bc4cd4e7bd0f730b6f7d8'
            },
            @{
              Name = 'maya_transformed_skin_7700_ascii.fbx'
              Blob = '683b74cf082e5adab645082c73dd221e0ff7f281'
            }
          )

          foreach ($fixture in $fixtures) {
            $path = Join-Path $fixtureRoot $fixture.Name
            $uri = "https://raw.githubusercontent.com/ufbx/ufbx/$upstreamCommit/data/$($fixture.Name)"
            Invoke-WebRequest -Uri $uri -OutFile $path

            $actualBlob = (& git.exe hash-object -- $path).Trim()
            if ($LASTEXITCODE -ne 0) {
              throw "git hash-object failed for $path"
            }
            if ($actualBlob -ne $fixture.Blob) {
              throw "LP07 fixture integrity failure for $($fixture.Name): expected $($fixture.Blob), got $actualBlob"
            }
            Write-Host "LP07 fixture verified: $($fixture.Name) // git-blob=$actualBlob"
          }

      - name: Build Renegade Studio
        shell: pwsh
        run: >-
          ./Tools/Build-Studio-Windows.ps1
          -Configuration ${{ matrix.configuration }}
          -Clean
          -ArtifactRoot "artifacts/studio/ci-${{ matrix.configuration }}"

      - name: Verify Renegade Studio process startup
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $studio = "BUILD/renegade/Studio/${{ matrix.configuration }}/RenegadeStudio.exe"
          if (-not (Test-Path -LiteralPath $studio -PathType Leaf)) {
            throw "Renegade Studio startup proof cannot find $studio"
          }

          $process = Start-Process -FilePath $studio -ArgumentList 'startup-smoke' -Wait -PassThru
          if ($process.ExitCode -ne 0) {
            throw "Renegade Studio startup proof failed with process exit code $($process.ExitCode)."
          }
          Write-Host "RENEGADE_STUDIO_STARTUP_SMOKE_PASS configuration=${{ matrix.configuration }}"

      - name: Upload build and evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: >-
            renegade-studio-windows-x64-${{ matrix.configuration }}-${{ github.sha }}
          path: artifacts/studio/ci-${{ matrix.configuration }}
          if-no-files-found: warn
          retention-days: 14

  release-world-diagnostic:
    name: Release Projectile World Diagnostic
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.diagnostic_only == true }}
    runs-on: windows-2025
    timeout-minutes: 65
    steps:
      - name: Check out pinned Wicked and Renegade
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Configure MSBuild
        uses: microsoft/setup-msbuild@v2
        with:
          msbuild-architecture: x64

      - name: Configure Release diagnostic
        shell: pwsh
        run: cmake -S . -B BUILD/renegade -A x64 -DRENEGADE_EMBED_SHADERS=ON

      - name: Build ONLY Release Projectile World test
        shell: pwsh
        run: cmake --build BUILD/renegade --config Release --target RenegadeProjectileWorldTests --parallel 2

      - name: Run isolated Release test with checkpoints
        shell: pwsh
        env:
          RENEGADE_HOSTED_HEADLESS_GRAPHICS: "1"
        run: |
          ctest --test-dir BUILD/renegade -C Release -R "^RenegadeProjectileWorldTests$" -V --output-on-failure --timeout 75
          if ($LASTEXITCODE -ne 0) { throw "Isolated Release projectile-world test failed." }
