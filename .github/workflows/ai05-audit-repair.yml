name: AI-05 repaired focused acceptance

on:
  push:
    branches:
      - feature/character-ai-programme
    paths:
      - .github/workflows/ai05-audit-repair.yml

concurrency:
  group: ai05-repaired-focused-acceptance
  cancel-in-progress: true

jobs:
  validate:
    runs-on: windows-2025
    steps:
      - name: Check out Renegade and Wicked
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Apply final deterministic audit repairs in validation workspace
        shell: pwsh
        run: python .github/ai05_repair_final.py

      - name: Configure MSBuild
        uses: microsoft/setup-msbuild@v2
        with:
          msbuild-architecture: x64

      - name: Configure focused build
        shell: pwsh
        run: cmake -S . -B BUILD/ai05audit -A x64 -DRENEGADE_EMBED_SHADERS=OFF

      - name: Build AI-01 through AI-05, Runtime and Studio
        shell: pwsh
        run: >-
          cmake --build BUILD/ai05audit --config Debug --target
          RenegadeCharacterAiFoundationTests
          RenegadeCharacterAiProfilesTests
          RenegadeCharacterAiProfilesAuditTests
          RenegadeCharacterAiPerceptionTests
          RenegadeCharacterAiDecisionTests
          RenegadeCharacterAiCombatTests
          RenegadeRuntime
          RenegadeStudio
          --parallel

      - name: Run complete Character AI acceptance set
        shell: pwsh
        run: ctest --test-dir BUILD/ai05audit -C Debug -R "^RenegadeCharacterAi" --output-on-failure

      - name: Export repaired source evidence
        uses: actions/upload-artifact@v4
        with:
          name: ai05-audit-repaired-source
          if-no-files-found: error
          path: |
            EngineBridge/include/renegade/bridge/WeaponCombatService.h
            Runtime/src/RuntimeScriptRuntime.h
            Runtime/src/RuntimeScriptRuntime.cpp
            Runtime/src/RuntimeApplication.h
            Runtime/src/RuntimeLiveDiagnostics.cpp
            Runtime/src/RuntimeCharacterDecision.h
            Runtime/src/RuntimeCombatService.h
            Runtime/src/RuntimeCombatDecision.h
            Studio/src/AICombatInspector.cpp
            Tests/CharacterAiCombatTests.cpp
            Tests/CharacterAiCombatSourceContract.cmake
