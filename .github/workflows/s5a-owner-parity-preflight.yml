name: S5A owner parity preflight

on:
  push:
    branches:
      - preflight/s5a-owner-parity-repair

permissions:
  contents: write

jobs:
  preflight:
    runs-on: windows-2025
    timeout-minutes: 60

    steps:
      - name: Check out preflight branch
        uses: actions/checkout@v4
        with:
          ref: preflight/s5a-owner-parity-repair
          submodules: recursive

      - name: Configure MSBuild
        uses: microsoft/setup-msbuild@v2
        with:
          msbuild-architecture: x64

      - name: Apply owner and Test Level parity repair
        shell: pwsh
        run: python .github/s5a_owner_parity_patch.py

      - name: Stage LP07 pinned FBX proof fixtures
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $fixtureRoot = 'Tests/Fixtures/LP07'
          New-Item -ItemType Directory -Force -Path $fixtureRoot | Out-Null
          $upstreamCommit = 'fcc5d6ba444cfd3eb80677dba5e37e493941abe5'
          $fixtures = @(
            @{ Name = 'maya_cube_6100_ascii.fbx'; Blob = 'b0aa64ea2361060b4f9bc4cd4e7bd0f730b6f7d8' },
            @{ Name = 'maya_transformed_skin_7700_ascii.fbx'; Blob = '683b74cf082e5adab645082c73dd221e0ff7f281' }
          )
          foreach ($fixture in $fixtures) {
            $path = Join-Path $fixtureRoot $fixture.Name
            $uri = "https://raw.githubusercontent.com/ufbx/ufbx/$upstreamCommit/data/$($fixture.Name)"
            Invoke-WebRequest -Uri $uri -OutFile $path
            $actualBlob = (& git.exe hash-object -- $path).Trim()
            if ($LASTEXITCODE -ne 0 -or $actualBlob -ne $fixture.Blob) {
              throw "LP07 fixture integrity failure for $($fixture.Name): expected $($fixture.Blob), got $actualBlob"
            }
          }

      - name: Configure targeted build
        shell: pwsh
        run: cmake -S . -B BUILD/preflight -A x64 -DRENEGADE_EMBED_SHADERS=ON

      - name: Build targeted owner parity proofs
        shell: pwsh
        run: >-
          cmake --build BUILD/preflight --config Release --parallel
          --target RenegadeS5CoreGameplayLuaTests RenegadeTestLevelSnapshotRuntimeTests

      - name: Run real S5A owner scripting regression
        shell: pwsh
        run: ./BUILD/preflight/Tests/Release/RenegadeS5CoreGameplayLuaTests.exe

      - name: Run real Test Level material and Runtime regression
        shell: pwsh
        run: ./BUILD/preflight/Tests/Release/RenegadeTestLevelSnapshotRuntimeTests.exe

      - name: Compile production Studio integration
        shell: pwsh
        run: cmake --build BUILD/preflight --config Release --parallel --target RenegadeStudio

      - name: Publish clean proven repair to preflight branch
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/s5a-owner-parity-preflight.yml
          git rm .github/s5a_owner_parity_patch.py
          git add EngineBridge/include/renegade/bridge/TestLevelSnapshotService.h
          git add EngineBridge/src/TestLevelSnapshotService.cpp
          git add Studio/src/StudioApplication.cpp
          git add Runtime/src/RuntimeBootstrap.h
          git add Runtime/src/RuntimeBootstrap.cpp
          git add Runtime/src/RuntimeReusableAssets.cpp
          git add Tests/S5CoreGameplayLuaTests.cpp
          git add Tests/TestLevelSnapshotRuntimeTests.cpp
          git diff --cached --check
          git commit -m "S5A: repair Test Level owner and material parity"
          git push origin HEAD:preflight/s5a-owner-parity-repair
