name: Phase 5 Gate 1 inspector patch

on:
  push:
    branches:
      - 'phase5/scene-render-gate1-core-components'

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Apply bounded Gate 1 integration
        run: python3 Tools/Phase5Gate1InspectorPatch.py

      - name: Run Gate 1 source contract
        run: cmake -DRENEGADE_SOURCE_DIR="$GITHUB_WORKSPACE" -P Tests/Phase5Gate1SourceContract.cmake

      - name: Commit Gate 1 Inspector integration
        run: |
          git config user.name "mav3r1ckmediastudio-glitch"
          git config user.email "mav3r1ckmediastudio@gmail.com"
          git rm .github/workflows/phase5-gate1-inspector-patch.yml
          git rm Tools/Phase5Gate1InspectorPatch.py
          git add -A
          git diff --cached --check
          git commit -m "Phase 5 Gate 1: expose core scene components in Inspector"
          git push origin HEAD:phase5/scene-render-gate1-core-components
