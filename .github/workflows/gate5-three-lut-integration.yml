name: Gate 5 guarded three-LUT integration

on:
  push:
    branches:
      - staging/phase5-gate5-three-luts

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout staging candidate
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Fail closed on unexpected staging state
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "38d2a2ba770fd825e8828d8e592816f4cee9549a"
          test -f .github/scripts/gate5_render_workspace.py
          test -f .github/scripts/gate5_lut_integration.py
          test -f .github/scripts/gate5_three_lut_finalize.py
          test -f Studio/assets/luts/1.png
          test -f Studio/assets/luts/2.png
          test -f Studio/assets/luts/3.png
          test ! -e Studio/assets/luts/Renegade_Builtin_LUTs_1-50_RGBA.zip

      - name: Verify three representative LUT payloads
        shell: bash
        run: |
          set -euo pipefail
          echo "c805ff42a6d37cdffb09f91119e5d9a5313a8fb2e93e8e5543225a28f31b1ef6  Studio/assets/luts/1.png" | sha256sum -c -
          echo "95c71ea89b587921c22affe03741fab9190513c4c5a11884f8a3ca306c8853f2  Studio/assets/luts/2.png" | sha256sum -c -
          echo "9cb622aff1b82ebafa242be2c858dd048262b9ce78fec27e040571e5b3cd95c1  Studio/assets/luts/3.png" | sha256sum -c -
          python - <<'PY'
          from pathlib import Path
          for index in (1, 2, 3):
              data = Path(f"Studio/assets/luts/{index}.png").read_bytes()
              assert data[:8] == b"\x89PNG\r\n\x1a\n"
              assert data[12:16] == b"IHDR"
              assert int.from_bytes(data[16:20], "big") == 256
              assert int.from_bytes(data[20:24], "big") == 16
              assert data[24] == 8
              assert data[25] == 6
          print("Three Gate 5 LUTs verified as 256x16 8-bit RGBA PNGs")
          PY

      - name: Refresh bounded Studio anchor cardinality
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('.github/scripts/gate5_render_workspace.py')
          text = path.read_text(encoding='utf-8')
          old = '    2,\n    "hierarchy/entity selection returns to Scene")'
          new = '    1,\n    "hierarchy/entity selection returns to Scene")'
          if text.count(old) != 1:
              raise SystemExit('Gate 5 hierarchy anchor guard no longer matches exactly once')
          path.write_text(text.replace(old, new, 1), encoding='utf-8', newline='\n')
          PY

      - name: Validate integration scripts
        run: |
          python -m py_compile \
            .github/scripts/gate5_render_workspace.py \
            .github/scripts/gate5_lut_integration.py \
            .github/scripts/gate5_three_lut_finalize.py

      - name: Apply exact-anchor Gate 5 integration
        run: |
          set -euo pipefail
          python .github/scripts/gate5_render_workspace.py
          python .github/scripts/gate5_lut_integration.py
          python .github/scripts/gate5_three_lut_finalize.py

      - name: Run Gate 5 source contract
        shell: bash
        run: |
          set -euo pipefail
          cmake -DRENEGADE_SOURCE_DIR="$PWD" -P Tests/Phase5Gate5SourceContract.cmake
          git diff --check
          grep -q "BuiltInColorGradingLutCount = 3" EngineBridge/include/renegade/bridge/RenderLutService.h
          grep -q "COLOR GRADING // LUT" Studio/src/Phase5Gate5RenderWorkspace.cpp
          grep -q "+ IMPORT LUT" Studio/src/Phase5Gate5RenderWorkspace.cpp
          grep -q "copy_if_different" Studio/CMakeLists.txt
          grep -q "SyncRenderSettingsFromScene(true)" Studio/src/StudioApplication.cpp
          grep -q "RefreshColorGradingLutResource" Runtime/src/RuntimeApplication.cpp

      - name: Self-clean helpers and publish staging product tree
        shell: bash
        run: |
          set -euo pipefail
          rm -f \
            .github/scripts/gate5_render_workspace.py \
            .github/scripts/gate5_lut_integration.py \
            .github/scripts/gate5_three_lut_finalize.py \
            .github/workflows/gate5-three-lut-integration.yml
          git add -A
          git diff --cached --check
          test ! -e .github/scripts/gate5_render_workspace.py
          test ! -e .github/scripts/gate5_lut_integration.py
          test ! -e .github/scripts/gate5_three_lut_finalize.py
          test ! -e .github/workflows/gate5-three-lut-integration.yml
          git config user.name "mav3r1ckmediastudio-glitch"
          git config user.email "mav3r1ckmediastudio@gmail.com"
          git commit -m "Phase 5 Gate 5: complete RENDER workspace and LUT workflow"
          git push origin HEAD:staging/phase5-gate5-three-luts
