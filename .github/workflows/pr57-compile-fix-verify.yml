name: PR57 compile-fix verification

on:
  push:
    branches:
      - scratch/pr57-compile-fix
    paths:
      - ".github/workflows/pr57-compile-fix-verify.yml"

permissions:
  contents: write

jobs:
  verify:
    runs-on: windows-2025
    timeout-minutes: 60
    steps:
      - name: Check out candidate and Wicked
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Configure MSBuild
        uses: microsoft/setup-msbuild@v2
        with:
          msbuild-architecture: x64

      - name: Apply exact namespace correction
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $path = 'Studio/src/StudioApplication.cpp'
          $text = [System.IO.File]::ReadAllText($path)
          $old = '        bridge::PreparedModelImport preparedForCommit;'
          $new = '        renegade::bridge::PreparedModelImport preparedForCommit;'
          $count = ([regex]::Matches($text, [regex]::Escape($old))).Count
          if ($count -ne 1) {
            throw "Expected exactly one unqualified preparedForCommit declaration, found $count"
          }
          $text = $text.Replace($old, $new)
          [System.IO.File]::WriteAllText(
            $path,
            $text,
            [System.Text.UTF8Encoding]::new($false))

          $remaining = Select-String -LiteralPath $path -Pattern '^\s*bridge::PreparedModelImport\s+preparedForCommit;' -AllMatches
          if ($remaining) {
            throw 'Unqualified preparedForCommit declaration remains after correction.'
          }
          $qualified = Select-String -LiteralPath $path -Pattern '^\s*renegade::bridge::PreparedModelImport\s+preparedForCommit;' -AllMatches
          if ($qualified.Matches.Count -ne 1) {
            throw 'Qualified preparedForCommit declaration is not present exactly once.'
          }

          git diff --check
          if ($LASTEXITCODE -ne 0) {
            throw 'git diff --check failed after namespace correction.'
          }

      - name: Stage LP07 pinned FBX proof fixtures
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $fixtureRoot = 'Tests/Fixtures/LP07'
          New-Item -ItemType Directory -Force -Path $fixtureRoot | Out-Null
          $upstreamCommit = 'fcc5d6ba444cfd3eb80677dba5e37e493941abe5'
          $fixtures = @(
            @{ Name = 'maya_cube_6100_ascii.fbx'; Blob = 'b0aa64ea2361060b4f9bc4cd4e7bd0f730b6f7d8' },
            @{ Name = 'maya_transformed_skin_7700_ascii.fbx'; Blob = '683b74cf082e5adab645082c73dd221e0ff7f281' }
          )
          foreach ($fixture in $fixtures) {
            $path = Join-Path $fixtureRoot $fixture.Name
            $uri = "https://raw.githubusercontent.com/ufbx/ufbx/$upstreamCommit/data/$($fixture.Name)"
            Invoke-WebRequest -Uri $uri -OutFile $path
            $actualBlob = (& git.exe hash-object -- $path).Trim()
            if ($LASTEXITCODE -ne 0 -or $actualBlob -ne $fixture.Blob) {
              throw "LP07 fixture integrity failure for $($fixture.Name)"
            }
          }

      - name: Build exact Release candidate
        shell: pwsh
        run: >-
          ./Tools/Build-Studio-Windows.ps1
          -Configuration Release
          -Clean
          -ArtifactRoot "artifacts/studio/pr57-compile-fix"

      - name: Verify executable startup
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $studio = 'BUILD/renegade/Studio/Release/RenegadeStudio.exe'
          if (-not (Test-Path -LiteralPath $studio -PathType Leaf)) {
            throw "Scratch startup proof cannot find $studio"
          }
          $process = Start-Process -FilePath $studio -ArgumentList 'startup-smoke' -Wait -PassThru
          if ($process.ExitCode -ne 0) {
            throw "Scratch startup proof failed with process exit code $($process.ExitCode)."
          }
          Write-Host 'PR57_SCRATCH_RELEASE_STARTUP_PASS'

      - name: Commit only the verified source correction
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Remove-Item -LiteralPath '.github/workflows/pr57-compile-fix-verify.yml'
          git add -- 'Studio/src/StudioApplication.cpp' '.github/workflows/pr57-compile-fix-verify.yml'
          git diff --cached --check
          if ($LASTEXITCODE -ne 0) {
            throw 'staged diff check failed'
          }
          $changed = git diff --cached --name-only
          if (($changed -join "`n") -ne "Studio/src/StudioApplication.cpp`n.github/workflows/pr57-compile-fix-verify.yml" -and
              ($changed -join "`n") -ne ".github/workflows/pr57-compile-fix-verify.yml`nStudio/src/StudioApplication.cpp") {
            throw "Unexpected staged paths: $($changed -join ', ')"
          }
          git config user.name 'mav3r1ckmediastudio-glitch'
          git config user.email 'mav3r1ckmediastudio@gmail.com'
          git commit -m 'fix(studio): qualify retained import state type'
          git push origin HEAD:scratch/pr57-compile-fix
