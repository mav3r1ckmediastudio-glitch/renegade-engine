name: Stage Phase 5 Gate 7

on:
  push:
    branches:
      - staging/phase5-gate7-implementation

permissions:
  contents: write

jobs:
  guarded-product-patch:
    runs-on: ubuntu-latest
    steps:
      - name: Check out staging branch
        uses: actions/checkout@v4
        with:
          ref: staging/phase5-gate7-implementation
          fetch-depth: 0

      - name: Correct guarded multi-anchor helpers
        run: python .github/scripts/fix_stage_phase5_gate7.py

      - name: Apply guarded Gate 7 product patch
        run: python .github/scripts/stage_phase5_gate7.py

      - name: Verify patch whitespace
        run: git diff --check

      - name: Verify retained Gate 5 source contract
        run: cmake -DRENEGADE_SOURCE_DIR="$GITHUB_WORKSPACE" -P Tests/Phase5Gate5SourceContract.cmake

      - name: Verify retained Gate 6 source contract
        run: cmake -DRENEGADE_SOURCE_DIR="$GITHUB_WORKSPACE" -P Tests/Phase5Gate6SourceContract.cmake

      - name: Verify Gate 7 source contract
        run: cmake -DRENEGADE_SOURCE_DIR="$GITHUB_WORKSPACE" -P Tests/Phase5Gate7SourceContract.cmake

      - name: Self-clean staging helpers
        run: |
          rm -f .github/workflows/stage-phase5-gate7.yml
          rm -f .github/scripts/stage_phase5_gate7.py
          rm -f .github/scripts/fix_stage_phase5_gate7.py
          git diff --check

      - name: Commit clean product tree
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git status --short
          git commit -m "Phase 5 Gate 7: implement ray and path tracing"
          git push origin HEAD:staging/phase5-gate7-implementation
