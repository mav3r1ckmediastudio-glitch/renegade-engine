name: Gate 8D direct manipulation PR patch

on:
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  patch:
    if: ${{ github.event.pull_request.head.ref == 'wip/story-flow-gate8d-direct-manipulation' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Execute bounded patch and remove temporary runners
        shell: bash
        run: |
          python3 - <<'RUNNER'
          from pathlib import Path

          workflow = Path('.github/workflows/gate8d-direct-manipulation-patch.yml').read_text(encoding='utf-8')
          marker = "python3 - <<'PY'\n"
          if marker not in workflow:
              raise SystemExit('embedded Gate 8D patch script marker is missing')
          block = workflow.split(marker, 1)[1]
          end = "\n          PY\n"
          if end not in block:
              raise SystemExit('embedded Gate 8D patch script terminator is missing')
          block = block.split(end, 1)[0]
          lines = block.splitlines()
          block = "\n".join(
              line[10:] if line.startswith("          ") else line
              for line in lines
          ) + "\n"

          fragile = "text = replace_once(text, old_update, new_update, 'replace workspace update with direct manipulation')\n"
          if fragile not in block:
              raise SystemExit('direct manipulation Update replacement hook is missing')
          resilient = '''import re
update_pattern = (
    r"    void RenegadeScreenEditorWorkspace::Update\\(\\n"
    r".*?"
    r"\\n    \\}\\n\\n"
    r"    void RenegadeScreenEditorWorkspace::Render\\("
)
update_replacement = new_update + "\\n    void RenegadeScreenEditorWorkspace::Render("
text, update_count = re.subn(
    update_pattern,
    lambda _: update_replacement,
    text,
    count=1,
    flags=re.S,
)
if update_count != 1:
    raise SystemExit(f'expected exactly one Screen Editor Update function, found {update_count}')
'''
          block = block.replace(fragile, resilient, 1)
          exec(compile(block, 'gate8d-direct-manipulation-patch', 'exec'))
          RUNNER

          rm -f .github/gate8d-direct-trigger
          rm -f .github/gate8d-direct-pr-open-trigger
          rm -f .github/gate8d-direct-pr-note
          rm -f docs/GATE8D_DIRECT_MANIPULATION_WIP.md
          rm -f .github/workflows/gate8d-direct-manipulation-pr.yml
          rm -f .github/workflows/gate8d-direct-manipulation-patch.yml

          git config user.name "renegade-gate8d-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "Gate 8D: add direct Screen move and resize [gate8d-direct-patched]"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
