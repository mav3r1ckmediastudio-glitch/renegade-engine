name: Renegade Studio Fast

on:
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/studio-fast.yml"
      - "CMakeLists.txt"
      - "EngineBridge/**"
      - "Studio/**"
      - "Runtime/**"
      - "Tests/**"
      - "Tools/Build-Studio-Windows-Fast.ps1"
      - "Tools/Windows-Build.Common.ps1"
      - ".gitmodules"

  workflow_dispatch:

permissions:
  contents: read

env:
  SCCACHE_GHA_ENABLED: "true"

concurrency:
  group: renegade-studio-fast-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  fast-release:
    name: Renegade Studio Fast Release
    runs-on: windows-2025
    timeout-minutes: 60

    steps:
      - name: Check out Renegade and Wicked
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Configure MSBuild discovery
        uses: microsoft/setup-msbuild@v2
        with:
          msbuild-architecture: x64

      - name: Configure sccache
        uses: mozilla-actions/sccache-action@v0.0.11

      - name: Stage LP07 pinned FBX proof fixtures
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $fixtureRoot = 'Tests/Fixtures/LP07'
          New-Item -ItemType Directory -Force -Path $fixtureRoot | Out-Null

          $upstreamCommit = 'fcc5d6ba444cfd3eb80677dba5e37e493941abe5'
          $fixtures = @(
            @{
              Name = 'maya_cube_6100_ascii.fbx'
              Blob = 'b0aa64ea2361060b4f9bc4cd4e7bd0f730b6f7d8'
            },
            @{
              Name = 'maya_transformed_skin_7700_ascii.fbx'
              Blob = '683b74cf082e5adab645082c73dd221e0ff7f281'
            }
          )

          foreach ($fixture in $fixtures) {
            $path = Join-Path $fixtureRoot $fixture.Name
            $uri = "https://raw.githubusercontent.com/ufbx/ufbx/$upstreamCommit/data/$($fixture.Name)"
            Invoke-WebRequest -Uri $uri -OutFile $path

            $actualBlob = (& git.exe hash-object -- $path).Trim()
            if ($LASTEXITCODE -ne 0) {
              throw "git hash-object failed for $path"
            }
            if ($actualBlob -ne $fixture.Blob) {
              throw "LP07 fixture integrity failure for $($fixture.Name): expected $($fixture.Blob), got $actualBlob"
            }
            Write-Host "LP07 fixture verified: $($fixture.Name) // git-blob=$actualBlob"
          }

      - name: Build cached Release iteration
        shell: cmd
        run: |
          for /f "usebackq tokens=*" %%i in (`"%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath`) do set "VSINSTALL=%%i"
          if not defined VSINSTALL (
            echo Visual Studio C++ installation not found.
            exit /b 1
          )
          call "%VSINSTALL%\Common7\Tools\VsDevCmd.bat" -arch=x64 -host_arch=x64
          if errorlevel 1 exit /b %errorlevel%
          pwsh -NoLogo -NoProfile -File .\Tools\Build-Studio-Windows-Fast.ps1 -Configuration Release -ArtifactRoot "artifacts/studio-fast/ci-Release"
          if errorlevel 1 exit /b %errorlevel%

      - name: Show compiler-cache statistics
        if: always()
        shell: pwsh
        run: |
          if (Get-Command sccache -ErrorAction SilentlyContinue) {
            sccache --show-stats
          }

      - name: Upload fast Release package and evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: renegade-studio-fast-windows-x64-Release-${{ github.sha }}
          path: artifacts/studio-fast/ci-Release
          if-no-files-found: warn
          retention-days: 7
