name: S4C source preflight

on:
  push:
    branches:
      - scripting/s4c-typed-script-properties
    paths:
      - .github/workflows/s4c-preflight.yml

permissions:
  contents: write

jobs:
  preflight:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: scripting/s4c-typed-script-properties
          fetch-depth: 0

      # Re-run after correcting header-vs-source assertions.
      - name: Run S4C source contract
        run: cmake -DRENEGADE_SOURCE_DIR="$GITHUB_WORKSPACE" -P Tests/S4CScriptPropertyAuthoringSourceContract.cmake

      - name: Check diff hygiene
        run: |
          git fetch origin main
          git diff --check origin/main...HEAD
          test -f EngineBridge/include/renegade/bridge/ScriptPropertyAuthoringService.h
          test -f EngineBridge/src/ScriptPropertyAuthoringService.cpp
          test -f Studio/src/S4CScriptPropertyControls.h
          test -f Studio/src/S4CScriptPropertyControls.cpp
          test -f Tests/S4CScriptPropertyAuthoringTests.cpp

      - name: Remove helper
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/s4c-preflight.yml
          git commit -m "chore: complete S4C source preflight"
          git push origin HEAD:scripting/s4c-typed-script-properties
