name: Apply guarded S5A owner repair

on:
  push:
    branches:
      - scripting/s5a-core-entity-transform
    paths:
      - ".github/workflows/s5a-owner-repair-apply.yml"

permissions:
  contents: write

jobs:
  apply-repair:
    runs-on: ubuntu-latest
    steps:
      - name: Check out PR branch
        uses: actions/checkout@v4
        with:
          ref: scripting/s5a-core-entity-transform
          fetch-depth: 0

      - name: Apply guarded repair
        shell: bash
        run: python Tools/Apply-S5AOwnerRepair.py

      - name: Commit repair to PR branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "S5A: bind reusable child scripts to stable owner"
          git push origin HEAD:scripting/s5a-core-entity-transform
