name: Apply guarded S5A owner repair

on:
  push:
    branches:
      - scripting/s5a-core-entity-transform
    paths:
      - ".github/workflows/s5a-owner-repair-apply.yml"

permissions:
  contents: write

jobs:
  apply-repair:
    runs-on: ubuntu-latest
    steps:
      - name: Check out PR branch
        uses: actions/checkout@v4
        with:
          ref: scripting/s5a-core-entity-transform
          fetch-depth: 0

      - name: Apply guarded source and regression repair
        shell: python
        run: |
          from pathlib import Path

          def replace_once(text: str, old: str, new: str, label: str) -> str:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{label}: expected exactly one anchor, found {count}")
              return text.replace(old, new, 1)

          service_path = Path("EngineBridge/src/ScriptAuthoringService.cpp")
          service = service_path.read_text(encoding="utf-8")

          service = replace_once(
              service,
              '#include "renegade/bridge/ProjectService.h"\n#include "renegade/bridge/SceneService.h"',
              '#include "renegade/bridge/ProjectService.h"\n#include "renegade/bridge/ReusableAssetInstanceService.h"\n#include "renegade/bridge/SceneService.h"',
              "ScriptAuthoringService include")

          helper = r'''    StableId ResolveEntityScriptAuthoringOwner(
              const wi::scene::Scene& scene,
              const StableId& requestedOwner)
          {
              if (!IsValidStableId(requestedOwner))
                  return {};

              wi::ecs::Entity selected = wi::ecs::INVALID_ENTITY;
              for (std::size_t index = 0; index < scene.metadatas.GetCount(); ++index)
              {
                  const wi::ecs::Entity candidate = scene.metadatas.GetEntity(index);
                  if (PersistentEntityId(scene, candidate) == requestedOwner)
                  {
                      selected = candidate;
                      break;
                  }
              }
              if (selected == wi::ecs::INVALID_ENTITY)
                  return {};

              // Imported nodes inside a reusable asset are replaceable payload.
              // Creator-owned scripts belong to the nearest stable reusable
              // instance root so payload refresh/reimport cannot orphan them.
              wi::ecs::Entity current = selected;
              const std::size_t maximumDepth = scene.hierarchy.GetCount() + 1;
              for (std::size_t depth = 0;
                  current != wi::ecs::INVALID_ENTITY && depth <= maximumDepth;
                  ++depth)
              {
                  const auto* metadata = scene.metadatas.GetComponent(current);
                  if (metadata != nullptr &&
                      metadata->string_values.has(
                          ReusableAssetInstanceIdMetadataKey))
                  {
                      const StableId wrapperId = PersistentEntityId(scene, current);
                      return IsValidStableId(wrapperId)
                          ? wrapperId
                          : StableId{};
                  }

                  const auto* hierarchy = scene.hierarchy.GetComponent(current);
                  if (hierarchy == nullptr ||
                      hierarchy->parentID == wi::ecs::INVALID_ENTITY ||
                      hierarchy->parentID == current)
                  {
                      break;
                  }
                  current = hierarchy->parentID;
              }

              return requestedOwner;
          }

'''
          service = replace_once(
              service,
              "    bool SourceSortLess(\n",
              helper + "    bool SourceSortLess(\n",
              "ScriptAuthoringService owner resolver")

          old_entity_attachments = r'''    std::vector<const ScriptAttachment*> ScriptAuthoringService::EntityAttachments(
              const StableId& ownerEntityId,
              const ScriptPresentation presentation) const
          {
              std::vector<const ScriptAttachment*> result;
              if (!loaded_ || !IsValidStableId(ownerEntityId))
                  return result;
              for (const auto& attachment : document_.attachments)
              {
                  if (attachment.scope == ScriptScope::Entity &&
                      attachment.ownerEntityId == ownerEntityId &&
                      attachment.presentation == presentation)
                  {
                      result.push_back(&attachment);
                  }
              }
              std::sort(
                  result.begin(), result.end(),
                  [](const ScriptAttachment* left, const ScriptAttachment* right)
                  {
                      return left->order < right->order;
                  });
              return result;
          }
'''
          new_entity_attachments = r'''    std::vector<const ScriptAttachment*> ScriptAuthoringService::EntityAttachments(
              const StableId& ownerEntityId,
              const ScriptPresentation presentation) const
          {
              std::vector<const ScriptAttachment*> result;
              if (!loaded_ || !IsValidStableId(ownerEntityId) || scenes_ == nullptr)
                  return result;

              const StableId resolvedOwner = ResolveEntityScriptAuthoringOwner(
                  scenes_->GetScene(), ownerEntityId);
              if (!IsValidStableId(resolvedOwner))
                  return result;

              for (const auto& attachment : document_.attachments)
              {
                  if (attachment.scope == ScriptScope::Entity &&
                      attachment.ownerEntityId == resolvedOwner &&
                      attachment.presentation == presentation)
                  {
                      result.push_back(&attachment);
                  }
              }
              std::sort(
                  result.begin(), result.end(),
                  [](const ScriptAttachment* left, const ScriptAttachment* right)
                  {
                      return left->order < right->order;
                  });
              return result;
          }
'''
          service = replace_once(
              service,
              old_entity_attachments,
              new_entity_attachments,
              "ScriptAuthoringService EntityAttachments")

          old_attach = r'''        if (!IsValidStableId(ownerEntityId))
              {
                  error = "Selected entity has no valid persistent Renegade ID.";
                  return false;
              }
              if (source.metadata.presentation == ScriptPresentation::GlobalScript)
              {
                  error = "GLOBAL SCRIPT sources must be attached at Level scope.";
                  return false;
              }

              ScriptAttachment attachment = CreateScriptAttachment(
                  ScriptScope::Entity,
                  ownerEntityId,
                  ResolveSourceBinding(source));
'''
          new_attach = r'''        if (!IsValidStableId(ownerEntityId))
              {
                  error = "Selected entity has no valid persistent Renegade ID.";
                  return false;
              }

              const StableId resolvedOwner = ResolveEntityScriptAuthoringOwner(
                  scenes_->GetScene(), ownerEntityId);
              if (!IsValidStableId(resolvedOwner))
              {
                  error =
                      "Selected entity no longer resolves in the active Scene.";
                  return false;
              }

              EntityIdentityIndex identities;
              if (!identities.Build(scenes_->GetScene(), error))
              {
                  error = "Cannot attach script because Scene identity is invalid: " + error;
                  return false;
              }
              if (identities.Resolve(resolvedOwner) == wi::ecs::INVALID_ENTITY)
              {
                  error =
                      "Resolved script owner does not exist in the active Scene.";
                  return false;
              }

              if (source.metadata.presentation == ScriptPresentation::GlobalScript)
              {
                  error = "GLOBAL SCRIPT sources must be attached at Level scope.";
                  return false;
              }

              ScriptAttachment attachment = CreateScriptAttachment(
                  ScriptScope::Entity,
                  resolvedOwner,
                  ResolveSourceBinding(source));
'''
          service = replace_once(
              service,
              old_attach,
              new_attach,
              "ScriptAuthoringService AttachEntitySource")
          service_path.write_text(service, encoding="utf-8", newline="\n")

          # Remove the preceding speculative metadata re-enumeration patch.
          identity_path = Path("EngineBridge/src/IdentityService.cpp")
          identity = identity_path.read_text(encoding="utf-8")
          speculative = r'''
              // Wicked's FindAllEntities() is normally sufficient, but creator
              // metadata can temporarily outlive the component stores during an
              // imported/reusable hierarchy adoption. The metadata store is the
              // authoritative owner of Renegade persistent IDs, so include its
              // entities explicitly before building the identity index. This does
              // not weaken validation: every included entity is still required to
              // carry one valid, unique persistent ID.
              for (std::size_t index = 0; index < scene.metadatas.GetCount(); ++index)
              {
                  const wi::ecs::Entity entity = scene.metadatas.GetEntity(index);
                  if (entity != wi::ecs::INVALID_ENTITY)
                      discovered.insert(entity);
              }
'''
          identity = replace_once(
              identity,
              speculative,
              "",
              "IdentityService speculative patch removal")
          identity_path.write_text(identity, encoding="utf-8", newline="\n")

          regression = r'''#include "RuntimeScriptRuntime.h"
          #include "RuntimeBootstrap.h"

          #include "renegade/bridge/IdentityService.h"
          #include "renegade/bridge/ReusableAssetInstanceService.h"
          #include "renegade/bridge/ScriptAuthoringService.h"
          #include "renegade/bridge/ScriptDocumentService.h"
          #include "renegade/bridge/StudioSession.h"
          #include "renegade/bridge/TestLevelSnapshotService.h"

          #include <cmath>
          #include <filesystem>
          #include <fstream>
          #include <iostream>
          #include <string>
          #include <vector>

          namespace
          {
              namespace fs = std::filesystem;
              using namespace renegade::bridge;
              using namespace renegade::runtime;

              int Fail(const std::string& message)
              {
                  std::cerr << "S5 reusable script owner regression failed: "
                            << message << '\n';
                  return 1;
              }

              bool WriteText(
                  const fs::path& path,
                  const std::string& text,
                  std::string& error)
              {
                  std::error_code ec;
                  fs::create_directories(path.parent_path(), ec);
                  if (ec)
                  {
                      error = "could not create fixture directory: " + ec.message();
                      return false;
                  }
                  std::ofstream stream(path, std::ios::binary | std::ios::trunc);
                  if (!stream)
                  {
                      error = "could not open fixture file";
                      return false;
                  }
                  stream << text;
                  if (!stream)
                  {
                      error = "could not write fixture file";
                      return false;
                  }
                  error.clear();
                  return true;
              }

              bool WriteReusableSceneTemplate(
                  const fs::path& path,
                  std::string& error)
              {
                  std::error_code ec;
                  fs::create_directories(path.parent_path(), ec);
                  if (ec)
                  {
                      error = "could not create template directory: " + ec.message();
                      return false;
                  }

                  wi::scene::Scene scene;
                  const wi::ecs::Entity wrapper =
                      scene.Entity_CreateTransform("S5 Reusable Barrel");
                  const wi::ecs::Entity payload =
                      scene.Entity_CreateTransform("Imported Barrel Payload");
                  scene.Component_Attach(payload, wrapper, true);

                  auto& wrapperMetadata = scene.metadatas.Create(wrapper);
                  wrapperMetadata.string_values.set(
                      ReusableAssetInstanceIdMetadataKey,
                      GenerateStableId());
                  auto& payloadMetadata = scene.metadatas.Create(payload);
                  payloadMetadata.bool_values.set(
                      ReusableAssetPayloadRootMetadataKey,
                      true);

                  wi::Archive archive(path.generic_u8string(), false, false);
                  if (!archive.IsOpen())
                  {
                      error = "could not create template WISCENE";
                      return false;
                  }
                  archive.SetCompressionEnabled(true);
                  scene.Serialize(archive);
                  const bool saved = archive.SaveFile(path.generic_u8string());
                  archive = wi::Archive();
                  if (!saved || !fs::is_regular_file(path))
                  {
                      error = "could not save template WISCENE";
                      return false;
                  }
                  error.clear();
                  return true;
              }

              wi::ecs::Entity FindNamedEntity(
                  const wi::scene::Scene& scene,
                  const std::string& name)
              {
                  for (std::size_t index = 0; index < scene.names.GetCount(); ++index)
                  {
                      if (scene.names[index].name == name)
                          return scene.names.GetEntity(index);
                  }
                  return wi::ecs::INVALID_ENTITY;
              }

              const ScriptAuthoringSource* FindSource(
                  const std::vector<ScriptAuthoringSource>& sources,
                  const std::string& path)
              {
                  for (const auto& source : sources)
                  {
                      if (source.sourcePath == path)
                          return &source;
                  }
                  return nullptr;
              }

              bool Near(const float left, const float right) noexcept
              {
                  return std::fabs(left - right) < 0.0001f;
              }
          }

          int main()
          {
              using namespace renegade::bridge;
              using namespace renegade::runtime;

              const fs::path root = fs::temp_directory_path() /
                  fs::u8path("renegade-s5-reusable-owner-" + GenerateStableId());
              const fs::path projectsRoot = root / "Projects";
              const fs::path templateScene = root / "Template.wiscene";
              std::error_code ec;
              fs::create_directories(projectsRoot, ec);
              if (ec)
                  return Fail("create projects root: " + ec.message());

              std::string error;
              if (!WriteReusableSceneTemplate(templateScene, error))
                  return Fail("write reusable template: " + error);

              StudioSession session;
              session.Projects().Initialize((root / "editor-state.ini").generic_u8string());
              if (!session.Projects().CreateProject(
                      projectsRoot.generic_u8string(),
                      "S5ReusableOwner",
                      templateScene.generic_u8string()))
              {
                  return Fail("stage project: " + session.Projects().LastError());
              }

              const std::string scenePath = session.Projects().StartupScenePath();
              if (scenePath.empty() || !session.LoadScene(scenePath))
                  return Fail("load project startup Scene");

              const auto& project = session.Projects().CurrentProject();
              DocumentEnvelope sceneEnvelope = CreateDocumentEnvelope(
                  project.projectId,
                  "scene",
                  project.startupScene,
                  "s5-reusable-owner-regression");
              if (!WriteDocumentEnvelope(scenePath + ".rmeta", sceneEnvelope, error))
                  return Fail("write Scene identity: " + error);
              if (!session.SaveScene(scenePath))
                  return Fail("save Scene to assign persistent identities");

              auto& scene = session.Scenes().GetScene();
              const wi::ecs::Entity wrapper =
                  FindNamedEntity(scene, "S5 Reusable Barrel");
              const wi::ecs::Entity payload =
                  FindNamedEntity(scene, "Imported Barrel Payload");
              if (wrapper == wi::ecs::INVALID_ENTITY ||
                  payload == wi::ecs::INVALID_ENTITY ||
                  !scene.Entity_IsDescendant(payload, wrapper))
              {
                  return Fail("reusable wrapper/payload hierarchy did not survive load");
              }

              const StableId wrapperId = PersistentEntityId(scene, wrapper);
              const StableId payloadId = PersistentEntityId(scene, payload);
              if (!IsValidStableId(wrapperId) || !IsValidStableId(payloadId) ||
                  wrapperId == payloadId)
              {
                  return Fail("wrapper/payload persistent identities are invalid");
              }

              const std::string scriptRelative =
                  "Content/Scripts/s5_reusable_move.lua";
              const fs::path scriptPath =
                  fs::u8path(project.rootPath) / fs::u8path(scriptRelative);
              if (!WriteText(
                      scriptPath,
                      "if renegade and renegade.metadata then\n"
                      " renegade.metadata({schema_version=1,name='S5 Reusable Move',category='Tests',role='SCRIPT',properties={}})\n"
                      "end\n"
                      "return {\n"
                      " on_start=function(self)\n"
                      "  assert(self.entity~=nil)\n"
                      "  assert(renegade.entity.get_name(self.entity)=='S5 Reusable Barrel')\n"
                      "  local ok,err=renegade.transform.translate_local(self.entity,{x=4,y=0,z=0})\n"
                      "  assert(ok and not err)\n"
                      " end\n"
                      "}\n",
                      error))
              {
                  return Fail("write movement script: " + error);
              }

              std::vector<ScriptAuthoringSource> sources;
              std::vector<ScriptMetadataDiagnostic> diagnostics;
              if (!session.Scripts().EnumerateProjectSources(
                      ScriptPresentation::Script,
                      sources,
                      diagnostics,
                      error))
              {
                  return Fail("enumerate SCRIPT sources: " + error);
              }
              const ScriptAuthoringSource* source = FindSource(sources, scriptRelative);
              if (source == nullptr)
                  return Fail("movement script was not discoverable");

              // Reproduce the real editor path: viewport picking can select an
              // imported payload child. Script authoring must promote that child
              // to the durable reusable wrapper before writing the attachment.
              StableId scriptInstanceId;
              if (!session.Scripts().AttachEntitySource(
                      payloadId,
                      *source,
                      scriptInstanceId,
                      error))
              {
                  return Fail("attach via imported payload child: " + error);
              }

              const ScriptDocument* document = session.Scripts().Document();
              const ScriptAttachment* attachment = document == nullptr
                  ? nullptr
                  : FindScriptAttachment(*document, scriptInstanceId);
              if (attachment == nullptr || attachment->ownerEntityId != wrapperId)
              {
                  return Fail(
                      "imported child attachment was not canonicalized to the reusable wrapper");
              }
              if (session.Scripts().EntityAttachments(
                      payloadId,
                      ScriptPresentation::Script).size() != 1)
              {
                  return Fail(
                      "Inspector child selection did not resolve wrapper-owned attachment");
              }

              // Simulate reusable payload replacement/reimport. The selected
              // imported child disappears, while creator-owned wrapper state and
              // its script attachment must remain valid.
              scene.Entity_Remove(payload);
              const wi::ecs::Entity replacement =
                  scene.Entity_CreateTransform("Imported Barrel Payload Replacement");
              scene.Component_Attach(replacement, wrapper, true);
              auto& replacementMetadata = scene.metadatas.Create(replacement);
              replacementMetadata.bool_values.set(
                  ReusableAssetPayloadRootMetadataKey,
                  true);
              if (!AssignNewPersistentEntityId(scene, replacement, error))
                  return Fail("assign replacement payload identity: " + error);

              if (!ValidateScriptDocumentAgainstScene(*document, scene, error))
              {
                  return Fail(
                      "wrapper-owned attachment became invalid after payload replacement: " +
                      error);
              }

              TestLevelSnapshotService snapshots(
                  session.Scenes(),
                  session.Commands(),
                  &session.Scripts());
              TestLevelSnapshot snapshot;
              if (!snapshots.Create(project, snapshot, error))
                  return Fail("real Test Level snapshot: " + error);

              const auto launch = ParseRuntimeLaunchArguments(
                  {"dx12", "--project", snapshot.descriptorPath});
              if (!launch.succeeded)
                  return Fail("snapshot launch arguments: " + launch.message);
              const auto resolved = ResolveRuntimeProject(launch);
              if (!resolved.succeeded)
                  return Fail("snapshot project resolution: " + resolved.message);

              SceneService runtimeScenes;
              const auto loaded = LoadRuntimeProjectScene(runtimeScenes, resolved);
              if (!loaded.succeeded)
                  return Fail("snapshot Runtime Scene load: " + loaded.message);

              RuntimeScriptRuntime runtime;
              if (!runtime.StartSceneFromCompanion(
                      resolved.startupScenePath,
                      project.projectId,
                      runtimeScenes.GetScene(),
                      snapshot.sessionDirectory,
                      error))
              {
                  return Fail("StartSceneFromCompanion: " + error);
              }
              if (runtime.ActiveInstanceCount() != 1 ||
                  runtime.DisabledInstanceCount() != 0 ||
                  !runtime.Diagnostics().empty())
              {
                  return Fail("Runtime did not start one healthy wrapper-owned script");
              }

              EntityIdentityIndex identities;
              if (!identities.Build(runtimeScenes.GetScene(), error))
                  return Fail("index Runtime Scene: " + error);
              const wi::ecs::Entity runtimeWrapper = identities.Resolve(wrapperId);
              const auto* transform = runtimeScenes.GetScene().transforms.GetComponent(
                  runtimeWrapper);
              if (runtimeWrapper == wi::ecs::INVALID_ENTITY ||
                  transform == nullptr || !Near(transform->translation_local.x, 4.0f))
              {
                  return Fail("wrapper-owned script did not move the reusable barrel");
              }

              runtime.StopScene();
              if (!snapshots.Cleanup(snapshot, error))
                  return Fail("cleanup Test Level snapshot: " + error);

              fs::remove_all(root, ec);
              std::cout
                  << "S5 REUSABLE SCRIPT OWNER PASS // imported child selection canonicalizes to stable wrapper and survives payload replacement through Test Level Runtime\n";
              return 0;
          }
          '''
          # Remove indentation introduced by this workflow's YAML block.
          import textwrap
          Path("Tests/S5ReusableScriptOwnerRegression.cpp").write_text(
              textwrap.dedent(regression), encoding="utf-8", newline="\n")

          cmake_path = Path("Tests/S5CoreGameplayApi.cmake")
          cmake = cmake_path.read_text(encoding="utf-8")
          cmake_anchor = r'''add_test(
              NAME RenegadeS5CoreGameplayLuaTests
              COMMAND RenegadeS5CoreGameplayLuaTests
          )
'''
          cmake_insert = cmake_anchor + r'''
          add_executable(RenegadeS5ReusableScriptOwnerTests
              ${CMAKE_CURRENT_LIST_DIR}/S5ReusableScriptOwnerRegression.cpp
          )

          target_link_libraries(
              RenegadeS5ReusableScriptOwnerTests
              PRIVATE
                  Renegade::RuntimeBootstrap
          )

          target_compile_options(
              RenegadeS5ReusableScriptOwnerTests
              PRIVATE
                  "$<$<CXX_COMPILER_ID:MSVC>:/utf-8>"
          )

          set_target_properties(
              RenegadeS5ReusableScriptOwnerTests
              PROPERTIES
                  FOLDER "Renegade/Tests"
          )

          # The fast S5A workflow already builds RenegadeS5CoreGameplayLuaTests.
          # Make the real reusable-owner regression part of that same target
          # graph so no additional full Studio build is needed for preflight.
          add_dependencies(
              RenegadeS5CoreGameplayLuaTests
              RenegadeS5ReusableScriptOwnerTests
          )
          add_dependencies(
              RenegadeBridgeTests
              RenegadeS5ReusableScriptOwnerTests
          )

          add_test(
              NAME RenegadeS5CoreGameplayLuaTestsReusableOwner
              COMMAND RenegadeS5ReusableScriptOwnerTests
          )
'''
          cmake = replace_once(
              cmake,
              cmake_anchor,
              cmake_insert,
              "S5 CMake owner regression")
          cmake_path.write_text(cmake, encoding="utf-8", newline="\n")

          # The patch workflow is intentionally one-shot and must not remain in
          # the product branch after it has applied the guarded edits.
          Path(".github/workflows/s5a-owner-repair-apply.yml").unlink()

      - name: Commit repair to PR branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add EngineBridge/src/ScriptAuthoringService.cpp \
                  EngineBridge/src/IdentityService.cpp \
                  Tests/S5CoreGameplayApi.cmake \
                  Tests/S5ReusableScriptOwnerRegression.cpp \
                  .github/workflows/s5a-owner-repair-apply.yml
          git diff --cached --check
          git commit -m "S5A: bind reusable child scripts to stable owner"
          git push origin HEAD:scripting/s5a-core-entity-transform
