name: JP01 staging asset-root selection repair

on:
  push:
    branches:
      - staging/jp01-owner-validation-fixes

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: staging/jp01-owner-validation-fixes
          fetch-depth: 0
      - name: Apply bounded JP01 creator-root repair
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          def read(path):
              return Path(path).read_text(encoding='utf-8')

          def write(path, text):
              Path(path).write_text(text, encoding='utf-8', newline='')

          def replace_once(path, old, new):
              text = read(path)
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected exactly one match, found {count}: {old[:100]!r}')
              write(path, text.replace(old, new, 1))

          def replace_regex_once(path, pattern, replacement, flags=re.S):
              text = read(path)
              updated, count = re.subn(pattern, replacement, text, count=1, flags=flags)
              if count != 1:
                  raise SystemExit(f'{path}: expected one regex match, found {count}: {pattern[:120]!r}')
              write(path, updated)

          # -----------------------------------------------------------------
          # Reusable asset identity: keep the transform wrapper, but make its
          # creator-facing title come from the governed product/import title.
          # -----------------------------------------------------------------
          path = 'EngineBridge/include/renegade/bridge/ReusableAssetInstanceService.h'
          replace_once(path,
              '    inline constexpr const char* ReusableAssetPayloadRootMetadataKey =\n'
              '        "renegade.reusable_asset_payload_root";\n'
              '    inline constexpr int ReusableAssetInstanceVersion = 1;\n',
              '    inline constexpr const char* ReusableAssetPayloadRootMetadataKey =\n'
              '        "renegade.reusable_asset_payload_root";\n'
              '    inline constexpr const char* ReusableAssetInstanceDisplayNameMetadataKey =\n'
              '        "renegade.reusable_asset_display_name";\n'
              '    inline constexpr int ReusableAssetInstanceVersion = 1;\n')
          replace_once(path,
              '    // Repairs only implementation-generated wrapper names. Existing creator\n'
              '    // names are never overwritten. Anonymous instances receive deterministic,\n'
              '    // unique names derived from their visible imported model hierarchy:\n'
              '    // crate002, crate002 (2), crate002 (3), ...\n'
              '    [[nodiscard]] std::size_t RepairReusableAssetInstanceNames(\n'
              '        wi::scene::Scene& scene) noexcept;\n',
              '    // Resolves any imported descendant to the stable creator-owned reusable\n'
              '    // asset root. Returns INVALID_ENTITY for ordinary/non-reusable entities.\n'
              '    [[nodiscard]] wi::ecs::Entity ResolveReusableAssetInstanceRoot(\n'
              '        const wi::scene::Scene& scene,\n'
              '        wi::ecs::Entity selectedEntity) noexcept;\n\n'
              '    // Returns every render object owned by a reusable root. This lets Studio\n'
              '    // present one whole-asset selection without flattening the imported scene.\n'
              '    void CollectReusableAssetRenderObjects(\n'
              '        const wi::scene::Scene& scene,\n'
              '        wi::ecs::Entity instanceRoot,\n'
              '        std::vector<wi::ecs::Entity>& renderObjects);\n\n'
              '    // Repairs only implementation-generated wrapper names. New placements use\n'
              '    // the governed product/import title persisted on the wrapper. Legacy scenes\n'
              '    // without that metadata retain the old hierarchy-derived fallback. Explicit\n'
              '    // creator names are never overwritten.\n'
              '    [[nodiscard]] std::size_t RepairReusableAssetInstanceNames(\n'
              '        wi::scene::Scene& scene) noexcept;\n')
          replace_once(path,
              '            StableId assetId,\n'
              '            const XMFLOAT3& placementPosition,\n'
              '            float scaleFactor);\n',
              '            StableId assetId,\n'
              '            const XMFLOAT3& placementPosition,\n'
              '            float scaleFactor,\n'
              '            std::string displayName = {});\n')
          replace_once(path,
              '            wi::ecs::Entity existingInstanceRoot,\n'
              '            wi::ecs::Entity existingPayloadRoot,\n'
              '            std::size_t firstMaterialIndex);\n',
              '            wi::ecs::Entity existingInstanceRoot,\n'
              '            wi::ecs::Entity existingPayloadRoot,\n'
              '            std::size_t firstMaterialIndex,\n'
              '            std::string displayName = {});\n')
          replace_once(path,
              '        StableId assetId_;\n'
              '        XMFLOAT3 placementPosition_ = {};\n',
              '        StableId assetId_;\n'
              '        std::string displayName_;\n'
              '        XMFLOAT3 placementPosition_ = {};\n')

          path = 'EngineBridge/src/ReusableAssetInstanceService.cpp'
          replace_once(path,
              '#include <utility>\n\nnamespace renegade::bridge\n{\n    namespace\n    {\n',
              '#include <filesystem>\n#include <utility>\n\nnamespace renegade::bridge\n{\n    namespace\n    {\n        namespace fs = std::filesystem;\n')
          marker = '''        bool IsGeneratedWrapperName(const std::string& value) noexcept\n        {\n'''
          insert = '''        std::string NormalizeReusableAssetDisplayName(const std::string& value)\n        {\n            if (value.empty())\n                return {};\n\n            const fs::path input = fs::u8path(value);\n            std::string filename = input.filename().generic_u8string();\n            if (filename.empty())\n                filename = value;\n\n            const fs::path title = fs::u8path(filename);\n            if (wi::helper::toUpper(title.extension().generic_u8string()) == ".RASSET")\n                return title.stem().generic_u8string();\n            return filename;\n        }\n\n'''
          replace_once(path, marker, insert + marker)
          replace_regex_once(path,
              r'''        bool ApplyReusableAssetName\(\n            wi::scene::Scene& scene,\n            const wi::ecs::Entity wrapper,\n            const wi::ecs::Entity payloadRoot\)\n        \{.*?            return true;\n        \}\n''',
              '''        bool ApplyReusableAssetName(\n            wi::scene::Scene& scene,\n            const wi::ecs::Entity wrapper,\n            const wi::ecs::Entity payloadRoot,\n            const std::string& requestedDisplayName = {})\n        {\n            auto* existing = scene.names.GetComponent(wrapper);\n            if (existing != nullptr && !IsGeneratedWrapperName(existing->name))\n            {\n                // Never overwrite an explicit creator-authored wrapper name.\n                return false;\n            }\n\n            std::string base = NormalizeReusableAssetDisplayName(requestedDisplayName);\n            if (base.empty())\n            {\n                const auto* metadata = scene.metadatas.GetComponent(wrapper);\n                if (metadata != nullptr && metadata->string_values.has(\n                        ReusableAssetInstanceDisplayNameMetadataKey))\n                {\n                    base = NormalizeReusableAssetDisplayName(\n                        metadata->string_values.get(\n                            ReusableAssetInstanceDisplayNameMetadataKey));\n                }\n            }\n            if (base.empty())\n            {\n                // Compatibility only for scenes created before Renegade persisted\n                // the governed product title on the reusable root.\n                base = DeriveReusableAssetName(scene, payloadRoot);\n            }\n            if (base.empty())\n                base = "Asset";\n\n            const std::string unique =\n                MakeUniqueReusableAssetName(scene, wrapper, base);\n            if (existing != nullptr)\n                existing->name = unique;\n            else\n                scene.names.Create(wrapper).name = unique;\n            return true;\n        }\n''')
          # Public reusable-root / render-set helpers.
          anchor = '''    std::size_t RepairReusableAssetInstanceNames(wi::scene::Scene& scene) noexcept\n    {\n'''
          helper = '''    wi::ecs::Entity ResolveReusableAssetInstanceRoot(\n        const wi::scene::Scene& scene,\n        const wi::ecs::Entity selectedEntity) noexcept\n    {\n        if (selectedEntity == wi::ecs::INVALID_ENTITY)\n            return wi::ecs::INVALID_ENTITY;\n\n        wi::ecs::Entity current = selectedEntity;\n        const std::size_t maximumDepth = scene.hierarchy.GetCount() + 1;\n        for (std::size_t depth = 0;\n            current != wi::ecs::INVALID_ENTITY && depth <= maximumDepth; ++depth)\n        {\n            const auto* metadata = scene.metadatas.GetComponent(current);\n            if (metadata != nullptr && metadata->string_values.has(\n                    ReusableAssetInstanceIdMetadataKey))\n            {\n                return current;\n            }\n            const auto* hierarchy = scene.hierarchy.GetComponent(current);\n            if (hierarchy == nullptr ||\n                hierarchy->parentID == wi::ecs::INVALID_ENTITY ||\n                hierarchy->parentID == current)\n            {\n                break;\n            }\n            current = hierarchy->parentID;\n        }\n        return wi::ecs::INVALID_ENTITY;\n    }\n\n    void CollectReusableAssetRenderObjects(\n        const wi::scene::Scene& scene,\n        const wi::ecs::Entity instanceRoot,\n        std::vector<wi::ecs::Entity>& renderObjects)\n    {\n        renderObjects.clear();\n        if (instanceRoot == wi::ecs::INVALID_ENTITY)\n            return;\n        for (std::size_t index = 0; index < scene.objects.GetCount(); ++index)\n        {\n            const wi::ecs::Entity entity = scene.objects.GetEntity(index);\n            if (entity == instanceRoot || scene.Entity_IsDescendant(entity, instanceRoot))\n                renderObjects.push_back(entity);\n        }\n    }\n\n'''
          replace_once(path, anchor, helper + anchor)
          # Constructor signatures and display-name capture.
          replace_once(path,
              '        StableId assetId,\n'
              '        const XMFLOAT3& placementPosition,\n'
              '        const float scaleFactor)\n'
              '        : scene_(&targetScene)\n'
              '        , preparedScene_(std::move(preparedScene))\n'
              '        , assetId_(std::move(assetId))\n',
              '        StableId assetId,\n'
              '        const XMFLOAT3& placementPosition,\n'
              '        const float scaleFactor,\n'
              '        std::string displayName)\n'
              '        : scene_(&targetScene)\n'
              '        , preparedScene_(std::move(preparedScene))\n'
              '        , assetId_(std::move(assetId))\n'
              '        , displayName_(NormalizeReusableAssetDisplayName(displayName))\n')
          replace_once(path,
              '        const wi::ecs::Entity existingPayloadRoot,\n'
              '        const std::size_t firstMaterialIndex)\n'
              '        : scene_(&targetScene)\n'
              '        , assetId_(std::move(assetId))\n',
              '        const wi::ecs::Entity existingPayloadRoot,\n'
              '        const std::size_t firstMaterialIndex,\n'
              '        std::string displayName)\n'
              '        : scene_(&targetScene)\n'
              '        , assetId_(std::move(assetId))\n'
              '        , displayName_(NormalizeReusableAssetDisplayName(displayName))\n')
          # Stamp product title metadata in both placement paths.
          old_stamp = '''                instanceMetadata.int_values.set(\n                    ReusableAssetInstanceVersionMetadataKey,\n                    ReusableAssetInstanceVersion);\n\n                auto* payloadMetadata = scene_->metadatas.GetComponent(payloadRoot_);\n'''
          new_stamp = '''                instanceMetadata.int_values.set(\n                    ReusableAssetInstanceVersionMetadataKey,\n                    ReusableAssetInstanceVersion);\n                if (!displayName_.empty())\n                {\n                    instanceMetadata.string_values.set(\n                        ReusableAssetInstanceDisplayNameMetadataKey, displayName_);\n                }\n\n                auto* payloadMetadata = scene_->metadatas.GetComponent(payloadRoot_);\n'''
          text = read(path)
          if text.count(old_stamp) != 2:
              raise SystemExit(f'{path}: expected two metadata stamp sites, found {text.count(old_stamp)}')
          write(path, text.replace(old_stamp, new_stamp))
          text = read(path)
          old_apply = '                ApplyReusableAssetName(*scene_, entity_, payloadRoot_);'
          if text.count(old_apply) != 2:
              raise SystemExit(f'{path}: expected two placement naming sites, found {text.count(old_apply)}')
          write(path, text.replace(old_apply,
              '                ApplyReusableAssetName(\n                    *scene_, entity_, payloadRoot_, displayName_);'))

          # Collision authoring uses the exact same reusable-root resolver as Studio.
          path = 'EngineBridge/src/CollisionService.cpp'
          replace_regex_once(path,
              r'''    wi::ecs::Entity ResolveCollisionAuthoringTarget\(\n        const wi::scene::Scene& scene,\n        const wi::ecs::Entity selectedEntity\) noexcept\n    \{.*?        return selectedEntity;\n    \}\n\n    bool FitPrimitiveCollisionStateToTarget''',
              '''    wi::ecs::Entity ResolveCollisionAuthoringTarget(\n        const wi::scene::Scene& scene,\n        const wi::ecs::Entity selectedEntity) noexcept\n    {\n        const wi::ecs::Entity reusableRoot =\n            ResolveReusableAssetInstanceRoot(scene, selectedEntity);\n        return reusableRoot != wi::ecs::INVALID_ENTITY\n            ? reusableRoot\n            : selectedEntity;\n    }\n\n    bool FitPrimitiveCollisionStateToTarget''')

          # Product title follows both click placement and drag/drop placement.
          path = 'Studio/src/CreatorAssetDragPreview.cpp'
          replace_once(path,
              '                preview.payloadRoot,\n'
              '                preview.firstMaterialIndex);\n',
              '                preview.payloadRoot,\n'
              '                preview.firstMaterialIndex,\n'
              '                preview.assetPath);\n')

          path = 'Studio/src/StudioApplication.cpp'
          replace_once(path,
              '            assetId,\n'
              '            position,\n'
              '            scale);\n',
              '            assetId,\n'
              '            position,\n'
              '            scale,\n'
              '            creatorAssetPlacementLabel_);\n')

          # Viewport clicks on any imported render leaf now select the same stable
          # creator root that appears at the top of the hierarchy.
          replace_regex_once(path,
              r'''        const auto picked = wi::scene::Pick\(\n            pickRay,\n            wi::enums::FILTER_OBJECT_ALL,\n            ~0u,\n            session_->Scenes\(\)\.GetScene\(\)\);\n        const auto current = session_->Selection\(\)\.SelectedEntity\(\);\n        if \(picked\.entity == current && !environmentWorkspaceActive_\)\n        \{\n            return false;\n        \}''',
              '''        auto& scene = session_->Scenes().GetScene();\n        const auto picked = wi::scene::Pick(\n            pickRay,\n            wi::enums::FILTER_OBJECT_ALL,\n            ~0u,\n            scene);\n        wi::ecs::Entity selection = picked.entity;\n        if (selection != wi::ecs::INVALID_ENTITY)\n        {\n            const wi::ecs::Entity reusableRoot =\n                bridge::ResolveReusableAssetInstanceRoot(scene, selection);\n            if (reusableRoot != wi::ecs::INVALID_ENTITY)\n                selection = reusableRoot;\n        }\n        const auto current = session_->Selection().SelectedEntity();\n        if (selection == current && !environmentWorkspaceActive_)\n        {\n            return false;\n        }''')
          replace_once(path,
              '        if (picked.entity == wi::ecs::INVALID_ENTITY ||\n'
              '            !session_->Scenes().IsHierarchyVisible(picked.entity))\n'
              '        {\n'
              '            session_->Selection().Clear();\n'
              '        }\n'
              '        else\n'
              '        {\n'
              '            session_->Selection().Select(picked.entity);\n'
              '        }\n',
              '        if (selection == wi::ecs::INVALID_ENTITY ||\n'
              '            !session_->Scenes().IsHierarchyVisible(selection))\n'
              '        {\n'
              '            session_->Selection().Clear();\n'
              '        }\n'
              '        else\n'
              '        {\n'
              '            session_->Selection().Select(selection);\n'
              '        }\n')

          # Whole-asset root selection outlines every render descendant while
          # explicit child selection still outlines only that child.
          replace_regex_once(path,
              r'''    void StudioRenderPath::ClearSelectionOutline\(\) noexcept\n    \{.*?    \}\n\n    void StudioRenderPath::SyncSelectionOutline\(\)\n    \{.*?    \}\n\n    void StudioRenderPath::SaveSceneAfterTransientCleanup''',
              '''    void StudioRenderPath::ClearSelectionOutline() noexcept\n    {\n        if (session_ != nullptr)\n        {\n            auto& scene = session_->Scenes().GetScene();\n            const std::size_t count = std::min(\n                outlinedEntities_.size(),\n                outlinedEntityPreviousStencils_.size());\n            for (std::size_t index = 0; index < count; ++index)\n            {\n                auto* object = scene.objects.GetComponent(outlinedEntities_[index]);\n                if (object != nullptr)\n                    object->SetUserStencilRef(outlinedEntityPreviousStencils_[index]);\n            }\n        }\n\n        outlinedSelection_ = wi::ecs::INVALID_ENTITY;\n        outlinedEntities_.clear();\n        outlinedEntityPreviousStencils_.clear();\n    }\n\n    void StudioRenderPath::SyncSelectionOutline()\n    {\n        if (environmentWorkspaceActive_)\n        {\n            ClearSelectionOutline();\n            return;\n        }\n        const auto selected = session_ != nullptr\n            ? session_->Selection().SelectedEntity()\n            : wi::ecs::INVALID_ENTITY;\n        if (selected == outlinedSelection_)\n            return;\n\n        ClearSelectionOutline();\n        if (session_ == nullptr || selected == wi::ecs::INVALID_ENTITY)\n            return;\n\n        auto& scene = session_->Scenes().GetScene();\n        const wi::ecs::Entity reusableRoot =\n            bridge::ResolveReusableAssetInstanceRoot(scene, selected);\n        if (reusableRoot == selected)\n        {\n            std::vector<wi::ecs::Entity> renderObjects;\n            bridge::CollectReusableAssetRenderObjects(\n                scene, reusableRoot, renderObjects);\n            for (const wi::ecs::Entity entity : renderObjects)\n            {\n                auto* object = scene.objects.GetComponent(entity);\n                if (object == nullptr)\n                    continue;\n                outlinedEntities_.push_back(entity);\n                outlinedEntityPreviousStencils_.push_back(object->userStencilRef);\n                object->SetUserStencilRef(SelectionStencilReference);\n            }\n            if (!outlinedEntities_.empty())\n                outlinedSelection_ = selected;\n            return;\n        }\n\n        auto* object = scene.objects.GetComponent(selected);\n        if (object == nullptr)\n            return;\n        outlinedSelection_ = selected;\n        outlinedEntities_.push_back(selected);\n        outlinedEntityPreviousStencils_.push_back(object->userStencilRef);\n        object->SetUserStencilRef(SelectionStencilReference);\n    }\n\n    void StudioRenderPath::SaveSceneAfterTransientCleanup''')

          path = 'Studio/src/StudioApplication.h'
          replace_once(path,
              '        wi::ecs::Entity gizmoEntity_ = wi::ecs::INVALID_ENTITY;\n'
              '        wi::ecs::Entity outlinedEntity_ = wi::ecs::INVALID_ENTITY;\n'
              '        std::uint8_t outlinedEntityPreviousStencil_ = 0;\n',
              '        wi::ecs::Entity gizmoEntity_ = wi::ecs::INVALID_ENTITY;\n'
              '        wi::ecs::Entity outlinedSelection_ = wi::ecs::INVALID_ENTITY;\n'
              '        std::vector<wi::ecs::Entity> outlinedEntities_;\n'
              '        std::vector<std::uint8_t> outlinedEntityPreviousStencils_;\n')

          # Owner regression now proves import-title root naming and keeps the
          # nested glTF object name separate from the creator-facing root.
          path = 'Tests/JP01ReusableAssetPhysicsTests.cpp'
          replace_once(path,
              '        const ReusableFixture& fixture)\n'
              '    {\n'
              '        if (auto* name = scene.names.GetComponent(fixture.wrapper))\n',
              '        const ReusableFixture& fixture,\n'
              '        const char* displayName = "Imported Crate.rasset")\n'
              '    {\n'
              '        if (auto* name = scene.names.GetComponent(fixture.wrapper))\n')
          replace_once(path,
              '                fixture.payload,\n'
              '                0));\n',
              '                fixture.payload,\n'
              '                0,\n'
              '                displayName));\n')
          replace_once(path,
              '    if (ResolveCollisionAuthoringTarget(scene, fixture.nested) != fixture.wrapper ||\n'
              '        ResolveCollisionAuthoringTarget(scene, fixture.payload) != fixture.wrapper ||\n'
              '        ResolveCollisionAuthoringTarget(scene, fixture.wrapper) != fixture.wrapper ||\n'
              '        ResolveCollisionAuthoringTarget(scene, outside) != outside)\n',
              '    if (ResolveCollisionAuthoringTarget(scene, fixture.nested) != fixture.wrapper ||\n'
              '        ResolveCollisionAuthoringTarget(scene, fixture.payload) != fixture.wrapper ||\n'
              '        ResolveCollisionAuthoringTarget(scene, fixture.wrapper) != fixture.wrapper ||\n'
              '        ResolveCollisionAuthoringTarget(scene, outside) != outside ||\n'
              '        ResolveReusableAssetInstanceRoot(scene, fixture.nested) != fixture.wrapper ||\n'
              '        ResolveReusableAssetInstanceRoot(scene, outside) != wi::ecs::INVALID_ENTITY)\n')
          replace_once(path,
              '    {\n'
              '        return Fail("reusable asset collision target did not resolve to stable root");\n'
              '    }\n\n'
              '    // Primitive fit is measured below the asset root, excluding the root\'s own\n',
              '    {\n'
              '        return Fail("reusable asset collision target did not resolve to stable root");\n'
              '    }\n'
              '    std::vector<wi::ecs::Entity> renderObjects;\n'
              '    CollectReusableAssetRenderObjects(scene, fixture.wrapper, renderObjects);\n'
              '    if (renderObjects.size() != 1 || renderObjects.front() != fixture.nested)\n'
              '        return Fail("whole-asset render descendant set was not resolved");\n\n'
              '    // Primitive fit is measured below the asset root, excluding the root\'s own\n')
          replace_once(path,
              '        "crate002", "crate002 (2)", "crate002 (3)"\n',
              '        "Imported Crate", "Imported Crate (2)", "Imported Crate (3)"\n')
          replace_once(path,
              '        if (name == nullptr || name->name != expectedNames[index])\n'
              '            return Fail("three same-asset instances did not receive unique creator names");\n',
              '        if (name == nullptr || name->name != expectedNames[index])\n'
              '            return Fail("three same-asset instances did not receive import-title creator names");\n'
              '        const auto* metadata =\n'
              '            threeScene.metadatas.GetComponent(three[index].wrapper);\n'
              '        if (metadata == nullptr || !metadata->string_values.has(\n'
              '                ReusableAssetInstanceDisplayNameMetadataKey) ||\n'
              '            metadata->string_values.get(\n'
              '                ReusableAssetInstanceDisplayNameMetadataKey) != "Imported Crate")\n'
              '        {\n'
              '            return Fail("reusable root did not persist its governed display title");\n'
              '        }\n'
              '        const auto* nestedName =\n'
              '            threeScene.names.GetComponent(three[index].nested);\n'
              '        if (nestedName == nullptr || nestedName->name != "crate002")\n'
              '            return Fail("imported render child name was rewritten by root naming");\n')

          # Source contracts: active-on-add is intentional, and creator-root
          # title/selection is locked so CI cannot regress to the duplicate UX.
          path = 'Tests/JP01PhysicsLabSourceContract.cmake'
          replace_once(path,
              '    "bool startDeactivated = true;"\n'
              '    "Wicked-editor start-deactivated rigid-body default")\n',
              '    "bool startDeactivated = false;"\n'
              '    "creator dynamic rigid bodies start active by default")\n')

          path = 'Tests/JP01HardeningSourceContract.cmake'
          # Add Studio application source to contract inputs.
          replace_once(path,
              'set(PHYSICS_WORKSPACE_SOURCE "${RENEGADE_SOURCE_DIR}/Studio/src/RenegadePhysicsLabWorkspace.cpp")\n'
              'set(REUSABLE_TEST "${RENEGADE_SOURCE_DIR}/Tests/JP01ReusableAssetPhysicsTests.cpp")\n',
              'set(PHYSICS_WORKSPACE_SOURCE "${RENEGADE_SOURCE_DIR}/Studio/src/RenegadePhysicsLabWorkspace.cpp")\n'
              'set(STUDIO_SOURCE "${RENEGADE_SOURCE_DIR}/Studio/src/StudioApplication.cpp")\n'
              'set(REUSABLE_TEST "${RENEGADE_SOURCE_DIR}/Tests/JP01ReusableAssetPhysicsTests.cpp")\n')
          replace_once(path,
              '    "${PHYSICS_WORKSPACE_SOURCE}"\n'
              '    "${REUSABLE_TEST}"\n',
              '    "${PHYSICS_WORKSPACE_SOURCE}"\n'
              '    "${STUDIO_SOURCE}"\n'
              '    "${REUSABLE_TEST}"\n')
          replace_once(path,
              'file(READ "${PHYSICS_WORKSPACE_SOURCE}" physics_workspace_source)\n'
              'file(READ "${REUSABLE_TEST}" reusable_test)\n',
              'file(READ "${PHYSICS_WORKSPACE_SOURCE}" physics_workspace_source)\n'
              'file(READ "${STUDIO_SOURCE}" studio_source)\n'
              'file(READ "${REUSABLE_TEST}" reusable_test)\n')
          # Strengthen naming/selection contract while keeping legacy fallback allowed.
          replace_once(path,
              'require_text(reusable_header\n'
              '    "RepairReusableAssetInstanceNames"\n'
              '    "legacy wrapper-name repair API")\n',
              'require_text(reusable_header\n'
              '    "RepairReusableAssetInstanceNames"\n'
              '    "legacy wrapper-name repair API")\n'
              'require_text(reusable_header\n'
              '    "ReusableAssetInstanceDisplayNameMetadataKey"\n'
              '    "persistent creator-facing product title")\n'
              'require_text(reusable_header\n'
              '    "ResolveReusableAssetInstanceRoot("\n'
              '    "shared reusable-root selection resolver")\n'
              'require_text(reusable_header\n'
              '    "CollectReusableAssetRenderObjects("\n'
              '    "whole-asset render descendant resolver")\n')
          replace_once(path,
              'require_text(reusable_instance_source\n'
              '    "std::string DeriveReusableAssetName("\n'
              '    "creator-facing reusable root name derivation")\n',
              'require_text(reusable_instance_source\n'
              '    "NormalizeReusableAssetDisplayName"\n'
              '    "governed product title normalization")\n'
              'require_text(reusable_instance_source\n'
              '    "Compatibility only for scenes created before Renegade persisted"\n'
              '    "legacy hierarchy-name fallback boundary")\n')
          replace_once(path,
              'require_text(reusable_test\n'
              '    "\\\"crate002\\\", \\\"crate002 (2)\\\", \\\"crate002 (3)\\\""\n'
              '    "unique creator root-name regression")\n',
              'require_text(reusable_test\n'
              '    "\\\"Imported Crate\\\", \\\"Imported Crate (2)\\\", \\\"Imported Crate (3)\\\""\n'
              '    "import-title creator root-name regression")\n'
              'require_text(studio_source\n'
              '    "ResolveReusableAssetInstanceRoot(scene, selection)"\n'
              '    "viewport reusable-child promotion to creator root")\n'
              'require_text(studio_source\n'
              '    "CollectReusableAssetRenderObjects("\n'
              '    "whole-asset root selection outline")\n'
              'require_text(studio_source\n'
              '    "outlinedEntityPreviousStencils_"\n'
              '    "multi-object stencil restoration")\n')

          # Recovery doc: make the hierarchy/selection contract explicit.
          path = 'docs/JP01_REUSABLE_ASSET_RIGID_BODY_OWNER_RECOVERY.md'
          text = read(path)
          text = text.replace(
