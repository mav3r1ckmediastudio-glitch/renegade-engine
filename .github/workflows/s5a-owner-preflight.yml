name: S5A owner workflow preflight

on:
  push:
    branches:
      - scripting/s5a-core-entity-transform

permissions:
  contents: write

jobs:
  preflight:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: scripting/s5a-core-entity-transform
          fetch-depth: 0

      - name: Apply guarded owner-workflow fixes
        run: python tools/s5a_owner_workflow_fix.py

      - name: Validate source contracts and diff hygiene
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          cmake -DRENEGADE_SOURCE_DIR="$PWD" -P Tests/S5CoreGameplayApiSourceContract.cmake
          cmake -DRENEGADE_SOURCE_DIR="$PWD" -P Tests/S4BScriptAuthoringSourceContract.cmake
          grep -F "transform->UpdateTransform();" Runtime/src/RuntimeScriptEntityApi.cpp
          grep -F "Story Flow-style reopen preserves exact SCRIPT sourcePath/sourceId" Tests/S4BScriptAuthoringTests.cpp
          grep -F "selectedSourcePath" Studio/src/S4BScriptAttachmentInspector.cpp

      - name: Commit preflighted repair
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/s5a-owner-preflight.yml
          rm tools/s5a_owner_workflow_fix.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "S5A: fix owner workflow movement and source persistence"
          git push origin HEAD:scripting/s5a-core-entity-transform
