name: Apply bounded importer A1 diagnostics

# One small GitHub-hosted source-editing job, NOT the Windows build matrix.
# Only the initial commit of this workflow activates it. Subsequent source
# commits do not match this path, so there is no CI loop.
on:
  push:
    branches:
      - feature/importer-a1-diagnostics
    paths:
      - .github/workflows/importer-a1-apply.yml

permissions:
  contents: write

jobs:
  apply:
    if: github.event.head_commit.message == 'Importer A1: run GitHub-only diagnostic patch'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out exact feature branch (no submodules or private assets)
        uses: actions/checkout@v4
        with:
          ref: feature/importer-a1-diagnostics
          persist-credentials: true
          submodules: false
      - name: Apply audited exact-anchor patch and verify diff
        shell: bash
        run: |
          set -euo pipefail
          python3 Tools/ImporterA1Apply.py
          python3 Tools/ImporterA1Polish.py
          git diff --check
          git diff --stat
          git diff -- EngineBridge/include/renegade/bridge/CreatorAssetWorkflowService.h EngineBridge/include/renegade/bridge/ReusableAssetService.h
      - name: Commit source changes to feature branch only
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add EngineBridge/include/renegade/bridge/ReusableAssetService.h EngineBridge/include/renegade/bridge/CreatorAssetWorkflowService.h EngineBridge/src/ReusableAssetService.cpp EngineBridge/src/CreatorAssetWorkflowService.cpp Studio/src/StudioApplication.cpp
          git diff --cached --check
          git diff --cached --quiet && { echo 'No source changes: refusing empty commit'; exit 1; }
          git commit -m 'Importer A1: wire truthful stages and show full native backlog diagnostics'
          git push origin HEAD:refs/heads/feature/importer-a1-diagnostics
