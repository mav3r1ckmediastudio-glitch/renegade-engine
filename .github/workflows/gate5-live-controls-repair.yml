name: Gate 5 live controls repair

on:
  push:
    branches:
      - staging/phase5-gate5-live-controls

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 5

      - name: Guard owner-tested base and helper-only staging
        shell: bash
        run: |
          set -euo pipefail
          base=93086a614d2dc58b4d18877849ff9e64980a1cdc
          git merge-base --is-ancestor "$base" HEAD
          unexpected="$(git diff --name-only "$base"..HEAD | grep -Ev '^\.github/(workflows/gate5-live-controls-repair\.yml|scripts/gate5_live_controls_repair\.py)$' || true)"
          test -z "$unexpected"

      - name: Apply bounded Gate 5 functional repair
        shell: bash
        run: |
          set -euo pipefail
          python .github/scripts/gate5_live_controls_repair.py
          git diff --check
          cmake -DRENEGADE_SOURCE_DIR="$PWD" -P Tests/Phase5Gate5SourceContract.cmake

      - name: Verify exact product surface
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/expected.txt <<'EOF'
          EngineBridge/include/renegade/bridge/RenderSettingsService.h
          EngineBridge/src/RenderSettingsService.cpp
          Runtime/src/RuntimeApplication.cpp
          Studio/src/Phase5Gate5RenderWorkspace.cpp
          Tests/Phase5Gate5RenderSettingsTests.cpp
          Tests/Phase5Gate5SourceContract.cmake
          EOF
          git diff --name-only | sort > /tmp/actual.txt
          sort -o /tmp/expected.txt /tmp/expected.txt
          diff -u /tmp/expected.txt /tmp/actual.txt

      - name: Self-clean helpers and publish product commit
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/gate5-live-controls-repair.yml
          rm -f .github/scripts/gate5_live_controls_repair.py
          git add \
            EngineBridge/include/renegade/bridge/RenderSettingsService.h \
            EngineBridge/src/RenderSettingsService.cpp \
            Runtime/src/RuntimeApplication.cpp \
            Studio/src/Phase5Gate5RenderWorkspace.cpp \
            Tests/Phase5Gate5RenderSettingsTests.cpp \
            Tests/Phase5Gate5SourceContract.cmake \
            .github/workflows/gate5-live-controls-repair.yml \
            .github/scripts/gate5_live_controls_repair.py
          git diff --cached --check
          git config user.name "mav3r1ckmediastudio-glitch"
          git config user.email "mav3r1ckmediastudio@gmail.com"
          git commit -m "Phase 5 Gate 5: repair live render controls"
          git push origin HEAD:staging/phase5-gate5-live-controls
