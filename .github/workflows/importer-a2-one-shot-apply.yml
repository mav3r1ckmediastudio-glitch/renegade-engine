name: Apply bounded importer A2 evidence instrumentation

on:
  push:
    branches:
      - feature/importer-a2-roundtrip-root-cause
    paths:
      - .github/workflows/importer-a2-one-shot-apply.yml

permissions:
  contents: write

jobs:
  apply:
    if: github.repository == 'mav3r1ckmediastudio-glitch/renegade-engine' && github.ref == 'refs/heads/feature/importer-a2-roundtrip-root-cause'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Check out only the isolated A2 branch
        uses: actions/checkout@v4
        with:
          ref: feature/importer-a2-roundtrip-root-cause
          submodules: false
          fetch-depth: 1
      - name: Apply exact-anchor diagnostic changes and check source contracts
        shell: bash
        run: |
          set -euo pipefail
          python3 Tools/ImporterA2EvidencePatch.py
          python3 Tests/ImporterA1SourceContract.py
          git diff --check
          test "$(git diff --name-only | wc -l)" -eq 3
          git diff --name-only | grep -Fx 'EngineBridge/include/renegade/bridge/ImportService.h'
          git diff --name-only | grep -Fx 'EngineBridge/src/ImportServiceModel.cpp'
          git diff --name-only | grep -Fx 'Tests/ImportTests.cpp'
      - name: Commit exactly the three A2 instrumentation files
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- EngineBridge/include/renegade/bridge/ImportService.h EngineBridge/src/ImportServiceModel.cpp Tests/ImportTests.cpp
          git diff --cached --check
          git commit -m 'Importer A2: pinpoint rig round-trip evidence subgroup and save-stage drift'
          git push origin HEAD:feature/importer-a2-roundtrip-root-cause
