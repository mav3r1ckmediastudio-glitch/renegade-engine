name: PR58 Gate3 one-shot project hub patch

on:
  push:
    branches:
      - agent/pr58-project-hub-lifecycle-reliability

permissions:
  contents: write

jobs:
  apply-gate3:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out exact branch head
        uses: actions/checkout@v4
        with:
          ref: agent/pr58-project-hub-lifecycle-reliability
          fetch-depth: 0

      - name: Apply asserted Gate 3 source patch
        run: python3 Tools/PR58Gate3Apply.py

      - name: Validate and commit real source
        shell: bash
        run: |
          rm .github/workflows/pr58-gate3-apply.yml
          rm Tools/PR58Gate3Apply.py
          git config user.name "mav3r1ckmediastudio-glitch"
          git config user.email "mav3r1ckmediastudio@gmail.com"
          git add Studio/src/StudioApplication.cpp .github/workflows/pr58-gate3-apply.yml Tools/PR58Gate3Apply.py
          git diff --cached --check
          git commit -m "gate3: rebuild project hub presentation"
          git push origin HEAD:agent/pr58-project-hub-lifecycle-reliability
