name: Apply S4B Inspector integration

on:
  push:
    branches:
      - scripting/s4b-action-script-inspector
    paths:
      - .github/workflows/apply-s4b-inspector-integration.yml

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: scripting/s4b-action-script-inspector
          fetch-depth: 0
      - name: Patch S1B registry integration
        shell: python
        run: |
          from pathlib import Path

          path = Path('Studio/src/S1BInspectorSectionMigration.cpp')
          text = path.read_text(encoding='utf-8')

          old = '#include "InspectorSectionFramework.h"\n'
          new = '#include "InspectorSectionFramework.h"\n#include "S4BScriptAttachmentInspector.h"\n'
          if new not in text:
              if old not in text:
                  raise SystemExit('include anchor not found')
              text = text.replace(old, new, 1)

          old = '''        if (!inspectorSectionRegistry_.Register(std::move(materials), error))\n            studioChrome_.SetStatusText("S1B INSPECTOR // " + error);\n    }\n'''
          new = '''        if (!inspectorSectionRegistry_.Register(std::move(materials), error))\n            studioChrome_.SetStatusText("S1B INSPECTOR // " + error);\n\n        RegisterS4BScriptAttachmentInspector(\n            *this,\n            inspectorPanel_,\n            inspectorSectionRegistry_,\n            [this]() { RefreshInspector(); },\n            [this](std::string status)\n            {\n                studioChrome_.SetStatusText(std::move(status));\n            });\n    }\n'''
          if 'RegisterS4BScriptAttachmentInspector(' not in text:
              if old not in text:
                  raise SystemExit('registration anchor not found')
              text = text.replace(old, new, 1)

          old = '        for (const char* sectionId : {"transform", "rendering", "materials"})\n'
          new = '        for (const char* sectionId : {"transform", "rendering", "materials", S4BActionSectionId, S4BScriptSectionId})\n'
          if new not in text:
              if old not in text:
                  raise SystemExit('disclosure anchor not found')
              text = text.replace(old, new, 1)

          old = '''    void StudioRenderPath::LayoutS1BInspectorSections()\n    {\n        transformSectionHeader_.SetVisible(false);\n'''
          new = '''    void StudioRenderPath::LayoutS1BInspectorSections()\n    {\n        PrepareS4BScriptAttachmentInspector(*this);\n        transformSectionHeader_.SetVisible(false);\n'''
          if 'PrepareS4BScriptAttachmentInspector(*this);' not in text:
              if old not in text:
                  raise SystemExit('layout anchor not found')
              text = text.replace(old, new, 1)

          path.write_text(text, encoding='utf-8')
      - name: Commit integration and remove helper
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/apply-s4b-inspector-integration.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Studio/src/S1BInspectorSectionMigration.cpp .github/workflows/apply-s4b-inspector-integration.yml
          git commit -m "S4B: integrate scripting providers with Inspector registry"
          git push origin HEAD:scripting/s4b-action-script-inspector
