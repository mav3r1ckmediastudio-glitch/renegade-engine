name: PR58 Gate3 concept-authoritative rework

on:
  push:
    branches:
      - agent/pr58-project-hub-lifecycle-reliability

permissions:
  contents: write

jobs:
  apply-gate3-concept-rework:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out exact branch head
        uses: actions/checkout@v4
        with:
          ref: agent/pr58-project-hub-lifecycle-reliability
          fetch-depth: 0

      - name: Apply asserted concept-authoritative Hub integration
        run: python3 Tools/pr58_gate3_concept_rework.py

      - name: Validate and commit real source
        shell: bash
        run: |
          git diff --check
          test ! -e .github/workflows/pr58-gate3-concept-rework.yml
          test ! -e Tools/pr58_gate3_concept_rework.py
          git add -A
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "gate3: rebuild project hub from owner concept"
          git push origin HEAD:agent/pr58-project-hub-lifecycle-reliability
