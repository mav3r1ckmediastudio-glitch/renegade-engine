          Path("docs/STORY_FLOW_GATE3_FOUNDATION.md").write_text(dedent(r'''\
          # Story Flow Gate 3 — Dedicated Workspace and Authoring Foundation

          **Status:** stacked implementation in progress; Gate 2 remains the prerequisite branch until merged.

          **Stacked base:** `agent/story-flow-gate2-screen-semantics`

          ## Purpose

          Gate 3 retires the temporary Gate 1 overlay architecture and introduces the semantic mutation/history layer required by the real Graph editor. This document records the first bounded Gate 3 slice; it does not declare Gate 3 complete.

          ## Dedicated render-path promotion

          Story Flow now owns a dedicated `StoryFlowRenderPath` derived from Wicked `RenderPath2D`. `StudioApplication` switches the active Wicked render path after the current project/startup Flow has been resolved. While Story Flow is active, `StudioRenderPath` is not the active path, so the 3D Level Editor does not continue its normal update/render loop underneath the Story Flow surface.

          The Project Hub remains owned by the existing Studio path. A native `HUB` action on the Story Flow header relinquishes Story Flow ownership and returns the active path to the existing Hub path.

          This is the locked architecture:

          `Project Hub -> Story Flow render path`

          Later Gate 4 and Gate 5 lifecycle work extends the same coordinator with:

          `Story Flow -> Level Editor -> Story Flow`

          `Story Flow -> Screen Editor -> Story Flow`

          ## Flow authoring session

          `StoryFlowAuthoringSession` is presentation-independent and owns:

          - the currently validated `FlowDocument`;
          - Flow-specific Undo/Redo history;
          - dirty/saved history position;
          - transactional save through the existing `WriteFlowDocument` seam;
          - reopen/reload;
          - rename, node add/delete and route add/update/delete mutations;
          - permanent Game Start deletion protection;
          - atomic removal of routes attached to a deleted node;
          - validation before any mutation enters history.

          Layout is deliberately absent from this session. Graph/Journey positioning continues to use the separate Story Flow layout document, preserving the programme-wide rule that presentation state cannot become Runtime truth.

          ## Automated proof in this slice

          `RenegadeStoryFlowAuthoringSessionTests` verifies:

          - clean open;
          - rename -> dirty -> undo -> clean -> redo;
          - transactional save and reopen;
          - terminal node creation;
          - route creation and priority/condition editing;
          - atomic node/route deletion;
          - permanent Game Start protection;
          - invalid semantic edits fail before history mutation;
          - Screen nodes/routes participate in the same history;
          - redo history and clean reload boundaries.

          ## Still required before Gate 3 acceptance

          This foundation is not the finished Graph editor. Remaining Gate 3 work includes wiring these authoring operations into native Graph controls, route reconnection/Inspector editing, semantic save/dirty affordances, Graph-specific presentation movement, validation display, and final dedicated-workspace owner acceptance. Journey View remains Gate 6.
          '''), encoding="utf-8")

