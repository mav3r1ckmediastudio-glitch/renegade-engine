name: Story Flow Gate 3 foundation patch

on:
  push:
    branches:
      - agent/story-flow-gate3-renderpath-graph-authoring
    paths:
      - ".github/workflows/story-flow-gate3-foundation-patch.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/story-flow-gate3-renderpath-graph-authoring
          fetch-depth: 0

      - name: Apply bounded Gate 3 foundation
        shell: python
        run: |
          from pathlib import Path
          from textwrap import dedent

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text(encoding="utf-8")
              if text.count(old) != 1:
                  raise SystemExit(f"{path}: expected anchor exactly once")
              p.write_text(text.replace(old, new), encoding="utf-8")

          Path("EngineBridge/include/renegade/bridge/StoryFlowAuthoringSession.h").write_text(dedent(r'''\
          #pragma once

          #include "renegade/bridge/FlowService.h"

          #include <cstddef>
          #include <string>
          #include <vector>

          namespace renegade::bridge
          {
              // Gate 3 semantic authoring boundary. It owns one validated Flow document,
              // a Flow-specific history, dirty/save state and transactional persistence.
              // Presentation layout remains outside this class by design.
              class StoryFlowAuthoringSession final
              {
              public:
                  [[nodiscard]] bool Open(
                      const std::string& filePath,
                      const StableId& expectedProjectId,
                      std::string& error);
                  [[nodiscard]] bool Reload(std::string& error);
                  [[nodiscard]] bool Save(std::string& error);
                  void Clear() noexcept;

                  [[nodiscard]] bool RenameNode(
                      const StableId& nodeId,
                      std::string name,
                      std::string& error);
                  [[nodiscard]] bool AddNode(
                      FlowNode node,
                      StableId& createdNodeId,
                      std::string& error);
                  [[nodiscard]] bool DeleteNode(
                      const StableId& nodeId,
                      std::string& error);

                  [[nodiscard]] bool AddRoute(
                      FlowRoute route,
                      StableId& createdRouteId,
                      std::string& error);
                  [[nodiscard]] bool UpdateRoute(
                      const StableId& routeId,
                      FlowRoute route,
                      std::string& error);
                  [[nodiscard]] bool DeleteRoute(
                      const StableId& routeId,
                      std::string& error);

                  [[nodiscard]] bool Undo(std::string& error);
                  [[nodiscard]] bool Redo(std::string& error);

                  [[nodiscard]] bool IsLoaded() const noexcept;
                  [[nodiscard]] bool IsDirty() const noexcept;
                  [[nodiscard]] bool CanUndo() const noexcept;
                  [[nodiscard]] bool CanRedo() const noexcept;
                  [[nodiscard]] std::size_t UndoCount() const noexcept;
                  [[nodiscard]] std::size_t RedoCount() const noexcept;
                  [[nodiscard]] const FlowDocument& Document() const noexcept;
                  [[nodiscard]] const std::string& FilePath() const noexcept;
                  [[nodiscard]] const StableId& ProjectId() const noexcept;

              private:
                  static constexpr std::size_t InvalidHistoryIndex =
                      static_cast<std::size_t>(-1);
                  static constexpr std::size_t MaximumHistoryEntries = 256;

                  [[nodiscard]] bool Adopt(
                      FlowDocument document,
                      const StableId& expectedProjectId,
                      std::string filePath,
                      std::string& error);
                  [[nodiscard]] bool CommitMutation(
                      FlowDocument document,
                      std::string& error);

                  FlowDocument emptyDocument_;
                  std::vector<FlowDocument> history_;
                  std::size_t historyIndex_ = 0;
                  std::size_t savedHistoryIndex_ = InvalidHistoryIndex;
                  StableId projectId_;
                  std::string filePath_;
                  bool loaded_ = false;
              };
          }
          '''), encoding="utf-8")

          Path("EngineBridge/src/StoryFlowAuthoringSession.cpp").write_text(dedent(r'''\
          #include "renegade/bridge/StoryFlowAuthoringSession.h"

          #include <algorithm>
          #include <utility>

          namespace renegade::bridge
          {
              bool StoryFlowAuthoringSession::Open(
                  const std::string& filePath,
                  const StableId& expectedProjectId,
                  std::string& error)
              {
                  FlowDocument document;
                  if (!ReadFlowDocument(filePath, expectedProjectId, document, error))
                  {
                      return false;
                  }
                  return Adopt(
                      std::move(document),
                      expectedProjectId,
                      filePath,
                      error);
              }

              bool StoryFlowAuthoringSession::Reload(std::string& error)
              {
                  if (!loaded_ || filePath_.empty())
                  {
                      error = "Story Flow authoring session is not open.";
                      return false;
                  }

                  FlowDocument document;
                  if (!ReadFlowDocument(filePath_, projectId_, document, error))
                  {
                      return false;
                  }
                  return Adopt(
                      std::move(document),
                      projectId_,
                      filePath_,
                      error);
              }

              bool StoryFlowAuthoringSession::Save(std::string& error)
              {
                  if (!loaded_ || filePath_.empty())
                  {
                      error = "Story Flow authoring session is not open.";
                      return false;
                  }
                  if (!WriteFlowDocument(filePath_, Document(), error))
                  {
                      return false;
                  }
                  savedHistoryIndex_ = historyIndex_;
                  error.clear();
                  return true;
              }

              void StoryFlowAuthoringSession::Clear() noexcept
              {
                  history_.clear();
                  historyIndex_ = 0;
                  savedHistoryIndex_ = InvalidHistoryIndex;
                  projectId_.clear();
                  filePath_.clear();
                  loaded_ = false;
              }

              bool StoryFlowAuthoringSession::RenameNode(
                  const StableId& nodeId,
                  std::string name,
                  std::string& error)
              {
                  if (!loaded_)
                  {
                      error = "Story Flow authoring session is not open.";
                      return false;
                  }

                  FlowDocument candidate = Document();
                  const auto found = std::find_if(
                      candidate.nodes.begin(),
                      candidate.nodes.end(),
                      [&nodeId](const FlowNode& node)
                      {
                          return node.id == nodeId;
                      });
                  if (found == candidate.nodes.end())
                  {
                      error = "Story Flow node does not exist: " + nodeId;
                      return false;
                  }
                  if (found->name == name)
                  {
                      error.clear();
                      return true;
                  }
                  found->name = std::move(name);
                  return CommitMutation(std::move(candidate), error);
              }

              bool StoryFlowAuthoringSession::AddNode(
                  FlowNode node,
                  StableId& createdNodeId,
                  std::string& error)
              {
                  createdNodeId.clear();
                  if (!loaded_)
                  {
                      error = "Story Flow authoring session is not open.";
                      return false;
                  }
                  if (node.kind == FlowNodeKind::GameStart)
                  {
                      error = "The permanent Game Start node cannot be created by an authoring command.";
                      return false;
                  }
                  if (node.id.empty())
                  {
                      node.id = GenerateStableId();
                  }

                  FlowDocument candidate = Document();
                  const StableId proposedId = node.id;
                  candidate.nodes.push_back(std::move(node));
                  if (!CommitMutation(std::move(candidate), error))
                  {
                      return false;
                  }
                  createdNodeId = proposedId;
                  return true;
              }

              bool StoryFlowAuthoringSession::DeleteNode(
                  const StableId& nodeId,
                  std::string& error)
              {
                  if (!loaded_)
                  {
                      error = "Story Flow authoring session is not open.";
                      return false;
                  }

                  FlowDocument candidate = Document();
                  const auto found = std::find_if(
                      candidate.nodes.begin(),
                      candidate.nodes.end(),
                      [&nodeId](const FlowNode& node)
                      {
                          return node.id == nodeId;
                      });
                  if (found == candidate.nodes.end())
                  {
                      error = "Story Flow node does not exist: " + nodeId;
                      return false;
                  }
                  if (found->kind == FlowNodeKind::GameStart ||
                      candidate.startNodeId == nodeId)
                  {
                      error = "The permanent Game Start node cannot be deleted.";
                      return false;
                  }

                  candidate.nodes.erase(found);
                  candidate.routes.erase(
                      std::remove_if(
                          candidate.routes.begin(),
                          candidate.routes.end(),
                          [&nodeId](const FlowRoute& route)
                          {
                              return route.sourceNodeId == nodeId ||
                                  route.destinationNodeId == nodeId;
                          }),
                      candidate.routes.end());
                  return CommitMutation(std::move(candidate), error);
              }

              bool StoryFlowAuthoringSession::AddRoute(
                  FlowRoute route,
                  StableId& createdRouteId,
                  std::string& error)
              {
                  createdRouteId.clear();
                  if (!loaded_)
                  {
                      error = "Story Flow authoring session is not open.";
                      return false;
                  }
                  if (route.id.empty())
                  {
                      route.id = GenerateStableId();
                  }

                  FlowDocument candidate = Document();
                  const StableId proposedId = route.id;
                  candidate.routes.push_back(std::move(route));
                  if (!CommitMutation(std::move(candidate), error))
                  {
                      return false;
                  }
                  createdRouteId = proposedId;
                  return true;
              }

              bool StoryFlowAuthoringSession::UpdateRoute(
                  const StableId& routeId,
                  FlowRoute route,
                  std::string& error)
              {
                  if (!loaded_)
                  {
                      error = "Story Flow authoring session is not open.";
                      return false;
                  }
                  if (!route.id.empty() && route.id != routeId)
                  {
                      error = "A Story Flow route edit cannot change stable route identity.";
                      return false;
                  }

                  FlowDocument candidate = Document();
                  const auto found = std::find_if(
                      candidate.routes.begin(),
                      candidate.routes.end(),
                      [&routeId](const FlowRoute& item)
                      {
                          return item.id == routeId;
                      });
                  if (found == candidate.routes.end())
                  {
                      error = "Story Flow route does not exist: " + routeId;
                      return false;
                  }
                  route.id = routeId;
                  *found = std::move(route);
                  return CommitMutation(std::move(candidate), error);
              }

              bool StoryFlowAuthoringSession::DeleteRoute(
                  const StableId& routeId,
                  std::string& error)
              {
                  if (!loaded_)
                  {
                      error = "Story Flow authoring session is not open.";
                      return false;
                  }

                  FlowDocument candidate = Document();
                  const auto found = std::find_if(
                      candidate.routes.begin(),
                      candidate.routes.end(),
                      [&routeId](const FlowRoute& route)
                      {
                          return route.id == routeId;
                      });
                  if (found == candidate.routes.end())
                  {
                      error = "Story Flow route does not exist: " + routeId;
                      return false;
                  }
                  candidate.routes.erase(found);
                  return CommitMutation(std::move(candidate), error);
              }

              bool StoryFlowAuthoringSession::Undo(std::string& error)
              {
                  if (!CanUndo())
                  {
                      error = "Story Flow has no authoring command to undo.";
                      return false;
                  }
                  --historyIndex_;
                  error.clear();
                  return true;
              }

              bool StoryFlowAuthoringSession::Redo(std::string& error)
              {
                  if (!CanRedo())
                  {
                      error = "Story Flow has no authoring command to redo.";
                      return false;
                  }
                  ++historyIndex_;
                  error.clear();
                  return true;
              }

              bool StoryFlowAuthoringSession::IsLoaded() const noexcept
              {
                  return loaded_;
              }

              bool StoryFlowAuthoringSession::IsDirty() const noexcept
              {
                  return loaded_ &&
                      (savedHistoryIndex_ == InvalidHistoryIndex ||
                       savedHistoryIndex_ != historyIndex_);
              }

              bool StoryFlowAuthoringSession::CanUndo() const noexcept
              {
                  return loaded_ && historyIndex_ > 0;
              }

              bool StoryFlowAuthoringSession::CanRedo() const noexcept
              {
                  return loaded_ && historyIndex_ + 1 < history_.size();
              }

              std::size_t StoryFlowAuthoringSession::UndoCount() const noexcept
              {
                  return CanUndo() ? historyIndex_ : 0;
              }

              std::size_t StoryFlowAuthoringSession::RedoCount() const noexcept
              {
                  return CanRedo() ? history_.size() - historyIndex_ - 1 : 0;
              }

              const FlowDocument& StoryFlowAuthoringSession::Document() const noexcept
              {
                  return loaded_ && historyIndex_ < history_.size()
                      ? history_[historyIndex_]
                      : emptyDocument_;
              }

              const std::string& StoryFlowAuthoringSession::FilePath() const noexcept
              {
                  return filePath_;
              }

              const StableId& StoryFlowAuthoringSession::ProjectId() const noexcept
              {
                  return projectId_;
              }

              bool StoryFlowAuthoringSession::Adopt(
                  FlowDocument document,
                  const StableId& expectedProjectId,
                  std::string filePath,
                  std::string& error)
              {
                  if (!ValidateFlowDocument(document, expectedProjectId, error))
                  {
                      return false;
                  }
                  if (filePath.empty())
                  {
                      error = "Story Flow authoring requires a document path.";
                      return false;
                  }

                  history_.clear();
                  history_.push_back(std::move(document));
                  historyIndex_ = 0;
                  savedHistoryIndex_ = 0;
                  projectId_ = expectedProjectId;
                  filePath_ = std::move(filePath);
                  loaded_ = true;
                  error.clear();
                  return true;
              }

              bool StoryFlowAuthoringSession::CommitMutation(
                  FlowDocument document,
                  std::string& error)
              {
                  if (!loaded_)
                  {
                      error = "Story Flow authoring session is not open.";
                      return false;
                  }
                  if (!ValidateFlowDocument(document, projectId_, error))
                  {
                      return false;
                  }

                  if (historyIndex_ + 1 < history_.size())
                  {
                      if (savedHistoryIndex_ != InvalidHistoryIndex &&
                          savedHistoryIndex_ > historyIndex_)
                      {
                          savedHistoryIndex_ = InvalidHistoryIndex;
                      }
                      history_.erase(
                          history_.begin() + static_cast<std::ptrdiff_t>(historyIndex_ + 1),
                          history_.end());
                  }

                  history_.push_back(std::move(document));
                  historyIndex_ = history_.size() - 1;

                  if (history_.size() > MaximumHistoryEntries)
                  {
                      history_.erase(history_.begin());
                      --historyIndex_;
                      if (savedHistoryIndex_ != InvalidHistoryIndex)
                      {
                          if (savedHistoryIndex_ == 0)
                          {
                              savedHistoryIndex_ = InvalidHistoryIndex;
                          }
                          else
                          {
                              --savedHistoryIndex_;
                          }
                      }
                  }

                  error.clear();
                  return true;
              }
          }
          '''), encoding="utf-8")

          Path("Studio/src/StoryFlowRenderPath.h").write_text(dedent(r'''\
          #pragma once

          #include <WickedEngine.h>

          namespace renegade::studio
          {
              // Gate 3 first-class Story Flow render path. It is intentionally 2D:
              // the 3D Level Editor path is inactive while this path owns Studio.
              class StoryFlowRenderPath final : public wi::RenderPath2D
              {
              public:
                  void Load() override;

                  [[nodiscard]] XMFLOAT4 StoryFlowWorkspaceBounds() const noexcept
                  {
                      return XMFLOAT4(
                          0.0f,
                          0.0f,
                          GetLogicalWidth(),
                          GetLogicalHeight());
                  }

                  wi::gui::GUI& StoryFlowGui() noexcept
                  {
                      return GetGUI();
                  }
              };
          }
          '''), encoding="utf-8")

          Path("Studio/src/StoryFlowRenderPath.cpp").write_text(dedent(r'''\
          #include "StoryFlowRenderPath.h"

          namespace renegade::studio
          {
              void StoryFlowRenderPath::Load()
              {
                  // Story Flow is native 2D authoring UI. Keep the path lean and
                  // avoid allocating any RenderPath3D scene/deferred resources.
                  setMSAASampleCount(1);
                  setMSAASampleCount2D(1);
              }
          }
          '''), encoding="utf-8")

          Path("Tests/StoryFlowAuthoringSessionTests.cpp").write_text(dedent(r'''\
          #include "renegade/bridge/StoryFlowAuthoringSession.h"

          #include <algorithm>
          #include <chrono>
          #include <filesystem>
          #include <iostream>
          #include <string>

          namespace
          {
              namespace fs = std::filesystem;
              using namespace renegade::bridge;

              struct TemporaryDirectory
              {
                  fs::path path;
                  ~TemporaryDirectory()
                  {
                      std::error_code ignored;
                      fs::remove_all(path, ignored);
                  }
              };

              int Fail(const fs::path& root, const char* message)
              {
                  std::error_code ignored;
                  fs::remove_all(root, ignored);
                  std::cerr << "RenegadeStoryFlowAuthoringSessionTests: "
                            << message << '\n';
                  return 1;
              }

              const FlowNode* FindNode(
                  const FlowDocument& document,
                  const StableId& id)
              {
                  const auto found = std::find_if(
                      document.nodes.begin(),
                      document.nodes.end(),
                      [&id](const FlowNode& node)
                      {
                          return node.id == id;
                      });
                  return found == document.nodes.end() ? nullptr : &*found;
              }

              const FlowRoute* FindRoute(
                  const FlowDocument& document,
                  const StableId& id)
              {
                  const auto found = std::find_if(
                      document.routes.begin(),
                      document.routes.end(),
                      [&id](const FlowRoute& route)
                      {
                          return route.id == id;
                      });
                  return found == document.routes.end() ? nullptr : &*found;
              }
          }

          int main()
          {
              using namespace renegade::bridge;

              const StableId projectId = "11111111-1111-4111-8111-111111111111";
              const StableId flowId = "22222222-2222-4222-8222-222222222222";
              const StableId startId = "33333333-3333-4333-8333-333333333333";
              const StableId levelId = "44444444-4444-4444-8444-444444444444";
              const StableId sceneId = "55555555-5555-4555-8555-555555555555";
              const StableId completeId = "66666666-6666-4666-8666-666666666666";

              const auto unique = std::chrono::high_resolution_clock::now()
                  .time_since_epoch().count();
              TemporaryDirectory temporary{
                  fs::temp_directory_path() /
                  fs::u8path("renegade story flow gate3 " + std::to_string(unique))
              };
              const fs::path root = temporary.path / "Project With Spaces";
              const fs::path flowPath = root / "Content/Flow/Main.renegade-flow";
              fs::create_directories(flowPath.parent_path());

              FlowDocument document;
              document.envelope = CreateDocumentEnvelope(
                  projectId,
                  StoryFlowDocumentType,
                  "Content/Flow/Main.renegade-flow",
                  "Story Flow Gate 3 authoring session proof");
              document.envelope.documentId = flowId;
              document.startNodeId = startId;

              FlowNode start;
              start.id = startId;
              start.kind = FlowNodeKind::GameStart;
              start.name = "Game Start";

              FlowNode level;
              level.id = levelId;
              level.kind = FlowNodeKind::Level;
              level.name = "Level One";
              level.sceneAssetId = sceneId;
              level.scenePathHint = "Content/Scenes/LevelOne.wiscene";

              FlowNode complete;
              complete.id = completeId;
              complete.kind = FlowNodeKind::CompleteGame;
              complete.name = "Complete Game";

              FlowRoute startRoute;
              startRoute.id = "77777777-7777-4777-8777-777777777771";
              startRoute.sourceNodeId = startId;
              startRoute.outcome = GameStartOutcome;
              startRoute.destinationNodeId = levelId;
              startRoute.destinationEntry = "default";

              FlowRoute completeRoute;
              completeRoute.id = "77777777-7777-4777-8777-777777777772";
              completeRoute.sourceNodeId = levelId;
              completeRoute.outcome = "level.complete";
              completeRoute.destinationNodeId = completeId;

              document.nodes = {start, level, complete};
              document.routes = {startRoute, completeRoute};

              std::string error;
              if (!WriteFlowDocument(flowPath.generic_u8string(), document, error))
              {
                  return Fail(temporary.path, "fixture Flow did not serialize");
              }

              StoryFlowAuthoringSession session;
              if (!session.Open(flowPath.generic_u8string(), projectId, error) ||
                  !session.IsLoaded() || session.IsDirty() ||
                  session.CanUndo() || session.CanRedo())
              {
                  return Fail(temporary.path, "authoring session did not open cleanly");
              }

              if (!session.RenameNode(levelId, "Level Prime", error) ||
                  !session.IsDirty() || !session.CanUndo() ||
                  FindNode(session.Document(), levelId) == nullptr ||
                  FindNode(session.Document(), levelId)->name != "Level Prime")
              {
                  return Fail(temporary.path, "rename did not create dirty history");
              }

              if (!session.Undo(error) || session.IsDirty() ||
                  FindNode(session.Document(), levelId)->name != "Level One")
              {
                  return Fail(temporary.path, "undo did not restore the saved Flow state");
              }
              if (!session.Redo(error) || !session.IsDirty() ||
                  FindNode(session.Document(), levelId)->name != "Level Prime")
              {
                  return Fail(temporary.path, "redo did not restore the Flow edit");
              }
              if (!session.Save(error) || session.IsDirty())
              {
                  return Fail(temporary.path, "transactional Flow save did not mark history saved");
              }

              FlowDocument saved;
              if (!ReadFlowDocument(
                      flowPath.generic_u8string(),
                      projectId,
                      saved,
                      error) ||
                  FindNode(saved, levelId) == nullptr ||
                  FindNode(saved, levelId)->name != "Level Prime")
              {
                  return Fail(temporary.path, "saved Flow did not reopen with the edit");
              }

              FlowNode returnMenu;
              returnMenu.kind = FlowNodeKind::ReturnToMainMenu;
              returnMenu.name = "Return Main Menu";
              StableId returnMenuId;
              if (!session.AddNode(returnMenu, returnMenuId, error) ||
                  !IsValidStableId(returnMenuId))
              {
                  return Fail(temporary.path, "terminal node authoring failed");
              }

              FlowRoute menuRoute;
              menuRoute.sourceNodeId = levelId;
              menuRoute.outcome = "return.menu";
              menuRoute.destinationNodeId = returnMenuId;
              StableId menuRouteId;
              if (!session.AddRoute(menuRoute, menuRouteId, error) ||
                  FindRoute(session.Document(), menuRouteId) == nullptr)
              {
                  return Fail(temporary.path, "route authoring failed");
              }

              FlowRoute editedRoute = *FindRoute(session.Document(), menuRouteId);
              editedRoute.priority = 3;
              editedRoute.conditions.push_back({
                  "story.flag",
                  FlowConditionOperator::Exists,
                  {},
              });
              if (!session.UpdateRoute(menuRouteId, editedRoute, error) ||
                  FindRoute(session.Document(), menuRouteId)->priority != 3 ||
                  FindRoute(session.Document(), menuRouteId)->conditions.size() != 1)
              {
                  return Fail(temporary.path, "route field editing failed");
              }

              if (!session.DeleteNode(returnMenuId, error) ||
                  FindNode(session.Document(), returnMenuId) != nullptr ||
                  FindRoute(session.Document(), menuRouteId) != nullptr)
              {
                  return Fail(temporary.path,
                      "node deletion did not remove connected routes atomically");
              }

              const std::size_t beforeProtectedDelete = session.UndoCount();
              if (session.DeleteNode(startId, error) ||
                  session.UndoCount() != beforeProtectedDelete ||
                  FindNode(session.Document(), startId) == nullptr)
              {
                  return Fail(temporary.path, "permanent Game Start was deletable");
              }

              FlowNode invalidScreen;
              invalidScreen.kind = FlowNodeKind::Screen;
              invalidScreen.name = "Invalid Screen";
              invalidScreen.screenPathHint = "Content/UI/Invalid.renegade-screen";
              StableId ignoredId;
              if (session.AddNode(invalidScreen, ignoredId, error) ||
                  session.UndoCount() != beforeProtectedDelete)
              {
                  return Fail(temporary.path,
                      "invalid semantic mutation escaped Flow validation/history isolation");
              }

              FlowNode screen;
              screen.kind = FlowNodeKind::Screen;
              screen.name = "Victory Screen";
              screen.screenDocumentId =
                  "88888888-8888-4888-8888-888888888888";
              screen.screenPathHint = "Content/UI/Victory.renegade-screen";
              StableId screenNodeId;
              if (!session.AddNode(screen, screenNodeId, error))
              {
                  return Fail(temporary.path, "valid Screen node authoring failed");
              }

              FlowRoute screenRoute;
              screenRoute.sourceNodeId = levelId;
              screenRoute.outcome = "show.victory";
              screenRoute.destinationNodeId = screenNodeId;
              StableId screenRouteId;
              if (!session.AddRoute(screenRoute, screenRouteId, error))
              {
                  return Fail(temporary.path, "Screen route authoring failed");
              }

              if (!session.Undo(error) ||
                  FindRoute(session.Document(), screenRouteId) != nullptr ||
                  !session.Undo(error) ||
                  FindNode(session.Document(), screenNodeId) != nullptr ||
                  !session.Redo(error) ||
                  FindNode(session.Document(), screenNodeId) == nullptr ||
                  !session.Redo(error) ||
                  FindRoute(session.Document(), screenRouteId) == nullptr)
              {
                  return Fail(temporary.path,
                      "Flow-specific undo/redo did not preserve semantic history");
              }

              if (!session.Save(error) || !session.Reload(error) || session.IsDirty() ||
                  session.CanUndo() || session.CanRedo())
              {
                  return Fail(temporary.path,
                      "reopen did not establish a new clean authoring history boundary");
              }

              std::cout << "PASS: Story Flow Gate 3 authoring session/history/save\n";
              return 0;
          }
          '''), encoding="utf-8")

          Path("Tests/StoryFlowGate3.cmake").write_text(dedent(r'''\
          # Story Flow Gate 3 — semantic authoring session/history proof.
          add_executable(RenegadeStoryFlowAuthoringSessionTests
              ${CMAKE_CURRENT_LIST_DIR}/StoryFlowAuthoringSessionTests.cpp
          )

          target_link_libraries(
              RenegadeStoryFlowAuthoringSessionTests
              PRIVATE
                  Renegade::EngineBridge
