          Path('Tests/Phase5Gate7RenderSettingsTests.cpp').write_text(r'''#include <cmath>
#include <iostream>
#include "renegade/bridge/RenderSettingsService.h"
#include "renegade/bridge/SceneService.h"

namespace {
int Fail(const char* value) { std::cerr << "FAIL: " << value << '\n'; return 1; }
bool Eq(float a, float b) { return std::abs(a-b) <= 0.0001f; }
}

int main()
{
    using namespace renegade::bridge;
    const auto defaults = DefaultRenderSettings();
    if (RenderSettingsSchemaVersion != 3 || defaults.schemaVersion != 3 ||
        defaults.ambientOcclusion != RenderAmbientOcclusion::Off ||
        defaults.raytracedShadowsEnabled || defaults.raytracedReflectionsEnabled ||
        !Eq(defaults.raytracedReflectionsRange, 10000.0f) ||
        defaults.raytracedReflectionsQuality != RenderQuality::Medium ||
        defaults.raytracedDiffuseEnabled || !Eq(defaults.raytracedDiffuseRange, 10.0f) ||
        defaults.raytracedDiffuseQuality != RenderQuality::Medium || defaults.surfelGiEnabled)
        return Fail("Gate 7 defaults diverged from Wicked baseline");

    auto malformed = defaults;
    malformed.ambientOcclusion = RenderAmbientOcclusion::RTAO;
    malformed.raytracedReflectionsRange = 50000.0f;
    malformed.raytracedReflectionsQuality = static_cast<RenderQuality>(99);
    malformed.raytracedDiffuseRange = -5.0f;
    malformed.raytracedDiffuseQuality = static_cast<RenderQuality>(99);
    const auto safe = SanitizeRenderSettings(malformed);
    if (safe.ambientOcclusion != RenderAmbientOcclusion::RTAO ||
        !Eq(safe.raytracedReflectionsRange, 10000.0f) ||
        safe.raytracedReflectionsQuality != RenderQuality::Medium ||
        !Eq(safe.raytracedDiffuseRange, 1.0f) ||
        safe.raytracedDiffuseQuality != RenderQuality::Medium)
        return Fail("Gate 7 sanitization is not deterministic");

    // A schema-v2 Gate 6 carrier must preserve every existing value while
    // supplying deterministic Gate 7 defaults.
    SceneService legacy;
    auto& scene = legacy.GetScene();
    const auto carrier = wi::ecs::CreateEntity();
    scene.names.Create(carrier) = RenderSettingsCarrierName;
    auto& metadata = scene.metadatas.Create(carrier);
    metadata.int_values.set("renegade.render.schema", 2);
    metadata.int_values.set("renegade.render.ao.mode", static_cast<int>(RenderAmbientOcclusion::HBAO));
    metadata.float_values.set("renegade.render.gi_boost", 2.25f);
    metadata.bool_values.set("renegade.render.ssr.enabled", true);
    const auto migrated = CaptureRenderSettings(scene);
    if (migrated.schemaVersion != 3 ||
        migrated.ambientOcclusion != RenderAmbientOcclusion::HBAO ||
        !Eq(migrated.giBoost, 2.25f) || !migrated.ssrEnabled ||
        migrated.raytracedShadowsEnabled || migrated.raytracedReflectionsEnabled ||
        migrated.raytracedDiffuseEnabled || migrated.surfelGiEnabled)
        return Fail("Gate 6 schema-v2 carrier did not migrate losslessly");

    SceneService roundtrip;
    auto authored = defaults;
    authored.ambientOcclusion = RenderAmbientOcclusion::RTAO;
    authored.raytracedShadowsEnabled = true;
    authored.raytracedReflectionsEnabled = true;
    authored.raytracedReflectionsRange = 3210.0f;
    authored.raytracedReflectionsQuality = RenderQuality::High;
    authored.raytracedDiffuseEnabled = true;
    authored.raytracedDiffuseRange = 42.0f;
    authored.raytracedDiffuseQuality = RenderQuality::Low;
    authored.surfelGiEnabled = true;
    if (!WriteRenderSettings(roundtrip.GetScene(), authored) ||
        HasRenderSettingsChange(authored, CaptureRenderSettings(roundtrip.GetScene())))
        return Fail("Gate 7 state did not round-trip through Metadata");

    // Hardware-only effects must fail closed in the headless test environment
    // while retaining authored values in the scene carrier.
    auto headless = authored;
    headless.ambientOcclusion = RenderAmbientOcclusion::Off;
    headless.raytracedShadowsEnabled = false;
    headless.raytracedReflectionsEnabled = false;
    headless.raytracedDiffuseEnabled = false;
    headless.surfelGiEnabled = false;
    headless.bloomEnabled = false;
    headless.eyeAdaptationEnabled = false;
    headless.ssgiEnabled = false;
    headless.ssrEnabled = false;
    headless.planarReflectionsEnabled = false;
    wi::RenderPath3D path;
    ApplyRenderSettingsToPath(path, headless, false);
    if (!RenderSettingsMatchPath(path, headless))
        return Fail("Gate 7 native non-resource fields did not reach RenderPath");

    std::cout << "Phase 5 Gate 7 render settings tests passed\n";
    return 0;
}
