          # ---------------- Tiny exact-anchor Studio render loop hooks ----------------
          app = 'Studio/src/StudioApplication.cpp'
          value = text(app)

          def replace_in_function(source, signature_regex, old, new):
              m = re.search(signature_regex, source)
              if not m:
                  raise SystemExit(f'{app}: function signature not found: {signature_regex}')
              brace = source.find('{', m.end()-1)
              depth = 0
              end = None
              for i in range(brace, len(source)):
                  if source[i] == '{': depth += 1
                  elif source[i] == '}':
                      depth -= 1
                      if depth == 0:
                          end = i + 1
                          break
              if end is None:
                  raise SystemExit(f'{app}: unterminated function for {signature_regex}')
              body = source[m.start():end]
              if body.count(old) != 1:
                  raise SystemExit(f'{app}: expected one function-local anchor {old!r}, got {body.count(old)}')
              body = body.replace(old, new, 1)
              return source[:m.start()] + body + source[end:]

          value = replace_in_function(
              value,
              r'void\s+StudioRenderPath::Update\s*\([^)]*\)',
              'RenderPath3D::Update(dt);',
              'if (pathTracePreviewActive_)\n            UpdatePathTracePreview(dt);\n        else\n            RenderPath3D::Update(dt);')
          value = replace_in_function(
              value,
              r'void\s+StudioRenderPath::Render\s*\(\s*\)\s*const',
              'RenderPath3D::Render();',
              'if (pathTracePreviewActive_)\n        {\n            RenderPathTracePreview();\n            return;\n        }\n        RenderPath3D::Render();')
          value = replace_in_function(
              value,
              r'void\s+StudioRenderPath::Compose\s*\([^)]*\)\s*const',
              'RenderPath3D::Compose(cmd);',
              'if (pathTracePreviewActive_)\n        {\n            ComposePathTracePreview(cmd);\n            return;\n        }\n        RenderPath3D::Compose(cmd);')
          value = replace_in_function(
              value,
              r'void\s+StudioRenderPath::ResizeBuffers\s*\(\s*\)',
              'RenderPath3D::ResizeBuffers();',
              'RenderPath3D::ResizeBuffers();\n        ResizePathTracePreview();')
          write(app, value)

