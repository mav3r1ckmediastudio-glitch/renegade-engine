    bool StudioRenderPath::HasHardwareRayTracing() const noexcept
    {
        auto* device = wi::graphics::GetDevice();
        return device != nullptr &&
            device->CheckCapability(
                wi::graphics::GraphicsDeviceCapability::RAYTRACING);
    }

    void StudioRenderPath::StartPathTracePreview()
    {
        if (pathTracePreviewActive_ || session_ == nullptr || camera == nullptr)
            return;
        pathTracePreview_.init(*this);
        pathTracePreview_.resolutionScale = resolutionScale;
        pathTracePreview_.scene = &session_->Scenes().GetScene();
        pathTracePreview_.camera = camera;
        pathTracePreview_.setTargetSampleCount(pathTraceTargetSamples_);
        wi::renderer::SetRaytraceBounceCount(pathTraceBounceCount_);
        bridge::ApplyRenderSettingsToPath(
            pathTracePreview_,
            bridge::CaptureRenderSettings(session_->Scenes().GetScene()),
            false);
        pathTracePreview_.ResizeForStudio();
        pathTracePreview_.resetProgress();
        pathTracePreviewActive_ = true;
        ClearSelectionOutline();
        RefreshPathTraceStatus();
        studioChrome_.SetStatusText("PATH TRACE // REFERENCE PREVIEW // STARTED");
    }

    void StudioRenderPath::StopPathTracePreview()
    {
        if (!pathTracePreviewActive_)
            return;
        pathTracePreview_.resetProgress();
        pathTracePreviewActive_ = false;
        pathTracePreview_.DeleteGPUResources();
        ApplyRenderSettingsState(
            session_ != nullptr
                ? bridge::CaptureRenderSettings(session_->Scenes().GetScene())
                : bridge::DefaultRenderSettings(),
            true);
        RefreshPathTraceStatus();
        SyncSelectionOutline();
        studioChrome_.SetStatusText("PATH TRACE // RETURNED TO REALTIME");
    }

    void StudioRenderPath::RestartPathTracePreview()
    {
        if (!pathTracePreviewActive_)
            return;
        pathTracePreview_.setTargetSampleCount(pathTraceTargetSamples_);
        wi::renderer::SetRaytraceBounceCount(pathTraceBounceCount_);
        pathTracePreview_.resetProgress();
        RefreshPathTraceStatus();
    }

    void StudioRenderPath::UpdatePathTracePreview(const float dt)
    {
        if (!pathTracePreviewActive_)
            return;
        pathTracePreview_.scene = scene;
        pathTracePreview_.camera = camera;
        pathTracePreview_.Update(dt);
        wi::RenderPath2D::Update(dt);
        RefreshPathTraceStatus();
    }

    void StudioRenderPath::PreRender()
    {
        if (pathTracePreviewActive_)
        {
            pathTracePreview_.PreRender();
            wi::RenderPath2D::PreRender();
            return;
        }
        wi::RenderPath3D::PreRender();
    }

    void StudioRenderPath::RenderPathTracePreview() const
    {
        pathTracePreview_.Render();
        wi::RenderPath2D::Render();
    }

    void StudioRenderPath::ComposePathTracePreview(
        const wi::graphics::CommandList cmd) const
    {
        pathTracePreview_.Compose(cmd);
        wi::RenderPath2D::Compose(cmd);
    }

    void StudioRenderPath::ResizePathTracePreview()
    {
        if (!pathTracePreviewActive_)
            return;
        pathTracePreview_.init(*this);
        pathTracePreview_.resolutionScale = resolutionScale;
        pathTracePreview_.scene = scene;
        pathTracePreview_.camera = camera;
        pathTracePreview_.ResizeForStudio();
        pathTracePreview_.resetProgress();
    }

    void StudioRenderPath::RefreshPathTraceStatus()
    {
        renderPathTraceToggle_.SetText(
            pathTracePreviewActive_
                ? "RETURN TO REALTIME"
                : "START PATH TRACE PREVIEW");
        if (!pathTracePreviewActive_)
        {
            renderPathTraceProgress_.SetText(
                "READY // NATIVE WICKED REFERENCE // TARGET " +
                std::to_string(pathTraceTargetSamples_) + " SAMPLES");
            return;
        }
        const int sample = std::max(0, pathTracePreview_.getCurrentSampleCount());
        const int target = std::max(1, pathTraceTargetSamples_);
        const int percent = std::clamp(
            static_cast<int>(pathTracePreview_.getProgress() * 100.0f), 0, 100);
        std::string status =
            "SAMPLE " + std::to_string(sample) + " / " +
            std::to_string(target) + " // " + std::to_string(percent) + "%";
        if (pathTracePreview_.isDenoiserAvailable())
        {
            status += " // DENOISER " + std::to_string(
                std::clamp(static_cast<int>(
                    pathTracePreview_.getDenoiserProgress() * 100.0f), 0, 100)) + "%";
        }
        else
        {
            status += " // DENOISER N/A";
        }
        renderPathTraceProgress_.SetText(status);
    }
