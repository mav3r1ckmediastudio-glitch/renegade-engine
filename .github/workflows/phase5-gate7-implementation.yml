name: Phase 5 Gate 7 implementation

on:
  push:
    branches:
      - staging/phase5-gate7-implementation

permissions:
  contents: write

jobs:
  implement:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply exact-anchor Gate 7 patch
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re

          def text(path):
              return Path(path).read_text(encoding='utf-8')

          def write(path, value):
              Path(path).write_text(value, encoding='utf-8')

          def rep(path, old, new, expected=1):
              value = text(path)
              count = value.count(old)
              if count != expected:
                  raise SystemExit(f'{path}: expected {expected} anchor(s), found {count}: {old[:120]!r}')
              write(path, value.replace(old, new, expected))

          # ---------------- EngineBridge schema/state ----------------
          h = 'EngineBridge/include/renegade/bridge/RenderSettingsService.h'
          rep(h, 'inline constexpr int RenderSettingsSchemaVersion = 2;',
                 'inline constexpr int RenderSettingsSchemaVersion = 3;')
          rep(h,
              '        MSAO = 3,\n    };',
              '        MSAO = 3,\n        RTAO = 4,\n    };')
          rep(h,
              '        float reflectionRoughnessCutoff = 0.6f;\n\n        bool depthOfFieldEnabled = true;',
              '''        float reflectionRoughnessCutoff = 0.6f;\n\n        bool raytracedShadowsEnabled = false;\n        bool raytracedReflectionsEnabled = false;\n        float raytracedReflectionsRange = 10000.0f;\n        RenderQuality raytracedReflectionsQuality = RenderQuality::Medium;\n        bool raytracedDiffuseEnabled = false;\n        float raytracedDiffuseRange = 10.0f;\n        RenderQuality raytracedDiffuseQuality = RenderQuality::Medium;\n        bool surfelGiEnabled = false;\n\n        bool depthOfFieldEnabled = true;''')

          cpp = 'EngineBridge/src/RenderSettingsService.cpp'
          rep(cpp,
              '        case Mode::MSAO:\n            return value;\n        default:',
              '        case Mode::MSAO:\n        case Mode::RTAO:\n            return value;\n        default:')
          rep(cpp,
              '    constexpr const char* KeyReflectionRoughnessCutoff = "renegade.render.reflections.roughness_cutoff";\n',
              '''    constexpr const char* KeyReflectionRoughnessCutoff = "renegade.render.reflections.roughness_cutoff";\n    constexpr const char* KeyRaytracedShadowsEnabled = "renegade.render.rt.shadows.enabled";\n    constexpr const char* KeyRaytracedReflectionsEnabled = "renegade.render.rt.reflections.enabled";\n    constexpr const char* KeyRaytracedReflectionsRange = "renegade.render.rt.reflections.range";\n    constexpr const char* KeyRaytracedReflectionsQuality = "renegade.render.rt.reflections.quality";\n    constexpr const char* KeyRaytracedDiffuseEnabled = "renegade.render.rt.diffuse.enabled";\n    constexpr const char* KeyRaytracedDiffuseRange = "renegade.render.rt.diffuse.range";\n    constexpr const char* KeyRaytracedDiffuseQuality = "renegade.render.rt.diffuse.quality";\n    constexpr const char* KeySurfelGiEnabled = "renegade.render.rt.surfel_gi.enabled";\n''')
          rep(cpp,
              '    constexpr const char* KeyDitherEnabled = "renegade.render.dither.enabled";\n}',
              '''    constexpr const char* KeyDitherEnabled = "renegade.render.dither.enabled";\n\n    bool HardwareRayTracingAvailable() noexcept\n    {\n        auto* device = wi::graphics::GetDevice();\n        return device != nullptr &&\n            device->CheckCapability(\n                wi::graphics::GraphicsDeviceCapability::RAYTRACING);\n    }\n\n    wi::renderer::PostProcessQuality ToNativeQuality(\n        const renegade::bridge::RenderQuality quality) noexcept\n    {\n        using Quality = renegade::bridge::RenderQuality;\n        switch (quality)\n        {\n        case Quality::Low:\n            return wi::renderer::PostProcessQuality::Low;\n        case Quality::High:\n            return wi::renderer::PostProcessQuality::High;\n        case Quality::Medium:\n        default:\n            return wi::renderer::PostProcessQuality::Medium;\n        }\n    }\n}''')
          rep(cpp,
              '        result.ssrQuality = SanitizeRenderQuality(result.ssrQuality);\n',
              '''        result.ssrQuality = SanitizeRenderQuality(result.ssrQuality);\n        result.raytracedReflectionsQuality =\n            SanitizeRenderQuality(result.raytracedReflectionsQuality);\n        result.raytracedDiffuseQuality =\n            SanitizeRenderQuality(result.raytracedDiffuseQuality);\n''')
          rep(cpp,
              '        result.reflectionRoughnessCutoff = ClampFinite(result.reflectionRoughnessCutoff, defaults.reflectionRoughnessCutoff, 0.0f, 1.0f);\n        return result;',
              '''        result.reflectionRoughnessCutoff = ClampFinite(result.reflectionRoughnessCutoff, defaults.reflectionRoughnessCutoff, 0.0f, 1.0f);\n        result.raytracedReflectionsRange = ClampFinite(\n            result.raytracedReflectionsRange, defaults.raytracedReflectionsRange,\n            1.0f, 10000.0f);\n        result.raytracedDiffuseRange = ClampFinite(\n            result.raytracedDiffuseRange, defaults.raytracedDiffuseRange,\n            1.0f, 100.0f);\n        return result;''')
          rep(cpp,
              '            !NearlyEqual(left.reflectionRoughnessCutoff, right.reflectionRoughnessCutoff) ||\n            left.depthOfFieldEnabled != right.depthOfFieldEnabled ||',
              '''            !NearlyEqual(left.reflectionRoughnessCutoff, right.reflectionRoughnessCutoff) ||\n            left.raytracedShadowsEnabled != right.raytracedShadowsEnabled ||\n            left.raytracedReflectionsEnabled != right.raytracedReflectionsEnabled ||\n            !NearlyEqual(left.raytracedReflectionsRange, right.raytracedReflectionsRange) ||\n            left.raytracedReflectionsQuality != right.raytracedReflectionsQuality ||\n            left.raytracedDiffuseEnabled != right.raytracedDiffuseEnabled ||\n            !NearlyEqual(left.raytracedDiffuseRange, right.raytracedDiffuseRange) ||\n            left.raytracedDiffuseQuality != right.raytracedDiffuseQuality ||\n            left.surfelGiEnabled != right.surfelGiEnabled ||\n            left.depthOfFieldEnabled != right.depthOfFieldEnabled ||''')
          rep(cpp,
              '        if (schema != 1 && schema != RenderSettingsSchemaVersion)\n            return defaults;',
              '        if (schema < 1 || schema > RenderSettingsSchemaVersion)\n            return defaults;')
          rep(cpp,
              '            state.reflectionRoughnessCutoff = ReadValue(metadata->float_values, KeyReflectionRoughnessCutoff, defaults.reflectionRoughnessCutoff);\n        }\n        state.depthOfFieldEnabled',
              '''            state.reflectionRoughnessCutoff = ReadValue(metadata->float_values, KeyReflectionRoughnessCutoff, defaults.reflectionRoughnessCutoff);\n        }\n        if (schema >= 3)\n        {\n            state.raytracedShadowsEnabled = ReadValue(\n                metadata->bool_values, KeyRaytracedShadowsEnabled,\n                defaults.raytracedShadowsEnabled);\n            state.raytracedReflectionsEnabled = ReadValue(\n                metadata->bool_values, KeyRaytracedReflectionsEnabled,\n                defaults.raytracedReflectionsEnabled);\n            state.raytracedReflectionsRange = ReadValue(\n                metadata->float_values, KeyRaytracedReflectionsRange,\n                defaults.raytracedReflectionsRange);\n            state.raytracedReflectionsQuality = static_cast<RenderQuality>(\n                ReadValue(metadata->int_values, KeyRaytracedReflectionsQuality,\n                    static_cast<int>(defaults.raytracedReflectionsQuality)));\n            state.raytracedDiffuseEnabled = ReadValue(\n                metadata->bool_values, KeyRaytracedDiffuseEnabled,\n                defaults.raytracedDiffuseEnabled);\n            state.raytracedDiffuseRange = ReadValue(\n                metadata->float_values, KeyRaytracedDiffuseRange,\n                defaults.raytracedDiffuseRange);\n            state.raytracedDiffuseQuality = static_cast<RenderQuality>(\n                ReadValue(metadata->int_values, KeyRaytracedDiffuseQuality,\n                    static_cast<int>(defaults.raytracedDiffuseQuality)));\n            state.surfelGiEnabled = ReadValue(\n                metadata->bool_values, KeySurfelGiEnabled, defaults.surfelGiEnabled);\n        }\n        state.depthOfFieldEnabled''')
          rep(cpp,
              '        case RenderAmbientOcclusion::MSAO:\n            ambientOcclusion = wi::RenderPath3D::AO_MSAO;\n            break;\n        case RenderAmbientOcclusion::Off:',
              '''        case RenderAmbientOcclusion::MSAO:\n            ambientOcclusion = wi::RenderPath3D::AO_MSAO;\n            break;\n        case RenderAmbientOcclusion::RTAO:\n            if (HardwareRayTracingAvailable())\n                ambientOcclusion = wi::RenderPath3D::AO_RTAO;\n            break;\n        case RenderAmbientOcclusion::Off:''',
              expected=2)
          # Replace both hand-written SSR quality mappings with helper use only in matching/apply blocks later.
          rep(cpp,
              '''        wi::renderer::PostProcessQuality ssrQuality = wi::renderer::PostProcessQuality::Medium;\n        switch (safe.ssrQuality)\n        {\n        case RenderQuality::Low:\n            ssrQuality = wi::renderer::PostProcessQuality::Low;\n            break;\n        case RenderQuality::High:\n            ssrQuality = wi::renderer::PostProcessQuality::High;\n            break;\n        case RenderQuality::Medium:\n        default:\n            break;\n        }\n''',
              '        const auto ssrQuality = ToNativeQuality(safe.ssrQuality);\n',
              expected=2)
          rep(cpp,
              '            !NearlyEqual(path.getReflectionRoughnessCutoff(), safe.reflectionRoughnessCutoff) ||\n            path.getDepthOfFieldEnabled() != safe.depthOfFieldEnabled ||',
              '''            !NearlyEqual(path.getReflectionRoughnessCutoff(), safe.reflectionRoughnessCutoff) ||\n            wi::renderer::GetRaytracedShadowsEnabled() !=\n                (HardwareRayTracingAvailable() && safe.raytracedShadowsEnabled) ||\n            path.getRaytracedReflectionEnabled() !=\n                (HardwareRayTracingAvailable() && safe.raytracedReflectionsEnabled) ||\n            !NearlyEqual(path.getRaytracedReflectionsRange(), safe.raytracedReflectionsRange) ||\n            path.getRaytracedReflectionsQuality() !=\n                ToNativeQuality(safe.raytracedReflectionsQuality) ||\n            path.getRaytracedDiffuseEnabled() !=\n                (HardwareRayTracingAvailable() && safe.raytracedDiffuseEnabled) ||\n            !NearlyEqual(path.getRaytracedDiffuseRange(), safe.raytracedDiffuseRange) ||\n            path.getRaytracedDiffuseQuality() !=\n                ToNativeQuality(safe.raytracedDiffuseQuality) ||\n            wi::renderer::GetSurfelGIEnabled() != safe.surfelGiEnabled ||\n            path.getDepthOfFieldEnabled() != safe.depthOfFieldEnabled ||''')
          rep(cpp,
              '        metadata->float_values.set(KeyReflectionRoughnessCutoff, safe.reflectionRoughnessCutoff);\n        metadata->bool_values.set(KeyDepthOfFieldEnabled, safe.depthOfFieldEnabled);',
              '''        metadata->float_values.set(KeyReflectionRoughnessCutoff, safe.reflectionRoughnessCutoff);\n        metadata->bool_values.set(KeyRaytracedShadowsEnabled, safe.raytracedShadowsEnabled);\n        metadata->bool_values.set(KeyRaytracedReflectionsEnabled, safe.raytracedReflectionsEnabled);\n        metadata->float_values.set(KeyRaytracedReflectionsRange, safe.raytracedReflectionsRange);\n        metadata->int_values.set(KeyRaytracedReflectionsQuality, static_cast<int>(safe.raytracedReflectionsQuality));\n        metadata->bool_values.set(KeyRaytracedDiffuseEnabled, safe.raytracedDiffuseEnabled);\n        metadata->float_values.set(KeyRaytracedDiffuseRange, safe.raytracedDiffuseRange);\n        metadata->int_values.set(KeyRaytracedDiffuseQuality, static_cast<int>(safe.raytracedDiffuseQuality));\n        metadata->bool_values.set(KeySurfelGiEnabled, safe.surfelGiEnabled);\n        metadata->bool_values.set(KeyDepthOfFieldEnabled, safe.depthOfFieldEnabled);''')
          rep(cpp,
              '        if (path.getSSREnabled() != safe.ssrEnabled)\n            path.setSSREnabled(safe.ssrEnabled);\n\n        path.setDepthOfFieldEnabled',
              '''        if (path.getSSREnabled() != safe.ssrEnabled)\n            path.setSSREnabled(safe.ssrEnabled);\n\n        const bool hardwareRt = HardwareRayTracingAvailable();\n        wi::renderer::SetRaytracedShadowsEnabled(\n            hardwareRt && safe.raytracedShadowsEnabled);\n        path.setRaytracedReflectionsRange(safe.raytracedReflectionsRange);\n        path.setRaytracedReflectionsQuality(\n            ToNativeQuality(safe.raytracedReflectionsQuality));\n        if (path.getRaytracedReflectionEnabled() !=\n            (hardwareRt && safe.raytracedReflectionsEnabled))\n        {\n            path.setRaytracedReflectionsEnabled(\n                hardwareRt && safe.raytracedReflectionsEnabled);\n        }\n        path.setRaytracedDiffuseRange(safe.raytracedDiffuseRange);\n        path.setRaytracedDiffuseQuality(\n            ToNativeQuality(safe.raytracedDiffuseQuality));\n        if (path.getRaytracedDiffuseEnabled() !=\n            (hardwareRt && safe.raytracedDiffuseEnabled))\n        {\n            path.setRaytracedDiffuseEnabled(\n                hardwareRt && safe.raytracedDiffuseEnabled);\n        }\n        wi::renderer::SetSurfelGIEnabled(safe.surfelGiEnabled);\n\n        path.setDepthOfFieldEnabled''')

          # ---------------- Studio declarations / contained native path tracer ----------------
          sh = 'Studio/src/StudioApplication.h'
          rep(sh, '#include <WickedEngine.h>\n', '#include <WickedEngine.h>\n#include <wiRenderPath3D_PathTracing.h>\n')
          rep(sh,
              '            ReflectionRoughnessCutoff,\n        };',
              '            ReflectionRoughnessCutoff,\n            RaytracedReflectionsRange,\n            RaytracedDiffuseRange,\n        };')
          rep(sh,
              '            Ssr,\n        };',
              '            Ssr,\n            RaytracedShadows,\n            RaytracedReflections,\n            RaytracedDiffuse,\n            SurfelGi,\n        };')
          rep(sh,
              '        void SetRenderWorkspaceActive(bool active);\n        void CreateRenderWorkspace();',
              '''        void SetRenderWorkspaceActive(bool active);\n        [[nodiscard]] bool HasHardwareRayTracing() const noexcept;\n        void StartPathTracePreview();\n        void StopPathTracePreview();\n        void RestartPathTracePreview();\n        void UpdatePathTracePreview(float dt);\n        void RenderPathTracePreview() const;\n        void ComposePathTracePreview(wi::graphics::CommandList cmd) const;\n        void ResizePathTracePreview();\n        void RefreshPathTraceStatus();\n        void PreRender() override;\n        void CreateRenderWorkspace();''')
          rep(sh,
              '        SceneInspectorSlider renderReflectionRoughnessCutoff_;\n        SceneInspectorButton focusButton_;',
              '''        SceneInspectorSlider renderReflectionRoughnessCutoff_;\n        wi::gui::Label renderRayTracingLabel_;\n        wi::gui::Label renderRayTracingHardwareStatus_;\n        SceneInspectorCheckBox renderRaytracedShadowsEnabled_;\n        SceneInspectorCheckBox renderRaytracedReflectionsEnabled_;\n        SceneInspectorSlider renderRaytracedReflectionsRange_;\n        SceneInspectorComboBox renderRaytracedReflectionsQuality_;\n        SceneInspectorCheckBox renderRaytracedDiffuseEnabled_;\n        SceneInspectorSlider renderRaytracedDiffuseRange_;\n        SceneInspectorComboBox renderRaytracedDiffuseQuality_;\n        SceneInspectorCheckBox renderSurfelGiEnabled_;\n        wi::gui::Label renderPathTraceLabel_;\n        SceneInspectorButton renderPathTraceToggle_;\n        SceneInspectorSlider renderPathTraceSamples_;\n        SceneInspectorSlider renderPathTraceBounces_;\n        SceneInspectorButton renderPathTraceRestart_;\n        wi::gui::Label renderPathTraceProgress_;\n        SceneInspectorButton focusButton_;''')
          rep(sh,
              '        bool appliedRenderSettingsInitialized_ = false;\n        bool precipitationSliderActive_ = false;',
              '''        bool appliedRenderSettingsInitialized_ = false;\n        class PathTracePreviewPath final : public wi::RenderPath3D_PathTracing\n        {\n        public:\n            void ResizeForStudio() { ResizeBuffers(); }\n        };\n        mutable PathTracePreviewPath pathTracePreview_;\n        bool pathTracePreviewActive_ = false;\n        int pathTraceTargetSamples_ = 1024;\n        std::uint32_t pathTraceBounceCount_ = 1;\n        bool precipitationSliderActive_ = false;''')

          # ---------------- Studio RENDER workspace ----------------
          ui = 'Studio/src/Phase5Gate5RenderWorkspace.cpp'
          rep(ui,
              '        renderAmbientOcclusion_.AddItem("MSAO", static_cast<std::uint64_t>(bridge::RenderAmbientOcclusion::MSAO));\n',
              '''        renderAmbientOcclusion_.AddItem("MSAO", static_cast<std::uint64_t>(bridge::RenderAmbientOcclusion::MSAO));\n        if (HasHardwareRayTracing())\n        {\n            renderAmbientOcclusion_.AddItem(\n                "RTAO",\n                static_cast<std::uint64_t>(bridge::RenderAmbientOcclusion::RTAO));\n        }\n''')
          rep(ui,
              '''        createSlider(\n            renderReflectionRoughnessCutoff_, "Render Reflection Roughness Cutoff",\n            "REFLECTIONS // ROUGHNESS CUTOFF",\n            "Maximum material roughness that receives screen-space reflections.",\n            RenderField::ReflectionRoughnessCutoff, 0.0f, 1.0f, 1000.0f);\n\n        // Wicked Window::AddWidget() copies Window::IsEnabled() into each child,''',
              '''        createSlider(\n            renderReflectionRoughnessCutoff_, "Render Reflection Roughness Cutoff",\n            "REFLECTIONS // ROUGHNESS CUTOFF",\n            "Maximum material roughness that receives screen-space or ray-traced reflections.",\n            RenderField::ReflectionRoughnessCutoff, 0.0f, 1.0f, 1000.0f);\n\n        createSection(\n            renderRayTracingLabel_,\n            "Render Ray Tracing Section",\n            "RAY TRACING // REALTIME");\n        renderRayTracingHardwareStatus_.Create("Render Ray Tracing Hardware Status");\n        renderRayTracingHardwareStatus_.font.params.size = 12;\n        renderRayTracingHardwareStatus_.font.params.color = RenderMuted;\n        renderRayTracingHardwareStatus_.font.params.h_align = wi::font::WIFALIGN_LEFT;\n        renderRayTracingHardwareStatus_.SetColor(wi::Color::Transparent());\n        renderWorkspacePanel_.AddWidget(&renderRayTracingHardwareStatus_);\n        createToggle(\n            renderRaytracedShadowsEnabled_, "Ray-traced shadows: ",\n            "Native hardware ray-traced shadows. Authored state is retained on unsupported GPUs.",\n            RenderToggle::RaytracedShadows);\n        createToggle(\n            renderRaytracedReflectionsEnabled_, "Ray-traced reflections: ",\n            "Native hardware ray-traced reflections.",\n            RenderToggle::RaytracedReflections);\n        createSlider(\n            renderRaytracedReflectionsRange_, "Render RT Reflection Range",\n            "RT REFLECTIONS // RANGE",\n            "Maximum native ray length for ray-traced reflections.",\n            RenderField::RaytracedReflectionsRange, 1.0f, 10000.0f, 1000.0f);\n        renderRaytracedReflectionsQuality_.Create("Render RT Reflection Quality");\n        renderRaytracedReflectionsQuality_.AddItem("LOW", static_cast<std::uint64_t>(bridge::RenderQuality::Low));\n        renderRaytracedReflectionsQuality_.AddItem("MEDIUM", static_cast<std::uint64_t>(bridge::RenderQuality::Medium));\n        renderRaytracedReflectionsQuality_.AddItem("HIGH", static_cast<std::uint64_t>(bridge::RenderQuality::High));\n        renderRaytracedReflectionsQuality_.SetTooltip("Native Wicked ray-traced reflection quality.");\n        renderRaytracedReflectionsQuality_.OnSelect([this](const wi::gui::EventArgs& args)\n        {\n            auto state = bridge::CaptureRenderSettings(session_->Scenes().GetScene());\n            state.raytracedReflectionsQuality = static_cast<bridge::RenderQuality>(args.userdata);\n            CommitRenderSettings(state);\n        });\n        renderWorkspacePanel_.AddWidget(&renderRaytracedReflectionsQuality_);\n        createToggle(\n            renderRaytracedDiffuseEnabled_, "Ray-traced diffuse: ",\n            "Native single-bounce hardware ray-traced diffuse lighting.",\n            RenderToggle::RaytracedDiffuse);\n        createSlider(\n            renderRaytracedDiffuseRange_, "Render RT Diffuse Range",\n            "RT DIFFUSE // RANGE",\n            "Maximum native ray length for ray-traced diffuse lighting.",\n            RenderField::RaytracedDiffuseRange, 1.0f, 100.0f, 1000.0f);\n        renderRaytracedDiffuseQuality_.Create("Render RT Diffuse Quality");\n        renderRaytracedDiffuseQuality_.AddItem("LOW", static_cast<std::uint64_t>(bridge::RenderQuality::Low));\n        renderRaytracedDiffuseQuality_.AddItem("MEDIUM", static_cast<std::uint64_t>(bridge::RenderQuality::Medium));\n        renderRaytracedDiffuseQuality_.AddItem("HIGH", static_cast<std::uint64_t>(bridge::RenderQuality::High));\n        renderRaytracedDiffuseQuality_.SetTooltip("Native Wicked ray-traced diffuse quality.");\n        renderRaytracedDiffuseQuality_.OnSelect([this](const wi::gui::EventArgs& args)\n        {\n            auto state = bridge::CaptureRenderSettings(session_->Scenes().GetScene());\n            state.raytracedDiffuseQuality = static_cast<bridge::RenderQuality>(args.userdata);\n            CommitRenderSettings(state);\n        });\n        renderWorkspacePanel_.AddWidget(&renderRaytracedDiffuseQuality_);\n        createToggle(\n            renderSurfelGiEnabled_, "Surfel GI: ",\n            "Enable Wicked's native ray-traced surfel surface-cache GI.",\n            RenderToggle::SurfelGi);\n\n        createSection(\n            renderPathTraceLabel_,\n            "Render Path Trace Section",\n            "PATH TRACE // REFERENCE PREVIEW");\n        renderPathTraceToggle_.Create("Render Path Trace Toggle");\n        renderPathTraceToggle_.SetText("START PATH TRACE PREVIEW");\n        renderPathTraceToggle_.SetTooltip(\n            "Studio-only native Wicked path-traced reference preview. It never changes the packaged Runtime render mode.");\n        renderPathTraceToggle_.OnClick([this](const wi::gui::EventArgs&)\n        {\n            if (pathTracePreviewActive_)\n                StopPathTracePreview();\n            else\n                StartPathTracePreview();\n        });\n        renderWorkspacePanel_.AddWidget(&renderPathTraceToggle_);\n        renderPathTraceSamples_.Create(\n            1.0f, 2048.0f, 1024.0f, 2047.0f,\n            "Render Path Trace Samples", "TARGET SAMPLES");\n        renderPathTraceSamples_.SetTooltip("Target samples per pixel for the Studio reference preview.");\n        renderPathTraceSamples_.OnValueCommitted([this](const float value)\n        {\n            pathTraceTargetSamples_ = std::clamp(static_cast<int>(std::lround(value)), 1, 2048);\n            pathTracePreview_.setTargetSampleCount(pathTraceTargetSamples_);\n            if (pathTracePreviewActive_)\n                RestartPathTracePreview();\n        });\n        renderWorkspacePanel_.AddWidget(&renderPathTraceSamples_);\n        renderPathTraceBounces_.Create(\n            1.0f, 10.0f, 1.0f, 9.0f,\n            "Render Path Trace Bounces", "RAY BOUNCES");\n        renderPathTraceBounces_.SetTooltip("Global ray bounce count used by Wicked path tracing and later lightmap baking.");\n        renderPathTraceBounces_.OnValueCommitted([this](const float value)\n        {\n            pathTraceBounceCount_ = std::clamp(\n                static_cast<std::uint32_t>(std::lround(value)), 1u, 10u);\n            wi::renderer::SetRaytraceBounceCount(pathTraceBounceCount_);\n            if (pathTracePreviewActive_)\n                RestartPathTracePreview();\n        });\n        renderWorkspacePanel_.AddWidget(&renderPathTraceBounces_);\n        renderPathTraceRestart_.Create("Render Path Trace Restart");\n        renderPathTraceRestart_.SetText("RESTART ACCUMULATION");\n        renderPathTraceRestart_.SetTooltip("Reset the current path-traced accumulation without changing the target sample count.");\n        renderPathTraceRestart_.OnClick([this](const wi::gui::EventArgs&)\n        {\n            RestartPathTracePreview();\n        });\n        renderWorkspacePanel_.AddWidget(&renderPathTraceRestart_);\n        renderPathTraceProgress_.Create("Render Path Trace Progress");\n        renderPathTraceProgress_.font.params.size = 12;\n        renderPathTraceProgress_.font.params.color = RenderMuted;\n        renderPathTraceProgress_.font.params.h_align = wi::font::WIFALIGN_LEFT;\n        renderPathTraceProgress_.SetColor(wi::Color::Transparent());\n        renderWorkspacePanel_.AddWidget(&renderPathTraceProgress_);\n\n        // Wicked Window::AddWidget() copies Window::IsEnabled() into each child,''')
          rep(ui,
              '        full(renderReflectionRoughnessCutoff_);\n    }',
              '''        full(renderReflectionRoughnessCutoff_);\n\n        section(renderRayTracingLabel_);\n        full(renderRayTracingHardwareStatus_);\n        full(renderRaytracedShadowsEnabled_);\n        full(renderRaytracedReflectionsEnabled_);\n        full(renderRaytracedReflectionsRange_);\n        full(renderRaytracedReflectionsQuality_);\n        full(renderRaytracedDiffuseEnabled_);\n        full(renderRaytracedDiffuseRange_);\n        full(renderRaytracedDiffuseQuality_);\n        full(renderSurfelGiEnabled_);\n\n        section(renderPathTraceLabel_);\n        full(renderPathTraceToggle_);\n        full(renderPathTraceSamples_);\n        full(renderPathTraceBounces_);\n        full(renderPathTraceRestart_);\n        full(renderPathTraceProgress_);\n    }''')
          rep(ui,
              '        renderReflectionRoughnessCutoff_.SetValue(state.reflectionRoughnessCutoff);\n\n        renderBloomThreshold_.SetEnabled',
              '''        renderReflectionRoughnessCutoff_.SetValue(state.reflectionRoughnessCutoff);\n        renderRaytracedShadowsEnabled_.SetCheck(state.raytracedShadowsEnabled);\n        renderRaytracedReflectionsEnabled_.SetCheck(state.raytracedReflectionsEnabled);\n        renderRaytracedReflectionsRange_.SetValue(state.raytracedReflectionsRange);\n        renderRaytracedReflectionsQuality_.SetSelectedByUserdataWithoutCallback(\n            static_cast<std::uint64_t>(state.raytracedReflectionsQuality));\n        renderRaytracedDiffuseEnabled_.SetCheck(state.raytracedDiffuseEnabled);\n        renderRaytracedDiffuseRange_.SetValue(state.raytracedDiffuseRange);\n        renderRaytracedDiffuseQuality_.SetSelectedByUserdataWithoutCallback(\n            static_cast<std::uint64_t>(state.raytracedDiffuseQuality));\n        renderSurfelGiEnabled_.SetCheck(state.surfelGiEnabled);\n        renderPathTraceSamples_.SetValue(static_cast<float>(pathTraceTargetSamples_));\n        renderPathTraceBounces_.SetValue(static_cast<float>(pathTraceBounceCount_));\n        renderRayTracingHardwareStatus_.SetText(HasHardwareRayTracing()\n            ? "HARDWARE RT // AVAILABLE"\n            : "HARDWARE RT // UNAVAILABLE // AUTHORED STATE RETAINED");\n        RefreshPathTraceStatus();\n\n        renderBloomThreshold_.SetEnabled''')
          rep(ui,
              '''        const bool ssao =\n            state.ambientOcclusion == bridge::RenderAmbientOcclusion::SSAO;\n        renderAmbientOcclusionPower_.SetEnabled(\n            state.ambientOcclusion != bridge::RenderAmbientOcclusion::Off);\n        renderAmbientOcclusionRange_.SetEnabled(ssao);\n        renderAmbientOcclusionSampleCount_.SetEnabled(ssao);''',
              '''        const bool ssao =\n            state.ambientOcclusion == bridge::RenderAmbientOcclusion::SSAO;\n        const bool rtao =\n            state.ambientOcclusion == bridge::RenderAmbientOcclusion::RTAO;\n        renderAmbientOcclusionPower_.SetEnabled(\n            state.ambientOcclusion != bridge::RenderAmbientOcclusion::Off);\n        renderAmbientOcclusionRange_.SetEnabled(ssao || rtao);\n        renderAmbientOcclusionSampleCount_.SetEnabled(ssao);''')
          rep(ui,
              '        renderReflectionRoughnessCutoff_.SetEnabled(state.ssrEnabled);\n    }',
              '''        renderReflectionRoughnessCutoff_.SetEnabled(\n            state.ssrEnabled || state.raytracedReflectionsEnabled);\n        const bool hardwareRt = HasHardwareRayTracing();\n        renderRaytracedShadowsEnabled_.SetEnabled(hardwareRt);\n        renderRaytracedReflectionsEnabled_.SetEnabled(hardwareRt);\n        renderRaytracedReflectionsRange_.SetEnabled(\n            hardwareRt && state.raytracedReflectionsEnabled);\n        renderRaytracedReflectionsQuality_.SetEnabled(\n            hardwareRt && state.raytracedReflectionsEnabled);\n        renderRaytracedDiffuseEnabled_.SetEnabled(hardwareRt);\n        renderRaytracedDiffuseRange_.SetEnabled(\n            hardwareRt && state.raytracedDiffuseEnabled);\n        renderRaytracedDiffuseQuality_.SetEnabled(\n            hardwareRt && state.raytracedDiffuseEnabled);\n        renderPathTraceRestart_.SetEnabled(pathTracePreviewActive_);\n    }''')
          rep(ui,
              '    void StudioRenderPath::SetRenderWorkspaceActive(const bool active)\n    {\n        if (renderWorkspaceActive_ == active)\n            return;',
