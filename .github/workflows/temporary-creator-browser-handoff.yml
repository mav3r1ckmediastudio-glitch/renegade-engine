name: Temporary creator browser handoff repair

on:
  push:
    branches:
      - agent/creator-workflow-repair

permissions:
  contents: write

jobs:
  apply-repair:
    if: ${{ !contains(github.event.head_commit.message, '[browser-handoff-applied]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repair branch
        uses: actions/checkout@v4
        with:
          ref: agent/creator-workflow-repair
          fetch-depth: 0

      - name: Apply stable-ID browser handoff repair
        run: python Tools/temporary_fix_creator_browser_handoff.py

      - name: Validate patch text
        run: git diff --check

      - name: Commit repair and remove temporary patcher
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Renegade Repair Bot"
          git config user.email "actions@users.noreply.github.com"
          git rm .github/workflows/temporary-creator-browser-handoff.yml
          git rm Tools/temporary_fix_creator_browser_handoff.py
          git add EngineBridge/include/renegade/bridge/CreatorAssetWorkflowService.h
          git add EngineBridge/src/CreatorAssetWorkflowService.cpp
          git add Studio/src/RenegadeStudioChromeAssets.cpp
          git add Studio/src/StudioApplication.cpp
          git add Tests/CreatorAssetWorkflowGraphicsProof.cpp
          git commit -m "Fix creator browser stable-ID handoff [browser-handoff-applied]"
          git push origin HEAD:agent/creator-workflow-repair
