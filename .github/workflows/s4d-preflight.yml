name: S4D source preflight

on:
  push:
    branches:
      - scripting/s4d-references-global-hardening
    paths:
      - .github/workflows/s4d-preflight.yml

permissions:
  contents: write

jobs:
  preflight:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: scripting/s4d-references-global-hardening
          fetch-depth: 0

      - name: Run S4D source contract
        run: cmake -DRENEGADE_SOURCE_DIR="$GITHUB_WORKSPACE" -P Tests/S4DScriptReferenceAuthoringSourceContract.cmake

      - name: Check diff hygiene
        run: |
          git fetch origin main
          git diff --check origin/main...HEAD
          test -f EngineBridge/include/renegade/bridge/ScriptReferenceAuthoringService.h
          test -f EngineBridge/src/ScriptReferenceAuthoringService.cpp
          test -f Studio/src/S4DGlobalScriptInspector.cpp
          test -f Tests/S4DScriptReferenceAuthoringTests.cpp
          test -f Tests/S4DGlobalScriptAuthoringTests.cpp
          ! git diff --name-only origin/main...HEAD | grep -q '^Studio/src/StudioApplication.cpp$'

      - name: Remove helper
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/s4d-preflight.yml
          git commit -m "chore: complete S4D source preflight"
          git push origin HEAD:scripting/s4d-references-global-hardening
