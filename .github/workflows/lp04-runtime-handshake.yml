name: LP04 Runtime handshake probe

on:
  push:
    branches: [qa/terrain-props-p6-clean-windows]
    paths: ['.github/workflows/lp04-runtime-handshake.yml']
  workflow_dispatch:

permissions: {}

jobs:
  test:
    if: github.ref == 'refs/heads/qa/terrain-props-p6-clean-windows' && github.repository == 'mav3r1ckmediastudio-glitch/renegade-engine'
    name: Verify Windows audio fallback and woodland launch
    runs-on: windows-2025
    timeout-minutes: 170
    permissions:
      contents: write
    env:
      ORIGINAL_ZIP_SHA: '9dd13731db16f98c07acc870c1580c7692f88d83ac6059bb5311fa3d2af3c50a'
      ORIGINAL_REVISION: '83636ca548c3165cb809dbbb7d38851d9487d160'
    steps:
      - name: Check out the isolated audio fix
        uses: actions/checkout@v4
        with:
          submodules: recursive
          persist-credentials: false

      - name: Build the Windows Release player and audio proof
        shell: pwsh
        run: |
          cmake -S . -B BUILD/qa-runtime -A x64 -DRENEGADE_EMBED_SHADERS=ON
          if ($LASTEXITCODE) { throw 'Windows configure failed.' }
          cmake --build BUILD/qa-runtime --config Release --target RenegadeRuntime RenegadeAudioEndpointRecoveryProof --parallel
          if ($LASTEXITCODE) { throw 'Windows Release compile failed.' }

      - name: Run the missing endpoint and unexpected failure controls
        shell: pwsh
        run: |
          ctest --test-dir BUILD/qa-runtime -C Release -R '^RenegadeAudio(MissingEndpointRecovery|UnexpectedEndpointFailure)$' --output-on-failure
          if ($LASTEXITCODE) { throw 'Native audio recovery tests failed.' }
          Copy-Item BUILD/qa-runtime/Testing/Temporary/LastTest.log "$env:RUNNER_TEMP/audio-ctest.log"

      - name: Download the unpublished original woodland package
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $headers = @{ Authorization = "Bearer $env:GH_TOKEN"; Accept = 'application/octet-stream' }
          $url = "$env:GITHUB_API_URL/repos/$env:GITHUB_REPOSITORY/releases/assets/774153518"
          $archive = Join-Path $env:RUNNER_TEMP 'original-woodland.zip'
          Invoke-WebRequest -Uri $url -Headers $headers -OutFile $archive
          if ((Get-FileHash $archive -Algorithm SHA256).Hash -ne $env:ORIGINAL_ZIP_SHA) {
            throw 'Original woodland ZIP digest mismatch.'
          }

      - name: Launch a diagnostic copy with the rebuilt player
        shell: pwsh
        run: |
          $root = Join-Path $env:RUNNER_TEMP 'diagnostic-woodland'
          Expand-Archive -LiteralPath "$env:RUNNER_TEMP/original-woodland.zip" -DestinationPath $root
          $manifestPath = Join-Path $root 'package-manifest.json'
          $manifest = Get-Content -Raw -LiteralPath $manifestPath | ConvertFrom-Json
          $reportPath = Join-Path $root 'build-report.json'
          $report = Get-Content -Raw -LiteralPath $reportPath | ConvertFrom-Json
          if ($report.renegade_revision -ne $env:ORIGINAL_REVISION -or $manifest.executable -ne 'TerrainPropsStockReview.exe') {
            throw 'Original woodland package identity mismatch.'
          }
          $exe = Join-Path $root $manifest.executable
          $entry = @($manifest.files | Where-Object path -eq $manifest.executable)
          if ($entry.Count -ne 1 -or (Get-FileHash $exe -Algorithm SHA256).Hash -ne $entry[0].sha256) {
            throw 'Original executable digest mismatch.'
          }
          $runtime = 'BUILD/qa-runtime/Runtime/Release/RenegadeRuntime.exe'
          Copy-Item -LiteralPath $runtime -Destination $exe -Force
          $entry[0].bytes = (Get-Item -LiteralPath $exe).Length
          $entry[0].sha256 = (Get-FileHash -LiteralPath $exe -Algorithm SHA256).Hash.ToLowerInvariant()
          [ordered]@{
            original_revision = $env:ORIGINAL_REVISION
            original_zip_sha256 = $env:ORIGINAL_ZIP_SHA
            runtime_source = $env:GITHUB_SHA
            runtime_sha256 = $entry[0].sha256
            kind = 'diagnostic-repackage'
          } | ConvertTo-Json | Set-Content -LiteralPath "$env:RUNNER_TEMP/diagnostic-provenance.json" -Encoding utf8NoBOM
          $manifest | ConvertTo-Json -Depth 100 | Set-Content -LiteralPath $manifestPath -Encoding utf8NoBOM
          $archive = Join-Path $env:RUNNER_TEMP 'diagnostic-woodland.zip'
          [IO.Compression.ZipFile]::CreateFromDirectory($root, $archive, [IO.Compression.CompressionLevel]::Fastest, $false)
          $digest = (Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash.ToLowerInvariant()
          # The report still describes the original export. The separate provenance
          # record identifies the substituted player in this diagnostic copy.
          ./Tools/Test-WindowsStandalone.ps1 -Archive $archive -ArchiveSha256 $digest -Revision $env:ORIGINAL_REVISION -ExpectedFlowNode 'Woodland clearing' -Output "$env:RUNNER_TEMP/diagnostic-proof"

      - name: Retain only diagnostic evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: woodland-audio-fallback-diagnostics
          path: |
            ${{ runner.temp }}/audio-ctest.log
            ${{ runner.temp }}/diagnostic-provenance.json
            ${{ runner.temp }}/diagnostic-proof/result.json
            ${{ runner.temp }}/diagnostic-proof/frames.csv
            ${{ runner.temp }}/diagnostic-proof/profile/**/RuntimeBootstrap.log
