name: LP04 Runtime handshake probe

on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/lp04-runtime-handshake.yml"
      - "CMakeLists.txt"
      - "EngineBridge/**"
      - "Runtime/**"
      - "Studio/src/TestLevelRuntimeProcess.cpp"
      - "Studio/src/TestLevelRuntimeProcess.h"
      - "Tests/CMakeLists.txt"
      - "Tests/TestLevelRuntimeHandshakeTests.cpp"
      - "Tools/TerrainSurfacePacker.cpp"
      - ".gitmodules"

permissions:
  contents: read

jobs:
  handshake:
    name: LP04 real Runtime handshake (Debug)
    runs-on: windows-2025
    timeout-minutes: 30

    steps:
      - name: Check out Renegade and Wicked
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Configure MSBuild
        uses: microsoft/setup-msbuild@v2
        with:
          msbuild-architecture: x64

      - name: Configure handshake probe
        shell: pwsh
        run: >-
          cmake
          -S .
          -B BUILD/renegade
          -A x64
          -DRENEGADE_EMBED_SHADERS=ON

      - name: Build real Runtime handshake target
        shell: pwsh
        run: >-
          cmake
          --build BUILD/renegade
          --config Debug
          --target RenegadeTestLevelRuntimeHandshakeTests
          --parallel

      - name: Run real Runtime handshake probe
        shell: pwsh
        timeout-minutes: 5
        run: |
          $testExecutable = Join-Path $PWD "BUILD\renegade\Tests\Debug\RenegadeTestLevelRuntimeHandshakeTests.exe"
          $runtimeExecutable = Join-Path $PWD "BUILD\renegade\Runtime\Debug\RenegadeRuntime.exe"

          if (-not (Test-Path $testExecutable -PathType Leaf)) {
              throw "Handshake test executable was not built: $testExecutable"
          }
          if (-not (Test-Path $runtimeExecutable -PathType Leaf)) {
              throw "RenegadeRuntime.exe was not built: $runtimeExecutable"
          }

          & $testExecutable $runtimeExecutable
          if ($LASTEXITCODE -ne 0) {
              throw "LP04 real Runtime handshake probe failed with exit code $LASTEXITCODE."
          }

      - name: Upload Runtime bootstrap logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lp04-runtime-handshake-debug-${{ github.sha }}
          path: BUILD/renegade/Runtime/Debug/Logs/**
          if-no-files-found: ignore
          retention-days: 7
