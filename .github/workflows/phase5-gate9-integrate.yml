name: Phase 5 Gate 9 guarded integration

on:
  push:
    branches:
      - phase5/scene-render-gate9-render-diagnostics
    paths:
      - .github/workflows/phase5-gate9-integrate.yml

permissions:
  contents: write

jobs:
  integrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase5/scene-render-gate9-render-diagnostics
          fetch-depth: 0

      - name: Apply bounded Gate 9 integration
        shell: python
        run: |
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected exactly one match, found {count}')
              p.write_text(text.replace(old, new, 1), encoding='utf-8')

          replace_once(
              'CMakeLists.txt',
              '    include(Studio/Phase5Gate8.cmake)\n',
              '    include(Studio/Phase5Gate8.cmake)\n    include(Studio/Phase5Gate9.cmake)\n')

          replace_once(
              'Studio/src/StudioApplication.h',
              '        void ClearSelectedVertexAo();\n        void BeginRenderSlider(RenderField field);\n',
              '        void ClearSelectedVertexAo();\n'
              '        void CreateGate9DiagnosticsControls();\n'
              '        void LayoutGate9DiagnosticsControls(float fieldWidth, float& y);\n'
              '        void RefreshGate9DiagnosticsControls();\n'
              '        void ResetGate9Diagnostics();\n'
              '        void BeginRenderSlider(RenderField field);\n')

          replace_once(
              'Studio/src/Phase5Gate5RenderWorkspace.cpp',
              '        CreateGate7RenderControls();\n        CreateGate8BakeControls();\n',
              '        CreateGate7RenderControls();\n        CreateGate8BakeControls();\n        CreateGate9DiagnosticsControls();\n')

          replace_once(
              'Studio/src/Phase5Gate5RenderWorkspace.cpp',
              '        LayoutGate7RenderControls(fieldWidth, y);\n        LayoutGate8BakeControls(fieldWidth, y);\n',
              '        LayoutGate7RenderControls(fieldWidth, y);\n        LayoutGate8BakeControls(fieldWidth, y);\n        LayoutGate9DiagnosticsControls(fieldWidth, y);\n')

          replace_once(
              'Studio/src/Phase5Gate5RenderWorkspace.cpp',
              '        RefreshGate7RenderControls(state);\n        RefreshGate8BakeControls();\n',
              '        RefreshGate7RenderControls(state);\n        RefreshGate8BakeControls();\n        RefreshGate9DiagnosticsControls();\n')

          replace_once(
              'Studio/src/Phase5Gate5RenderWorkspace.cpp',
              '            if (pathTracePreviewActive_)\n                SetPathTracePreviewActive(false);\n            studioChrome_.SetRenderWorkspaceActive(false);\n',
              '            if (pathTracePreviewActive_)\n                SetPathTracePreviewActive(false);\n            ResetGate9Diagnostics();\n            studioChrome_.SetRenderWorkspaceActive(false);\n')

          Path('.github/workflows/phase5-gate9-integrate.yml').unlink()

      - name: Verify bounded product diff
        shell: bash
        run: |
          git diff --check
          test ! -e .github/workflows/phase5-gate9-integrate.yml
          grep -Fq 'include(Studio/Phase5Gate9.cmake)' CMakeLists.txt
          grep -Fq 'CreateGate9DiagnosticsControls();' Studio/src/Phase5Gate5RenderWorkspace.cpp
          grep -Fq 'LayoutGate9DiagnosticsControls(fieldWidth, y);' Studio/src/Phase5Gate5RenderWorkspace.cpp
          grep -Fq 'RefreshGate9DiagnosticsControls();' Studio/src/Phase5Gate5RenderWorkspace.cpp
          grep -Fq 'ResetGate9Diagnostics();' Studio/src/Phase5Gate5RenderWorkspace.cpp
          grep -Fq 'void CreateGate9DiagnosticsControls();' Studio/src/StudioApplication.h

      - name: Commit product integration and self-clean
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Phase 5 Gate 9: integrate realtime diagnostics surface'
          git push origin HEAD:phase5/scene-render-gate9-render-diagnostics
