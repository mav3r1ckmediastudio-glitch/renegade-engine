name: S5A Fast Validation

on:
  pull_request:
    branches:
      - main
    paths:
      - "CMakeLists.txt"
      - "EngineBridge/**"
      - "Runtime/**"
      - "Studio/**"
      - "Tests/**"
      - "WickedEngine"
      - ".gitmodules"
      - ".github/workflows/s5a-fast-validation.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: s5a-fast-validation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  fast-release:
    name: S5A fast Release validation
    runs-on: windows-2025
    timeout-minutes: 45

    steps:
      - name: Check out Renegade and pinned Wicked
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Configure MSBuild
        uses: microsoft/setup-msbuild@v2
        with:
          msbuild-architecture: x64

      - name: Restore incremental CMake build
        uses: actions/cache@v4
        with:
          path: |
            BUILD/renegade
            WickedEngine/BUILD
          key: renegade-s5a-release-${{ runner.os }}-${{ hashFiles('WickedEngine/**', 'CMakeLists.txt', 'EngineBridge/**', 'Runtime/**', 'Studio/**', 'Tests/**') }}
          restore-keys: |
            renegade-s5a-release-${{ runner.os }}-

      - name: Configure Release build
        shell: pwsh
        run: >-
          cmake
          -S .
          -B BUILD/renegade
          -A x64
          -DRENEGADE_EMBED_SHADERS=ON

      - name: Build only the owner-test targets
        shell: pwsh
        run: >-
          cmake
          --build BUILD/renegade
          --config Release
          --target RenegadeStudio RenegadeRuntime RenegadeS5CoreGameplayLuaTests
          --parallel

      - name: Run targeted S5A tests
        shell: pwsh
        run: >-
          ctest
          --test-dir BUILD/renegade
          -C Release
          --output-on-failure
          -R "RenegadeS5CoreGameplayLuaTests|RenegadeS5CoreGameplayApiTests|RenegadeTestLevelSnapshotRuntimeTests"

      - name: Upload fast validation artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: renegade-s5a-fast-release-${{ github.sha }}
          path: |
            BUILD/renegade/Studio/Release/**
            BUILD/renegade/Runtime/Release/**
            BUILD/renegade/Tests/Release/**
          if-no-files-found: warn
          retention-days: 7
