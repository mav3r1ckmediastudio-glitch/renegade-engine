name: Apply S4B validation wiring

on:
  push:
    branches:
      - scripting/s4b-action-script-inspector
    paths:
      - .github/workflows/apply-s4b-validation-wiring.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: scripting/s4b-action-script-inspector
          fetch-depth: 0
      - name: Apply validated S4B wiring
        shell: python
        run: |
          from pathlib import Path

          root = Path("CMakeLists.txt")
          text = root.read_text(encoding="utf-8")
          replacements = [
              (
                  "include(EngineBridge/S4AScriptMetadata.cmake)\n",
                  "include(EngineBridge/S4AScriptMetadata.cmake)\ninclude(EngineBridge/S4BScriptAuthoring.cmake)\n",
              ),
              (
                  "include(Studio/S1BInspectorMigration.cmake)\n",
                  "include(Studio/S1BInspectorMigration.cmake)\n    include(Studio/S4BScriptAttachmentInspector.cmake)\n",
              ),
              (
                  "    include(Tests/S4AScriptMetadata.cmake)\n",
                  "    include(Tests/S4AScriptMetadata.cmake)\n    include(Tests/S4BScriptAuthoring.cmake)\n",
              ),
          ]
          for old, new in replacements:
              if new in text:
                  continue
              if old not in text:
                  raise SystemExit(f"missing CMake anchor: {old!r}")
              text = text.replace(old, new, 1)
          root.write_text(text, encoding="utf-8")

          test = Path("Tests/S4BScriptAuthoringTests.cpp")
          text = test.read_text(encoding="utf-8")
          if "#include <chrono>" not in text:
              anchor = "#include <cmath>\n"
              if anchor not in text:
                  raise SystemExit("missing S4B test include anchor")
              text = text.replace(anchor, "#include <chrono>\n#include <cmath>\n", 1)
          test.write_text(text, encoding="utf-8")

          inspector = Path("Studio/src/S4BScriptAttachmentInspector.cpp")
          text = inspector.read_text(encoding="utf-8")
          text = text.replace(
              'row->up.SetTooltip("Move this attachment earlier.");',
              'row->up.SetTooltip("Move this attachment earlier in the entity script execution order.");',
          )
          text = text.replace(
              'row->down.SetTooltip("Move this attachment later.");',
              'row->down.SetTooltip("Move this attachment later in the entity script execution order.");',
          )
          inspector.write_text(text, encoding="utf-8")

          Path(".github/workflows/apply-s4b-validation-wiring.yml").unlink()
      - name: Commit S4B validation wiring
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "S4B: wire authoring acceptance and clarify ordering"
          git push origin HEAD:scripting/s4b-action-script-inspector
