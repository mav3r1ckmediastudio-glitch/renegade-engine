name: Apply S4D integration patch

on:
  push:
    branches:
      - scripting/s4d-references-global-hardening
    paths:
      - .github/workflows/apply-s4d-integration.yml

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: scripting/s4d-references-global-hardening
          fetch-depth: 0

      - name: Apply guarded S4D integration
        shell: python
        run: |
          from pathlib import Path

          def patch(path, old, new):
              p = Path(path)
              text = p.read_text(encoding="utf-8")
              if old not in text:
                  raise SystemExit(f"guard failed for {path}: expected source not found")
              p.write_text(text.replace(old, new, 1), encoding="utf-8")

          # ScriptAuthoringService: unlock governed GLOBAL SCRIPT discovery and Level attachments.
          patch(
              "EngineBridge/include/renegade/bridge/ScriptAuthoringService.h",
              '''        [[nodiscard]] std::vector<const ScriptAttachment*> EntityAttachments(\n            const StableId& ownerEntityId,\n            ScriptPresentation presentation) const;\n\n        [[nodiscard]] bool AttachEntitySource(\n            const StableId& ownerEntityId,\n            const ScriptAuthoringSource& source,\n            StableId& scriptInstanceId,\n            std::string& error);\n''',
              '''        [[nodiscard]] std::vector<const ScriptAttachment*> EntityAttachments(\n            const StableId& ownerEntityId,\n            ScriptPresentation presentation) const;\n        [[nodiscard]] std::vector<const ScriptAttachment*> LevelAttachments(\n            ScriptPresentation presentation) const;\n\n        [[nodiscard]] bool AttachEntitySource(\n            const StableId& ownerEntityId,\n            const ScriptAuthoringSource& source,\n            StableId& scriptInstanceId,\n            std::string& error);\n        [[nodiscard]] bool AttachLevelSource(\n            const ScriptAuthoringSource& source,\n            StableId& scriptInstanceId,\n            std::string& error);\n''')

          patch(
              "EngineBridge/src/ScriptAuthoringService.cpp",
              '''        if (presentation == ScriptPresentation::GlobalScript)\n        {\n            error = "GLOBAL SCRIPT authoring is deferred to S4D.";\n            return false;\n        }\n\n''',
              '''''')

          patch(
              "EngineBridge/src/ScriptAuthoringService.cpp",
              '''    bool ScriptAuthoringService::AttachEntitySource(\n''',
              '''    std::vector<const ScriptAttachment*> ScriptAuthoringService::LevelAttachments(\n        const ScriptPresentation presentation) const\n    {\n        std::vector<const ScriptAttachment*> result;\n        if (!loaded_)\n            return result;\n        for (const auto& attachment : document_.attachments)\n        {\n            if (attachment.scope == ScriptScope::Level &&\n                attachment.ownerEntityId.empty() &&\n                attachment.presentation == presentation)\n            {\n                result.push_back(&attachment);\n            }\n        }\n        std::sort(\n            result.begin(), result.end(),\n            [](const ScriptAttachment* left, const ScriptAttachment* right)\n            {\n                return left->order < right->order;\n            });\n        return result;\n    }\n\n    bool ScriptAuthoringService::AttachEntitySource(\n''')

          patch(
              "EngineBridge/src/ScriptAuthoringService.cpp",
              '''        if (source.metadata.presentation == ScriptPresentation::GlobalScript)\n        {\n            error = "GLOBAL SCRIPT authoring is deferred to S4D.";\n            return false;\n        }\n''',
              '''        if (source.metadata.presentation == ScriptPresentation::GlobalScript)\n        {\n            error = "GLOBAL SCRIPT sources must be attached at Level scope.";\n            return false;\n        }\n''')

          patch(
              "EngineBridge/src/ScriptAuthoringService.cpp",
              '''    bool ScriptAuthoringService::RemoveAttachment(\n''',
              '''    bool ScriptAuthoringService::AttachLevelSource(\n        const ScriptAuthoringSource& source,\n        StableId& scriptInstanceId,\n        std::string& error)\n    {\n        if (!EnsureCurrent(error))\n            return false;\n        if (source.metadata.presentation != ScriptPresentation::GlobalScript)\n        {\n            error = "Only GLOBAL SCRIPT sources can be attached at Level scope.";\n            return false;\n        }\n\n        ScriptAttachment attachment = CreateScriptAttachment(\n            ScriptScope::Level,\n            {},\n            ResolveSourceBinding(source));\n        if (!ApplyScriptMetadataDefaults(source.metadata, attachment, error))\n            return false;\n        scriptInstanceId = attachment.scriptInstanceId;\n        auto command = MakeAddScriptAttachmentCommand(\n            document_,\n            std::move(attachment),\n            error);\n        if (!command)\n            return false;\n        if (!commands_->Execute(std::move(command)))\n        {\n            error = "Could not attach GLOBAL SCRIPT through the Studio Undo/Redo stack.";\n            return false;\n        }\n        error.clear();\n        return true;\n    }\n\n    bool ScriptAuthoringService::RemoveAttachment(\n''')

          # S4C property editor: replace deferred labels with S4D governed pickers.
          patch(
              "Studio/src/S4CScriptPropertyControls.h",
              '''#include "renegade/bridge/ScriptMetadataService.h"\n''',
              '''#include "renegade/bridge/ScriptMetadataService.h"\n#include "renegade/bridge/ScriptReferenceAuthoringService.h"\n''')
          patch(
              "Studio/src/S4CScriptPropertyControls.h",
              '''            wi::gui::Label deferredValue;\n\n            bridge::ScriptMetadataPropertyDescriptor metadata;\n''',
              '''            SceneInspectorComboBox referenceValue;\n            std::vector<bridge::ScriptReferenceOption> referenceOptions;\n\n            bridge::ScriptMetadataPropertyDescriptor metadata;\n''')
          patch(
              "Studio/src/S4CScriptPropertyControls.h",
              '''        void CommitComponent(\n            std::size_t index,\n            std::size_t component,\n            const std::string& text);\n        void CommitValue(\n''',
              '''        void CommitComponent(\n            std::size_t index,\n            std::size_t component,\n            const std::string& text);\n        void CommitReference(std::size_t index, std::size_t optionIndex);\n        void CommitValue(\n''')

          patch(
              "Studio/src/S4CScriptPropertyControls.cpp",
              '''            row.deferredValue.SetPos(XMFLOAT2(controlX, rowY));\n            row.deferredValue.SetSize(XMFLOAT2(controlWidth, 28.0f));\n''',
              '''            row.referenceValue.SetPos(XMFLOAT2(controlX, rowY));\n            row.referenceValue.SetSize(XMFLOAT2(controlWidth, 28.0f));\n''')
          patch(
              "Studio/src/S4CScriptPropertyControls.cpp",
              '''        row->deferredValue.Create("S4C Deferred Reference " + suffix);\n        panel_->AddWidget(&row->deferredValue);\n''',
              '''        row->referenceValue.Create("S4D Governed Reference " + suffix);\n        row->referenceValue.OnSelect(\n            [this, index](const wi::gui::EventArgs& args)\n            {\n                CommitReference(index, static_cast<std::size_t>(args.userdata));\n            });\n        panel_->AddWidget(&row->referenceValue);\n''')
          patch(
              "Studio/src/S4CScriptPropertyControls.cpp",
              '''        row.deferredValue.SetTooltip(\n            metadata.description.empty()\n                ? std::string("Reference picker arrives in S4D.")\n                : metadata.description + " Reference picker arrives in S4D.");\n''',
              '''        row.referenceValue.SetTooltip(\n            metadata.description.empty()\n                ? std::string("Choose a governed Renegade reference.")\n                : metadata.description);\n''')
          patch(
              "Studio/src/S4CScriptPropertyControls.cpp",
              '''        case bridge::ScriptPropertyType::EntityReference:\n        case bridge::ScriptPropertyType::AssetReference:\n        case bridge::ScriptPropertyType::Animation:\n        case bridge::ScriptPropertyType::Audio:\n            row.deferredValue.SetText(\n                bridge::IsValidStableId(row.value.referenceId) || !row.value.pathHint.empty()\n                    ? "Assigned — picker in S4D"\n                    : "Unresolved — picker in S4D");\n            break;\n''',
              '''        case bridge::ScriptPropertyType::EntityReference:\n        case bridge::ScriptPropertyType::AssetReference:\n        case bridge::ScriptPropertyType::Animation:\n        case bridge::ScriptPropertyType::Audio:\n        {\n            row.referenceOptions.clear();\n            row.referenceValue.ClearItems();\n\n            bridge::ScriptReferenceOption none;\n            none.label = "(None)";\n            row.referenceOptions.push_back(none);\n\n            auto* session = bridge::StudioSession::Current();\n            std::vector<bridge::ScriptReferenceOption> discovered;\n            std::string referenceError;\n            if (session != nullptr)\n            {\n                (void)bridge::EnumerateScriptReferenceOptions(\n                    session->Scenes(),\n                    session->Projects(),\n                    type,\n                    discovered,\n                    referenceError);\n            }\n            row.referenceOptions.insert(\n                row.referenceOptions.end(),\n                discovered.begin(),\n                discovered.end());\n\n            std::size_t selected = 0;\n            if (bridge::IsValidStableId(row.value.referenceId) ||\n                !row.value.pathHint.empty())\n            {\n                const auto found = std::find_if(\n                    row.referenceOptions.begin() + 1,\n                    row.referenceOptions.end(),\n                    [&](const bridge::ScriptReferenceOption& option)\n                    {\n                        return option.referenceId == row.value.referenceId;\n                    });\n                if (found != row.referenceOptions.end())\n                {\n                    selected = static_cast<std::size_t>(\n                        std::distance(row.referenceOptions.begin(), found));\n                }\n                else\n                {\n                    bridge::ScriptReferenceOption unresolved;\n                    unresolved.referenceId = row.value.referenceId;\n                    unresolved.pathHint = row.value.pathHint;\n                    unresolved.resolved = false;\n                    unresolved.label = row.value.pathHint.empty()\n                        ? "⚠ Unresolved"\n                        : "⚠ Unresolved — " + row.value.pathHint;\n                    row.referenceOptions.push_back(std::move(unresolved));\n                    selected = row.referenceOptions.size() - 1;\n                }\n            }\n\n            for (std::size_t option = 0;\n                option < row.referenceOptions.size(); ++option)\n            {\n                row.referenceValue.AddItem(\n                    row.referenceOptions[option].label,\n                    static_cast<std::uint64_t>(option));\n            }\n            row.referenceValue.SetSelectedWithoutCallback(\n                static_cast<int>(selected));\n            break;\n        }\n''')
          patch(
              "Studio/src/S4CScriptPropertyControls.cpp",
              '''        row.deferredValue.SetVisible(false);\n''',
              '''        row.referenceValue.SetVisible(false);\n''')
          patch(
              "Studio/src/S4CScriptPropertyControls.cpp",
              '''        case bridge::ScriptPropertyType::EntityReference:\n        case bridge::ScriptPropertyType::AssetReference:\n        case bridge::ScriptPropertyType::Animation:\n        case bridge::ScriptPropertyType::Audio:\n            row.deferredValue.SetVisible(true);\n            break;\n''',
              '''        case bridge::ScriptPropertyType::EntityReference:\n        case bridge::ScriptPropertyType::AssetReference:\n        case bridge::ScriptPropertyType::Animation:\n        case bridge::ScriptPropertyType::Audio:\n            row.referenceValue.SetVisible(true);\n            break;\n''')
          patch(
              "Studio/src/S4CScriptPropertyControls.cpp",
              '''    void S4CScriptPropertyEditor::CommitValue(\n''',
              '''    void S4CScriptPropertyEditor::CommitReference(\n        const std::size_t index,\n        const std::size_t optionIndex)\n    {\n        if (index >= usedRows_ ||\n            optionIndex >= rows_[index]->referenceOptions.size())\n        {\n            return;\n        }\n        const auto& option = rows_[index]->referenceOptions[optionIndex];\n        if (!option.resolved)\n        {\n            ApplyValueToWidgets(index);\n            SetStatus("S4D REFERENCES // unresolved value preserved; choose another target or (None)");\n            return;\n        }\n\n        auto* session = bridge::StudioSession::Current();\n        if (session == nullptr)\n            return;\n\n        bridge::ScriptPropertyValue value;\n        std::string error;\n        if (!bridge::BuildScriptReferenceProperty(\n                rows_[index]->metadata, option, value, error) ||\n            !bridge::CommitScriptReferenceAuthoringEdit(\n                session->Scripts(),\n                session->Commands(),\n                scriptInstanceId_,\n                rows_[index]->metadata,\n                option,\n                error))\n        {\n            ApplyValueToWidgets(index);\n            SetStatus("S4D REFERENCES // " + error);\n            return;\n        }\n\n        rows_[index]->value = std::move(value);\n        ApplyValueToWidgets(index);\n        SetStatus(\n            "S4D REFERENCES // " +\n            (rows_[index]->metadata.label.empty()\n                ? rows_[index]->metadata.name\n                : rows_[index]->metadata.label) +\n            " updated");\n        RequestRefresh();\n    }\n\n    void S4CScriptPropertyEditor::CommitValue(\n''')

          # Register GLOBAL SCRIPT provider with the shared Inspector framework.
          patch(
              "Studio/src/S1BInspectorSectionMigration.cpp",
              '''#include "S4BScriptAttachmentInspector.h"\n''',
              '''#include "S4BScriptAttachmentInspector.h"\n#include "S4DGlobalScriptInspector.h"\n''')
          patch(
              "Studio/src/S1BInspectorSectionMigration.cpp",
              '''        RegisterS4BScriptAttachmentInspector(\n            *this,\n            inspectorPanel_,\n            inspectorSectionRegistry_,\n            [this]() { RefreshInspector(); },\n            [this](std::string status)\n            {\n                studioChrome_.SetStatusText(std::move(status));\n            });\n''',
              '''        RegisterS4BScriptAttachmentInspector(\n            *this,\n            inspectorPanel_,\n            inspectorSectionRegistry_,\n            [this]() { RefreshInspector(); },\n            [this](std::string status)\n            {\n                studioChrome_.SetStatusText(std::move(status));\n            });\n        RegisterS4DGlobalScriptInspector(\n            *this,\n            inspectorPanel_,\n            inspectorSectionRegistry_,\n            [this]() { RefreshInspector(); },\n            [this](std::string status)\n            {\n                studioChrome_.SetStatusText(std::move(status));\n            });\n''')
          patch(
              "Studio/src/S1BInspectorSectionMigration.cpp",
              '''        for (const char* sectionId : {"transform", "rendering", "materials", S4BActionSectionId, S4BScriptSectionId})\n''',
              '''        for (const char* sectionId : {"transform", "rendering", "materials", S4BActionSectionId, S4BScriptSectionId, S4DGlobalScriptSectionId})\n''')
          patch(
              "Studio/src/S1BInspectorSectionMigration.cpp",
              '''        PrepareS4BScriptAttachmentInspector(*this);\n''',
              '''        PrepareS4BScriptAttachmentInspector(*this);\n        PrepareS4DGlobalScriptInspector(*this);\n''')

          # Root build graph.
          patch(
              "CMakeLists.txt",
              '''include(EngineBridge/S4CScriptPropertyAuthoring.cmake)\n''',
              '''include(EngineBridge/S4CScriptPropertyAuthoring.cmake)\ninclude(EngineBridge/S4DScriptReferenceAuthoring.cmake)\n''')
          patch(
              "CMakeLists.txt",
              '''    include(Studio/S4CScriptPropertyControls.cmake)\n''',
              '''    include(Studio/S4CScriptPropertyControls.cmake)\n    include(Studio/S4DGlobalScriptInspector.cmake)\n''')
          patch(
              "CMakeLists.txt",
              '''    include(Tests/S4CScriptPropertyAuthoring.cmake)\n''',
              '''    include(Tests/S4CScriptPropertyAuthoring.cmake)\n    include(Tests/S4DScriptReferenceAuthoring.cmake)\n''')

      - name: Commit integration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/apply-s4d-integration.yml
          git add CMakeLists.txt EngineBridge Studio
          git diff --cached --check
          git commit -m "S4D: integrate references and GLOBAL SCRIPT authoring"
          git push origin HEAD:scripting/s4d-references-global-hardening
