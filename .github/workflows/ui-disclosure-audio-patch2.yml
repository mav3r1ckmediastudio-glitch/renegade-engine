name: UI disclosure and audio patch

on:
  push:
    branches:
      - ui/disclosure-audio-zorder

permissions:
  contents: write

jobs:
  patch-source:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: ui/disclosure-audio-zorder
          fetch-depth: 0

      - name: Apply Studio UI consistency gate
        run: python3 Tools/apply-ui-disclosure-patch.py

      - name: Remove temporary helpers
        run: |
          rm -f .github/workflows/ui-disclosure-audio-patch.yml
          rm -f .github/workflows/ui-disclosure-audio-patch2.yml
          rm -f Tools/apply-ui-disclosure-patch.py

      - name: Commit and push gate
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Studio UI: enforce disclosure policy and menu ownership"
          git push origin HEAD:ui/disclosure-audio-zorder
