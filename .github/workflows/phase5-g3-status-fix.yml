name: Phase 5 Gate 3 Studio compile fix

on:
  push:
    branches:
      - phase5/scene-render-gate3-decals-probes
    paths:
      - .github/workflows/phase5-g3-status-fix.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase5/scene-render-gate3-decals-probes
      - name: Remove invalid probe status override
        shell: python
        run: |
          from pathlib import Path
          path = Path('Studio/src/StudioApplication.cpp')
          text = path.read_text(encoding='utf-8')
          target = '                statusOverride_ = "ENVIRONMENT PROBE REFRESH REQUESTED";\n'
          count = text.count(target)
          if count != 1:
              raise SystemExit(f'expected exactly one invalid status assignment, found {count}')
          path.write_text(text.replace(target, '', 1), encoding='utf-8')
      - name: Remove fix helper
        run: git rm .github/workflows/phase5-g3-status-fix.yml
      - name: Verify bounded fix
        shell: bash
        run: |
          git diff --check
          changed="$({ git diff --name-only; git diff --cached --name-only; } | sort -u)"
          test "$changed" = $'.github/workflows/phase5-g3-status-fix.yml\nStudio/src/StudioApplication.cpp'
          ! grep -q 'ENVIRONMENT PROBE REFRESH REQUESTED' Studio/src/StudioApplication.cpp
          cmake -DRENEGADE_SOURCE_DIR="$PWD" -P Tests/Phase5Gate3SourceContract.cmake
      - name: Commit compile fix
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Studio/src/StudioApplication.cpp .github/workflows/phase5-g3-status-fix.yml
          git commit -m "Phase 5 Gate 3: fix Studio probe refresh compile"
          git push origin HEAD:phase5/scene-render-gate3-decals-probes
