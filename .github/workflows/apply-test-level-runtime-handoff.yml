name: Apply Test Level runtime handoff

on:
  push:
    branches:
      - perf/test-level-runtime-handoff
    paths:
      - .github/workflows/apply-test-level-runtime-handoff.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Check out handoff branch
        uses: actions/checkout@v4
        with:
          ref: perf/test-level-runtime-handoff
          fetch-depth: 0

      - name: Apply focused Test Level handoff patch
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          header_path = Path('Studio/src/StudioApplication.h')
          source_path = Path('Studio/src/StudioApplication.cpp')
          header = header_path.read_text(encoding='utf-8')
          source = source_path.read_text(encoding='utf-8')

          def replace_once(text, old, new, label):
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected exactly one match, found {count}')
              return text.replace(old, new, 1)

          header = replace_once(
              header,
              '        void DeleteGPUResources() override;\n        void Load() override;\n        void Render() const override;\n',
              '        void DeleteGPUResources() override;\n        void Load() override;\n        void PreRender() override;\n        void Render() const override;\n',
              'PreRender declaration')

          header = replace_once(
              header,
              '        [[nodiscard]] bool IsProjectLoadBlocking() const noexcept\n        {\n            return projectLoadingOverlay_.IsBlocking();\n        }\n\n        [[nodiscard]] bool IsPhysicsLabActive() const noexcept\n',
              '        [[nodiscard]] bool IsProjectLoadBlocking() const noexcept\n        {\n            return projectLoadingOverlay_.IsBlocking();\n        }\n\n        [[nodiscard]] bool IsTestLevelRuntimeActive() const noexcept\n        {\n            return testLevelRuntime_.IsActive();\n        }\n\n        [[nodiscard]] bool IsPhysicsLabActive() const noexcept\n',
              'Test Level activity seam')

          header = replace_once(
              header,
              '        void Render() const override\n        {\n            if (IsPhysicsLabActive())\n            {\n                wi::RenderPath3D::Render();\n                return;\n            }\n            StudioRenderPath::Render();\n        }\n\n        void Compose(wi::graphics::CommandList cmd) const override\n        {\n            if (IsPhysicsLabActive())\n            {\n                wi::RenderPath3D::Compose(cmd);\n                return;\n            }\n            StudioRenderPath::Compose(cmd);\n        }\n',
              '        void Render() const override\n        {\n            // Test Level owns the foreground Runtime. Its resource handoff\n            // takes precedence over specialist Studio viewport routing.\n            if (IsTestLevelRuntimeActive())\n            {\n                StudioRenderPath::Render();\n                return;\n            }\n            if (IsPhysicsLabActive())\n            {\n                wi::RenderPath3D::Render();\n                return;\n            }\n            StudioRenderPath::Render();\n        }\n\n        void Compose(wi::graphics::CommandList cmd) const override\n        {\n            if (IsTestLevelRuntimeActive())\n            {\n                StudioRenderPath::Compose(cmd);\n                return;\n            }\n            if (IsPhysicsLabActive())\n            {\n                wi::RenderPath3D::Compose(cmd);\n                return;\n            }\n            StudioRenderPath::Compose(cmd);\n        }\n',
              'Physics Lab handoff precedence')

          source = replace_once(
              source,
              '    void StudioRenderPath::Render() const\n    {\n        if (pathTracePreviewActive_)\n',
              '    void StudioRenderPath::PreRender()\n    {\n        if (testLevelRuntime_.IsActive())\n        {\n            // Runtime owns the live 3D world during Test Level. Keep only the\n            // lightweight 2D Studio surface alive so STOP/status remain usable.\n            wi::RenderPath2D::PreRender();\n            return;\n        }\n        wi::RenderPath3D::PreRender();\n    }\n\n    void StudioRenderPath::Render() const\n    {\n        if (testLevelRuntime_.IsActive())\n        {\n            wi::RenderPath2D::Render();\n            return;\n        }\n        if (pathTracePreviewActive_)\n',
              '2D-only PreRender/Render handoff')

          source = replace_once(
              source,
              '    void StudioRenderPath::Update(const float dt)\n    {\n        if (!pathTracePreviewActive_ && session_ != nullptr &&\n',
              '    void StudioRenderPath::Update(const float dt)\n    {\n        PollTestLevel();\n        if (testLevelRuntime_.IsActive())\n        {\n            // The child Runtime is the sole 3D owner while Test Level runs.\n            // RenderPath2D keeps wiGUI/chrome responsive without ticking the\n            // editor scene, visibility, physics, vegetation or render graph.\n            wi::RenderPath2D::Update(dt);\n\n            if (pendingAction_ == EditorAction::StopTestLevel)\n            {\n                ProcessPendingAction();\n                return;\n            }\n            pendingAction_ = EditorAction::None;\n\n            const auto state = testLevelRuntime_.LastResult().state;\n            statusLabel_.SetText(\n                state == TestLevelProcessState::Running\n                    ? "TEST LEVEL // RUNNING // UNSAVED SNAPSHOT"\n                    : "TEST LEVEL // STARTING // UNSAVED SNAPSHOT");\n            if (session_ != nullptr)\n                studioChrome_.SetSceneDirty(session_->Commands().IsDirty());\n            studioChrome_.SetStatusText(statusLabel_.GetText());\n            return;\n        }\n\n        if (!pathTracePreviewActive_ && session_ != nullptr &&\n',
              'early Test Level update handoff')

          source = replace_once(
              source,
              '        PollTestLevel();\n\n        // The capture button is processed inside the previous frame\'s GUI\n',
              '        // The capture button is processed inside the previous frame\'s GUI\n',
              'remove late PollTestLevel')

          late_pattern = re.compile(
              r'\n        if \(testLevelRuntime_\.IsActive\(\)\)\n        \{\n'
              r'            // StopTestLevel is the only editor action that must still take\n'
              r'.*?'
              r'            return;\n'
              r'        \}\n\n'
              r'        if \(workspaceLayoutDirty_\)',
              re.S)
          source, count = late_pattern.subn('\n        if (workspaceLayoutDirty_)', source, count=1)
          if count != 1:
              raise SystemExit(f'remove late Test Level gate: expected one match, found {count}')

          source = replace_once(
              source,
              '    void StudioRenderPath::Compose(const wi::graphics::CommandList cmd) const\n    {\n        if (pathTracePreviewActive_)\n',
              '    void StudioRenderPath::Compose(const wi::graphics::CommandList cmd) const\n    {\n        if (testLevelRuntime_.IsActive())\n        {\n            wi::RenderPath2D::Compose(cmd);\n            return;\n        }\n        if (pathTracePreviewActive_)\n',
              '2D-only Compose handoff')

          required = [
              'wi::RenderPath2D::Update(dt);',
              'wi::RenderPath2D::PreRender();',
              'wi::RenderPath2D::Render();',
              'wi::RenderPath2D::Compose(cmd);',
              'IsTestLevelRuntimeActive()',
          ]
          combined = header + source
          for token in required:
              if token not in combined:
                  raise SystemExit(f'missing required handoff token: {token}')

          header_path.write_text(header, encoding='utf-8', newline='\n')
          source_path.write_text(source, encoding='utf-8', newline='\n')
          PY

      - name: Commit source handoff and remove helper workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/apply-test-level-runtime-handoff.yml
          git add Studio/src/StudioApplication.cpp Studio/src/StudioApplication.h
          git diff --cached --check
          git commit -m "Perf: suspend Studio 3D while Test Level owns Runtime"
          git push origin HEAD:perf/test-level-runtime-handoff
