name: PR58 Gate3 hub string escape correction

on:
  push:
    branches:
      - agent/pr58-project-hub-lifecycle-reliability

permissions:
  contents: write

jobs:
  fix-gate3:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out exact branch head
        uses: actions/checkout@v4
        with:
          ref: agent/pr58-project-hub-lifecycle-reliability
          fetch-depth: 0

      - name: Correct Hub string escapes
        run: python3 Tools/PR58Gate3FixEscapes.py

      - name: Validate and commit real source
        shell: bash
        run: |
          rm .github/workflows/pr58-gate3-fix-escapes.yml
          rm Tools/PR58Gate3FixEscapes.py
          git config user.name "mav3r1ckmediastudio-glitch"
          git config user.email "mav3r1ckmediastudio@gmail.com"
          git add Studio/src/StudioApplication.cpp .github/workflows/pr58-gate3-fix-escapes.yml Tools/PR58Gate3FixEscapes.py
          git diff --cached --check
          git commit -m "gate3: preserve hub detail string escapes"
          git push origin HEAD:agent/pr58-project-hub-lifecycle-reliability
