name: Apply S4B const audit fix

on:
  push:
    branches:
      - scripting/s4b-action-script-inspector
    paths:
      - .github/workflows/apply-s4b-const-audit.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: scripting/s4b-action-script-inspector
          fetch-depth: 0
      - name: Add const Selection accessor
        shell: python
        run: |
          from pathlib import Path
          path = Path("EngineBridge/include/renegade/bridge/StudioSession.h")
          text = path.read_text(encoding="utf-8")
          anchor = "        [[nodiscard]] SelectionService& Selection() noexcept\n        {\n            return selection_;\n        }\n\n"
          addition = "        [[nodiscard]] const SelectionService& Selection() const noexcept\n        {\n            return selection_;\n        }\n\n"
          if addition not in text:
              if anchor not in text:
                  raise SystemExit("missing StudioSession Selection accessor anchor")
              text = text.replace(anchor, anchor + addition, 1)
          path.write_text(text, encoding="utf-8")
      - name: Run S4B source contract
        shell: bash
        run: cmake -DRENEGADE_SOURCE_DIR="$PWD" -P Tests/S4BScriptAuthoringSourceContract.cmake
      - name: Remove helper and commit
        shell: bash
        run: |
          rm .github/workflows/apply-s4b-const-audit.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "S4B: complete const-safe Inspector integration audit"
          git push origin HEAD:scripting/s4b-action-script-inspector
