name: Apply S4D legacy test compatibility

on:
  push:
    branches:
      - scripting/s4d-references-global-hardening
    paths:
      - .github/workflows/apply-s4d-test-compat.yml

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: scripting/s4d-references-global-hardening

      - name: Update S4B extension expectation
        shell: python
        run: |
          from pathlib import Path
          p = Path("Tests/S4BScriptAuthoringTests.cpp")
          text = p.read_text(encoding="utf-8")
          old = '''    std::vector<ScriptAuthoringSource> globals;\n    diagnostics.clear();\n    error.clear();\n    ok = Expect(\n        !session.Scripts().EnumerateProjectSources(\n            ScriptPresentation::GlobalScript, globals, diagnostics, error) &&\n        error.find("S4D") != std::string::npos,\n        "GLOBAL SCRIPT authoring remains deferred to S4D") && ok;\n'''
          new = '''    // S4D extends the same governed source catalogue to GLOBAL SCRIPT. This\n    // S4B fixture has no GLOBAL SCRIPT source, so discovery succeeds with an\n    // empty compatible list while retaining any malformed-source diagnostics.\n    std::vector<ScriptAuthoringSource> globals;\n    diagnostics.clear();\n    error.clear();\n    ok = Expect(\n        session.Scripts().EnumerateProjectSources(\n            ScriptPresentation::GlobalScript, globals, diagnostics, error),\n        "GLOBAL SCRIPT catalogue extension remains compatible: " + error) && ok;\n    ok = Expect(globals.empty(), "S4B fixture has no GLOBAL SCRIPT sources") && ok;\n'''
          if old not in text:
              raise SystemExit("S4B GLOBAL SCRIPT compatibility guard failed")
          p.write_text(text.replace(old, new, 1), encoding="utf-8")

      - name: Commit compatibility update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/apply-s4d-test-compat.yml
          git add Tests/S4BScriptAuthoringTests.cpp
          git diff --cached --check
          git commit -m "S4D: update S4B GLOBAL SCRIPT extension expectation"
          git push origin HEAD:scripting/s4d-references-global-hardening
