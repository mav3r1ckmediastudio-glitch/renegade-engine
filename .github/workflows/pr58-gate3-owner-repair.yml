name: PR58 Gate3 Owner Repair

# Triggered once to finish the owner-requested Gate 3 repair.
on:
  push:
    branches:
      - agent/pr58-project-hub-lifecycle-reliability

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out exact PR head
        uses: actions/checkout@v4
        with:
          ref: agent/pr58-project-hub-lifecycle-reliability
          fetch-depth: 0

      - name: Repair Gate 3 plate and Open Project path
        run: python Tools/PR58-Gate3OwnerRepair.py

      - name: Assert scoped tree
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          mapfile -t changed < <(git diff --name-only)
          printf 'Changed before cleanup:\n%s\n' "${changed[*]}"
          for path in "${changed[@]}"; do
            case "$path" in
              Studio/assets/renegade-project-hub-concept.jpg|Studio/assets/renegade-project-hub-concept.png|Studio/src/StudioApplication.cpp|Studio/src/RenegadeProjectHub.cpp|Studio/CMakeLists.txt)
                ;;
              *)
                echo "Unexpected repair path: $path" >&2
                exit 1
                ;;
            esac
          done
          grep -q 'PR58 Gate 3: invoke the proven project-open flow directly' Studio/src/StudioApplication.cpp
          grep -q 'Required Gate 3 Hub plate is missing' Studio/CMakeLists.txt
          grep -q 'compare_files' Studio/CMakeLists.txt

      - name: Commit final repair and remove one-shot machinery
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/pr58-gate3-owner-repair.yml Tools/PR58-Gate3OwnerRepair.py
          git add Studio/assets/renegade-project-hub-concept.jpg Studio/assets/renegade-project-hub-concept.png Studio/src/StudioApplication.cpp Studio/src/RenegadeProjectHub.cpp Studio/CMakeLists.txt 2>/dev/null || true
          git diff --cached --check
          git commit -m 'gate3: restore Hub plate and project opening'
          git push origin HEAD:agent/pr58-project-hub-lifecycle-reliability
