40c2a5830ce8ea7816024a26752892c872793d3e'''.splitlines()
          token=os.environ['GH_TOKEN']; repo=os.environ['REPO']
          for sha in shas:
              req=urllib.request.Request(f'https://api.github.com/repos/{repo}/git/blobs/{sha}', method='HEAD', headers={'Authorization':f'Bearer {token}','X-GitHub-Api-Version':'2022-11-28'})
              try:
                  with urllib.request.urlopen(req) as r: print('PRESENT', sha, r.status)
              except urllib.error.HTTPError as e: print('MISSING', sha, e.code)
          PY
