name: Gate 5 payload check
on:
  push:
    branches: [staging/phase5-gate5-payload-check]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - name: Check exact chunk blobs
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        shell: bash
        run: |
          python - <<'PY'
          import os, urllib.request, urllib.error
          shas = '''9efacc30f3b2ea89979b5f9de18d4c5444baba27
0412cc5ed8635f1f17380f2fcacf00b436564821
f1482d86d1dcb7ecba8cc92ce494eb7c03a0a0b8
0a276e9ae8932b849df27d4bd26e5e9612d9a45e
10e402b5231508121611bb6aaf64a376e0cdc936
d768677768b6661e8bda112c51d59cdb0fa664a9
188fd41be49193650eb109eac6442d9e067c3aa8
75eeb604207dbd15fad3a6a29985297873e8490e
c1e5f90c00bf2a226816d4054d6997ba799a1315
31c8fb2c711c99fc268626337800f5b84936faf9
c919ad63958602357b5342453026af50b31a12a0
