name: PR58 Gate3 Final Fix

on:
  push:
    branches:
      - agent/pr58-project-hub-lifecycle-reliability

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: agent/pr58-project-hub-lifecycle-reliability
          fetch-depth: 0

      - name: Apply asserted Gate 3 correction
        run: python .github/scripts/pr58_gate3_final_fix.py

      - name: Commit correction
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Studio/src/RenegadeProjectHub.cpp Studio/src/StudioApplication.cpp .github/scripts/pr58_gate3_final_fix.py .github/workflows/pr58-gate3-final-fix.yml
          git diff --cached --check
          git commit -m "gate3: align approved hub and restore project open"
          git push origin HEAD:agent/pr58-project-hub-lifecycle-reliability
