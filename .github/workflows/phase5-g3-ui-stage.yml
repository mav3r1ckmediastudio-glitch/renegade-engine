name: Phase 5 Gate 3 Studio UI stage

on:
  push:
    branches:
      - phase5/scene-render-gate3-decals-probes
    paths:
      - .github/workflows/phase5-g3-ui-stage.yml

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase5/scene-render-gate3-decals-probes
      - name: Apply bounded Gate 3 Studio UI integration
        shell: python
        run: |
          from pathlib import Path

          def patch(path, old, new):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected one anchor, found {count}: {old[:120]!r}')
              p.write_text(text.replace(old, new, 1), encoding='utf-8')

          # Chrome actions + ADD menu.
          patch('Studio/src/RenegadeStudioChrome.h',
              '            CreateCamera,\n            ImportModel,',
              '            CreateCamera,\n            CreateDecal,\n            CreateEnvironmentProbe,\n            ImportModel,')

          patch('Studio/src/RenegadeStudioChrome.cpp',
              '                items = {{"POINT LIGHT", true}, {"SPOT LIGHT", true},\n                    {"DIRECTIONAL LIGHT", true}, {"RECTANGLE LIGHT", true},\n                    {"CAMERA", true}, {"IMPORT MODEL...", true}};',
              '                items = {{"POINT LIGHT", true}, {"SPOT LIGHT", true},\n                    {"DIRECTIONAL LIGHT", true}, {"RECTANGLE LIGHT", true},\n                    {"CAMERA", true}, {"DECAL", true},\n                    {"ENVIRONMENT PROBE", true}, {"IMPORT MODEL...", true}};')

          patch('Studio/src/RenegadeStudioChrome.cpp',
              '                        constexpr std::array<Action, 6> actions = {\n                            Action::CreatePointLight,\n                            Action::CreateSpotLight,\n                            Action::CreateDirectionalLight,\n                            Action::CreateRectangleLight,\n                            Action::CreateCamera,\n                            Action::ImportModel};',
              '                        constexpr std::array<Action, 8> actions = {\n                            Action::CreatePointLight,\n                            Action::CreateSpotLight,\n                            Action::CreateDirectionalLight,\n                            Action::CreateRectangleLight,\n                            Action::CreateCamera,\n                            Action::CreateDecal,\n                            Action::CreateEnvironmentProbe,\n                            Action::ImportModel};')

          # Studio declarations.
          patch('Studio/src/StudioApplication.h',
              '#include "renegade/bridge/CameraService.h"\n#include "renegade/bridge/SceneComponentService.h"',
              '#include "renegade/bridge/CameraService.h"\n#include "renegade/bridge/DecalProbeService.h"\n#include "renegade/bridge/MaterialService.h"\n#include "renegade/bridge/SceneComponentService.h"')

          patch('Studio/src/StudioApplication.h',
              '            CreateLight,\n            CreateCamera,\n            OpenScene,',
              '            CreateLight,\n            CreateCamera,\n            CreateDecal,\n            CreateEnvironmentProbe,\n            OpenScene,')

          patch('Studio/src/StudioApplication.h',
              '        void CreateCameraFromView();\n        void AlignSelectedCameraToView();\n        void ViewFromSelectedCamera();\n        void CreateLight(',
              '        void CreateCameraFromView();\n        void AlignSelectedCameraToView();\n        void ViewFromSelectedCamera();\n        void CreateDecalFromView();\n        void CreateEnvironmentProbeFromView();\n        bool CommitSelectedDecal(const bridge::DecalState& state);\n        bool CommitSelectedEnvironmentProbe(const bridge::EnvironmentProbeState& state);\n        void CreateLight(')

          patch('Studio/src/StudioApplication.h',
              '        bool HandleCameraSceneIcons(const XMFLOAT4& pointer);\n        bool HandleLightSceneIcons(const XMFLOAT4& pointer);',
              '        bool HandleCameraSceneIcons(const XMFLOAT4& pointer);\n        bool HandleDecalProbeSceneIcons(const XMFLOAT4& pointer);\n        bool HandleLightSceneIcons(const XMFLOAT4& pointer);')

          patch('Studio/src/StudioApplication.h',
              '        SceneInspectorButton cameraAlignToView_;\n        SceneInspectorButton cameraViewFrom_;\n        wi::gui::Label lightLabel_;',
              '        SceneInspectorButton cameraAlignToView_;\n        SceneInspectorButton cameraViewFrom_;\n        wi::gui::Label decalLabel_;\n        SceneInspectorCheckBox decalBaseColorOnlyAlpha_;\n        SceneInspectorSlider decalSlopeBlend_;\n        wi::gui::Label decalMaterialLabel_;\n        SceneInspectorSlider decalBaseColorRed_;\n        SceneInspectorSlider decalBaseColorGreen_;\n        SceneInspectorSlider decalBaseColorBlue_;\n        SceneInspectorSlider decalOpacity_;\n        wi::gui::Label environmentProbeLabel_;\n        SceneInspectorComboBox environmentProbeResolution_;\n        SceneInspectorCheckBox environmentProbeRealtime_;\n        SceneInspectorSlider environmentProbeInterval_;\n        SceneInspectorCheckBox environmentProbeMsaa_;\n        SceneInspectorSlider environmentProbeViewDistance_;\n        SceneInspectorButton environmentProbeRefresh_;\n        wi::gui::Label lightLabel_;')

          # Chrome action routing.
          patch('Studio/src/StudioApplication.cpp',
              '            case RenegadeStudioChrome::Action::CreateCamera:\n                pendingAction_ = EditorAction::CreateCamera;\n                break;\n            case RenegadeStudioChrome::Action::Focus:',
              '            case RenegadeStudioChrome::Action::CreateCamera:\n                pendingAction_ = EditorAction::CreateCamera;\n                break;\n            case RenegadeStudioChrome::Action::CreateDecal:\n                pendingAction_ = EditorAction::CreateDecal;\n                break;\n            case RenegadeStudioChrome::Action::CreateEnvironmentProbe:\n                pendingAction_ = EditorAction::CreateEnvironmentProbe;\n                break;\n            case RenegadeStudioChrome::Action::Focus:')

          patch('Studio/src/StudioApplication.cpp',
              '        case EditorAction::CreateCamera:\n            CreateCameraFromView();\n            break;\n        case EditorAction::OpenScene:',
              '        case EditorAction::CreateCamera:\n            CreateCameraFromView();\n            break;\n        case EditorAction::CreateDecal:\n            CreateDecalFromView();\n            break;\n        case EditorAction::CreateEnvironmentProbe:\n            CreateEnvironmentProbeFromView();\n            break;\n        case EditorAction::OpenScene:')

          # Inspector widgets are deliberately inserted beside the accepted camera controls.
          patch('Studio/src/StudioApplication.cpp',
              '        inspectorPanel_.AddWidget(&cameraViewFrom_);\n\n        createSectionLabel(\n            lightLabel_,',
              '''        inspectorPanel_.AddWidget(&cameraViewFrom_);

        createSectionLabel(
            decalLabel_,
            "Decal Section",
            "DECAL // NATIVE WICKED");
        decalBaseColorOnlyAlpha_.Create("Base color alpha only: ");
        decalBaseColorOnlyAlpha_.SetTooltip(
            "Use only the base-colour texture alpha while allowing normal/surface decal detail.");
        decalBaseColorOnlyAlpha_.OnClick([this](const wi::gui::EventArgs& args)
        {
            if (session_ == nullptr)
                return;
            const auto entity = session_->Selection().SelectedEntity();
            auto* decal = session_->Scenes().GetScene().decals.GetComponent(entity);
            if (decal == nullptr)
                return;
            auto state = bridge::CaptureDecal(*decal);
            state.baseColorOnlyAlpha = args.bValue;
            CommitSelectedDecal(state);
        });
        inspectorPanel_.AddWidget(&decalBaseColorOnlyAlpha_);
        decalSlopeBlend_.Create(0.0f, 8.0f, 0.0f, 801.0f,
            "Decal Slope Blend", "SLOPE BLEND");
        decalSlopeBlend_.SetTooltip(
            "Blend projection by receiving-surface slope. Zero disables slope rejection.");
        decalSlopeBlend_.OnValueCommitted([this](float value)
        {
            if (session_ == nullptr)
                return;
            const auto entity = session_->Selection().SelectedEntity();
            auto* decal = session_->Scenes().GetScene().decals.GetComponent(entity);
            if (decal == nullptr)
