          patch('Studio/src/StudioApplication.cpp',
              '        const bool cameraIconConsumed = HandleCameraSceneIcons(pointer);\n        const bool lightIconConsumed = HandleLightSceneIcons(pointer);',
              '        const bool cameraIconConsumed = HandleCameraSceneIcons(pointer);\n        const bool decalProbeIconConsumed = HandleDecalProbeSceneIcons(pointer);\n        const bool lightIconConsumed = HandleLightSceneIcons(pointer);')

          patch('Studio/src/StudioApplication.cpp',
              '        if (cameraIconConsumed || lightIconConsumed)\n        {',
              '        if (cameraIconConsumed || decalProbeIconConsumed || lightIconConsumed)\n        {')

          # Tighten the source contract now that Studio integration is mandatory.
