        message(FATAL_ERROR "Gate 3 Studio integration missing ${token}")
    endif()
endforeach()
foreach(token IN ITEMS "CreateDecal" "CreateEnvironmentProbe" "DecalProbeService.h")
    string(FIND "${studio_header_text}" "${token}" found)
    if(found EQUAL -1)
        message(FATAL_ERROR "Gate 3 Studio header missing ${token}")
    endif()
endforeach()
foreach(token IN ITEMS "DECAL" "ENVIRONMENT PROBE" "Action::CreateDecal" "Action::CreateEnvironmentProbe")
    string(FIND "${chrome_text}" "${token}" found)
    if(found EQUAL -1)
        message(FATAL_ERROR "Gate 3 ADD menu missing ${token}")
    endif()
endforeach()
''')
          p.write_text(text, encoding='utf-8')

          # The workflow must not survive in the implementation tree.
