                    return;
                auto state = bridge::CaptureMaterial(*material);
                if (component == 0) state.baseColor.x = value;
                else if (component == 1) state.baseColor.y = value;
                else if (component == 2) state.baseColor.z = value;
                else state.baseColor.w = value;
                (void)session_->Commands().Execute(
                    std::make_unique<bridge::SetMaterialCommand>(
                        scene, materialEntity, state));
                RefreshInspector();
                RefreshStatus();
            });
