          text = text.replace(
              '# Studio-facing checks become active once the Gate 3 UI integration lands.\nif(EXISTS "${studio_source}" AND EXISTS "${studio_header}" AND EXISTS "${chrome_source}")\n    file(READ "${studio_source}" studio_text)\n    if(studio_text MATCHES "DECAL // NATIVE WICKED" OR\n       studio_text MATCHES "ENVIRONMENT PROBE // NATIVE WICKED")\n        foreach(token IN ITEMS\n            "DECAL // NATIVE WICKED"\n            "ENVIRONMENT PROBE // NATIVE WICKED"\n            "RefreshEnvironmentProbe")\n            string(FIND "${studio_text}" "${token}" found)\n            if(found EQUAL -1)\n                message(FATAL_ERROR "Gate 3 partial Studio integration missing ${token}")\n            endif()\n        endforeach()\n    endif()\nendif()\n',
              '''foreach(path IN ITEMS "${studio_source}" "${studio_header}" "${chrome_source}")
    if(NOT EXISTS "${path}")
        message(FATAL_ERROR "Gate 3 missing Studio source: ${path}")
    endif()
endforeach()
file(READ "${studio_source}" studio_text)
file(READ "${studio_header}" studio_header_text)
file(READ "${chrome_source}" chrome_text)
foreach(token IN ITEMS
    "DECAL // NATIVE WICKED"
    "ENVIRONMENT PROBE // NATIVE WICKED"
    "CreateDecalFromView"
    "CreateEnvironmentProbeFromView"
    "HandleDecalProbeSceneIcons"
    "RefreshEnvironmentProbe"
    "SetMaterialCommand")
    string(FIND "${studio_text}" "${token}" found)
