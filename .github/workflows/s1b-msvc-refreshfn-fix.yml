name: S1B MSVC RefreshFn fix

on:
  push:
    branches:
      - scripting/s1b-existing-inspector-migration
    paths:
      - .github/workflows/s1b-msvc-refreshfn-fix.yml

permissions:
  contents: write

jobs:
  patch-source:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: scripting/s1b-existing-inspector-migration
          fetch-depth: 0

      - name: Apply MSVC-safe callback typing
        shell: python
        run: |
          from pathlib import Path

          migration = Path("Studio/src/S1BInspectorSectionMigration.cpp")
          text = migration.read_text(encoding="utf-8")
          old = "            {},\n"
          new = "            CallbackInspectorSectionProvider::RefreshFn{},\n"
          count = text.count(old)
          if count != 3:
              raise SystemExit(f"Expected exactly 3 ambiguous RefreshFn arguments, found {count}")
          migration.write_text(text.replace(old, new), encoding="utf-8")

          contract = Path("Tests/S1BInspectorMigrationSourceContract.cmake")
          test = contract.read_text(encoding="utf-8")
          marker = '    "InspectObjectParticipation")'
          replacement = '    "InspectObjectParticipation"\n    "CallbackInspectorSectionProvider::RefreshFn{}")'
          if marker not in test:
              raise SystemExit("S1B source-contract insertion marker not found")
          contract.write_text(test.replace(marker, replacement, 1), encoding="utf-8")

      - name: Remove one-shot workflow
        run: git rm .github/workflows/s1b-msvc-refreshfn-fix.yml

      - name: Commit and push fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Studio/src/S1BInspectorSectionMigration.cpp Tests/S1BInspectorMigrationSourceContract.cmake
          git commit -m "S1B: fix MSVC provider callback construction"
          git push origin HEAD:scripting/s1b-existing-inspector-migration
