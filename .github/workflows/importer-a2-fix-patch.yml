name: Importer A2 scoped one-pass repair patch

on:
  push:
    branches:
      - feature/importer-a2-roundtrip-root-cause
    paths:
      - .github/workflows/importer-a2-fix-patch.yml

permissions:
  contents: write

jobs:
  patch:
    if: github.repository == 'mav3r1ckmediastudio-glitch/renegade-engine' && github.ref == 'refs/heads/feature/importer-a2-roundtrip-root-cause'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: true
      - name: Apply bounded patch, inspect scope, and remove temporary write workflow
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD:EngineBridge/src/ImportServiceModel.cpp)" = '10b41c78995be72e5693d719c788e215a485082f'
          test "$(git rev-parse HEAD:Tests/ReusableAssetGraphicsProof.cpp)" = '29c70c929b5f58c2dc971480fe382bf85138ae6d'
          python3 Tools/ImporterA2OnePassPatch.py
          git diff --check
          python3 - <<'PY'
          from pathlib import Path
          model=Path('EngineBridge/src/ImportServiceModel.cpp').read_text()
          proof=Path('Tests/ReusableAssetGraphicsProof.cpp').read_text()
          assert 'CanonicalizeWisceneSkinWeights' not in model
          assert 'PredictWickedReloadEvidence' in model
          assert 'A2 SINGLE-PASS SKIN ROUND-TRIP AND NONCONVERGENT CYCLE PASS' in proof
          print('A2 patch anchors and new public nonconvergence proof verified')
          PY
          git rm -- Tools/ImporterA2OnePassPatch.py .github/workflows/importer-a2-fix-patch.yml
          git add -- EngineBridge/src/ImportServiceModel.cpp Tests/ReusableAssetGraphicsProof.cpp
          test "$(git diff --cached --name-only | wc -l)" -eq 4
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Importer A2: predict one Wicked reload pass without fixed-point rejection'
          git push origin HEAD:feature/importer-a2-roundtrip-root-cause
