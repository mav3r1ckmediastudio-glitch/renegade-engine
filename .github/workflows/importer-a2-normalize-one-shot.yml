name: Apply A2 bounded skin-weight repair and public proof

on:
  push:
    branches:
      - feature/importer-a2-roundtrip-root-cause
    paths:
      - .github/workflows/importer-a2-normalize-one-shot.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout isolated A2 branch only
        uses: actions/checkout@v4
        with:
          ref: feature/importer-a2-roundtrip-root-cause
          persist-credentials: true
      - name: Exact-anchor patch and scope checks
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile Tools/ImporterA2NormalizePatch.py
          python3 Tools/ImporterA2NormalizePatch.py
          git diff --check
          python3 - <<'PY'
          import subprocess
          changed = set(subprocess.check_output(['git', 'diff', '--name-only'], text=True).splitlines())
          expected = {'EngineBridge/src/ImportServiceModel.cpp', 'Tests/ReusableAssetGraphicsProof.cpp'}
          assert changed == expected, f'Unexpected changed files: {changed}'
          model = open('EngineBridge/src/ImportServiceModel.cpp', encoding='utf-8').read()
          assert 'result.importedEvidence == result.reloadedEvidence' not in model or '!(result.importedEvidence == result.reloadedEvidence)' in model
          assert 'CanonicalizeWisceneSkinWeights(*prepared.scene_' in model
          assert 'Imported WISCENE rig/animation evidence changed after round-trip reload.' in model
          proof = open('Tests/ReusableAssetGraphicsProof.cpp', encoding='utf-8').read()
          assert 'RunSkinWeightNormalizationProof(projectRoot)' in proof
          print('A2 source anchors, strict validation, regression fixture and two-file scope confirmed')
          PY
      - name: Commit exactly two implementation and proof files
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- EngineBridge/src/ImportServiceModel.cpp Tests/ReusableAssetGraphicsProof.cpp
          git commit -m "Importer A2: canonicalize exact Wicked skin-weight fixed points and prove reload drift"
          git push origin HEAD:feature/importer-a2-roundtrip-root-cause
