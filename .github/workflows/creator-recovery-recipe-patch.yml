name: Apply creator recovery recipe patch
on:
  push:
    branches: [agent/creator-workflow-repair]
permissions:
  contents: write
jobs:
  apply:
    if: ${{ !contains(github.event.head_commit.message, '[creator-recipe-applied]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/creator-workflow-repair
          fetch-depth: 0
      - run: python .github/creator_recovery_recipe_patch.py
      - run: |
          git config user.name "renegade-recovery-bot"
          git config user.email "actions@users.noreply.github.com"
          git add EngineBridge/src/ImportServiceModel.cpp EngineBridge/src/CreatorAssetWorkflowService.cpp EngineBridge/src/ReusableAssetService.cpp EngineBridge/src/ReusableAssetReimportService.cpp
          git commit -m "Persist and replay creator model import recipes [creator-recipe-applied]"
          git push origin HEAD:agent/creator-workflow-repair
