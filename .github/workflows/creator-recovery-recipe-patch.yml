name: Apply creator preview material detection
on:
  push:
    branches: [agent/creator-workflow-repair]
permissions:
  contents: write
jobs:
  apply:
    if: ${{ !contains(github.event.head_commit.message, '[preview-detection-applied]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/creator-workflow-repair
          fetch-depth: 0
      - run: python .github/creator_preview_detection_patch.py
      - run: |
          git config user.name "renegade-recovery-bot"
          git config user.email "actions@users.noreply.github.com"
          rm -f .github/creator_preview_detection_patch.py .github/workflows/creator-recovery-recipe-patch.yml
          git add -A
          git commit -m "Show detected material sources in importer preview [preview-detection-applied]"
          git push origin HEAD:agent/creator-workflow-repair
