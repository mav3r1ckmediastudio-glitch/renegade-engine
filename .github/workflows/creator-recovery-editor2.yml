name: Creator recovery editor

on:
  push:
    branches:
      - agent/creator-workflow-repair

permissions:
  contents: write

jobs:
  apply:
    if: ${{ !contains(github.event.head_commit.message, '[creator-recovery-applied]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/creator-workflow-repair
          fetch-depth: 0
      - name: Apply source transformation
        run: python .github/creator_recovery_apply.py
      - name: Commit transformed source
        run: |
          git config user.name "renegade-recovery-bot"
          git config user.email "actions@users.noreply.github.com"
          git add Studio/src/StudioApplication.cpp
          git commit -m "Build preview-first model import workspace [creator-recovery-applied]"
          git push origin HEAD:agent/creator-workflow-repair
