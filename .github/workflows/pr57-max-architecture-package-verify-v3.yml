name: PR57 max architecture package recovery v3

on:
  push:
    branches:
      - scratch/pr57-max-architecture
    paths:
      - ".github/workflows/pr57-max-architecture-package-verify-v3.yml"

permissions:
  contents: write

jobs:
  recover-package:
    runs-on: windows-2025
    timeout-minutes: 90
    steps:
      - name: Check out scratch candidate and pinned Wicked
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Configure MSBuild
        uses: microsoft/setup-msbuild@v2
        with:
          msbuild-architecture: x64

      - name: Apply whitespace-robust atomic creator package recovery
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          @'
          from pathlib import Path

          workflow = Path('.github/workflows/pr57-max-architecture-package-verify.yml')
          text = workflow.read_text(encoding='utf-8')
          start_marker = '''      - name: Apply atomic creator package recovery
                  shell: pwsh
                  run: |
          '''
          end_marker = '''
                - name: Stage pinned LP07 FBX proof fixtures
          '''
          start = text.find(start_marker)
          if start < 0:
              raise RuntimeError('could not find original package-apply step')
          start += len(start_marker)
          end = text.find(end_marker, start)
          if end < 0:
              raise RuntimeError('could not find end of original package-apply step')
          block = text[start:end]
          script = '\n'.join(
              line[10:] if line.startswith('          ') else line
              for line in block.splitlines()
          ) + '\n'

          script = script.replace(
              '\n    "renegade-model-import-settings";',
              '\n        "renegade-model-import-settings";')

          old_helper = '''def replace_once(path, old, new):
              text = load(path)
              count = text.count(old)
              if count != 1:
                  raise RuntimeError(f'{path}: expected one replacement target, found {count}')
              save(path, text.replace(old, new, 1))
          '''
          new_helper = '''def replace_once(path, old, new):
              import re
              text = load(path)
              count = text.count(old)
              if count == 1:
                  save(path, text.replace(old, new, 1))
                  return
              if count > 1:
                  raise RuntimeError(f'{path}: exact replacement target is ambiguous ({count})')

              # Fallback only for leading indentation drift. Every nonblank
              # line's substantive text remains exact and in the same order.
              parts = old.split('\\n')
              pattern_parts = []
              for index, line in enumerate(parts):
                  if line.strip():
                      pattern_parts.append(r'^[ \\t]*' + re.escape(line.lstrip(' \\t')))
                  else:
                      pattern_parts.append(r'^[ \\t]*')
                  if index + 1 < len(parts):
                      pattern_parts.append(r'\\n')
              pattern = ''.join(pattern_parts)
              matches = list(re.finditer(pattern, text, flags=re.MULTILINE))
              if len(matches) != 1:
                  raise RuntimeError(
                      f'{path}: expected one whitespace-normalized replacement target, found {len(matches)}')
              match = matches[0]
              save(path, text[:match.start()] + new + text[match.end():])
          '''
          if old_helper not in script:
              raise RuntimeError('could not replace original exact-only helper')
          script = script.replace(old_helper, new_helper, 1)

          Path('.github/pr57-package-apply-v3.ps1').write_text(
              script, encoding='utf-8', newline='\n')
          '@ | Set-Content -LiteralPath '.github/extract-pr57-package-apply-v3.py' -Encoding UTF8
          python .github/extract-pr57-package-apply-v3.py
          if ($LASTEXITCODE -ne 0) { throw 'could not extract v3 package recovery script' }
          & ./.github/pr57-package-apply-v3.ps1
          if ($LASTEXITCODE -ne 0) { throw 'v3 atomic package recovery script failed' }
          Remove-Item -LiteralPath '.github/extract-pr57-package-apply-v3.py' -Force
          Remove-Item -LiteralPath '.github/pr57-package-apply-v3.ps1' -Force

          @'
          from pathlib import Path

          def replace_once(path, old, new):
              file = Path(path)
              text = file.read_text(encoding='utf-8')
              count = text.count(old)
              if count != 1:
                  raise RuntimeError(f'{path}: expected one hardening anchor, found {count}')
              file.write_text(text.replace(old, new, 1), encoding='utf-8', newline='\n')

          # StudioApplication.cpp is already near MSVC's COFF section limit.
          # The package call-site change legitimately tips it over in Debug,
          # so make the Studio target durable instead of avoiding the source.
          replace_once(
              'Studio/CMakeLists.txt',
              '''target_compile_options(RenegadeStudio
              PRIVATE
                  "$<$<CXX_COMPILER_ID:MSVC>:/utf-8>"
          )''',
              '''target_compile_options(RenegadeStudio
              PRIVATE
                  "$<$<CXX_COMPILER_ID:MSVC>:/utf-8>"
                  "$<$<CXX_COMPILER_ID:MSVC>:/bigobj>"
          )''')

          # Managed .rasset.json files are package projections, never browser
          # assets. Hide only that exact suffix so legitimate creator JSON data
          # elsewhere remains visible/unsupported rather than silently hidden.
          replace_once(
              'EngineBridge/src/AssetBrowserService.cpp',
              '''                constexpr const char* ThumbnailSuffix = ".thumbnail.png";
                  if (!directory &&
                      lowerFilename.size() >= std::char_traits<char>::length(ThumbnailSuffix) &&
                      lowerFilename.compare(
                          lowerFilename.size() - std::char_traits<char>::length(ThumbnailSuffix),
                          std::char_traits<char>::length(ThumbnailSuffix),
                          ThumbnailSuffix) == 0)
                  {
                      continue;
                  }

                  AssetEntry entry;''',
              '''                constexpr const char* ThumbnailSuffix = ".thumbnail.png";
                  if (!directory &&
                      lowerFilename.size() >= std::char_traits<char>::length(ThumbnailSuffix) &&
                      lowerFilename.compare(
                          lowerFilename.size() - std::char_traits<char>::length(ThumbnailSuffix),
                          std::char_traits<char>::length(ThumbnailSuffix),
                          ThumbnailSuffix) == 0)
                  {
                      continue;
                  }
                  constexpr const char* ManagedProjectionSuffix = ".rasset.json";
                  if (!directory &&
                      lowerFilename.size() >= std::char_traits<char>::length(ManagedProjectionSuffix) &&
                      lowerFilename.compare(
                          lowerFilename.size() - std::char_traits<char>::length(ManagedProjectionSuffix),
                          std::char_traits<char>::length(ManagedProjectionSuffix),
                          ManagedProjectionSuffix) == 0)
                  {
                      continue;
                  }

                  AssetEntry entry;''')

          # Defence in depth for catalogue paths: projection files are internal
          # metadata even if another filesystem snapshot source is introduced.
          replace_once(
              'EngineBridge/src/AssetCatalogueService.cpp',
              '''        bool IsInternalMetadataPath(const std::string& projectRelativePath)
              {
                  const std::string extension = LowerAscii(
                      fs::u8path(projectRelativePath).extension().u8string());
                  return extension == ".rmeta";
              }''',
              '''        bool IsInternalMetadataPath(const std::string& projectRelativePath)
              {
                  const std::string lowerPath = LowerAscii(projectRelativePath);
                  const std::string extension = LowerAscii(
                      fs::u8path(projectRelativePath).extension().u8string());
                  constexpr const char* ManagedProjectionSuffix = ".rasset.json";
                  return extension == ".rmeta" ||
                      (lowerPath.size() >= std::char_traits<char>::length(ManagedProjectionSuffix) &&
                       lowerPath.compare(
                           lowerPath.size() - std::char_traits<char>::length(ManagedProjectionSuffix),
                           std::char_traits<char>::length(ManagedProjectionSuffix),
                           ManagedProjectionSuffix) == 0);
              }''')

          replace_once(
              'Tests/AssetBrowserTests.cpp',
              '''    Touch(root / "Content/Models/Props/Hero.rasset");
              Touch(root / "Content/Models/Props/Hero.thumbnail.png");''',
              '''    Touch(root / "Content/Models/Props/Hero.rasset");
              Touch(root / "Content/Models/Props/Hero.rasset.json");
              Touch(root / "Content/Models/Props/Hero.thumbnail.png");''')
          replace_once(
              'Tests/AssetBrowserTests.cpp',
              '''    if (FindAsset(crateFolder, "Hero.thumbnail.png") != nullptr)
              {
                  return Fail(root, "governed asset thumbnail sidecar leaked into asset cards");
              }

              const auto unsafe = browser.Scan(''',
              '''    if (FindAsset(crateFolder, "Hero.thumbnail.png") != nullptr)
              {
                  return Fail(root, "governed asset thumbnail sidecar leaked into asset cards");
              }
              if (FindAsset(crateFolder, "Hero.rasset.json") != nullptr)
              {
                  return Fail(root, "managed .rasset projection leaked into asset cards");
              }

              const auto unsafe = browser.Scan(''')
          '@ | Set-Content -LiteralPath '.github/pr57-package-hardening.py' -Encoding UTF8
          python .github/pr57-package-hardening.py
          if ($LASTEXITCODE -ne 0) { throw 'package hardening patch failed' }
          Remove-Item -LiteralPath '.github/pr57-package-hardening.py' -Force

          git diff --check
          if ($LASTEXITCODE -ne 0) { throw 'git diff --check failed after package recovery patch' }
          git status --short

      - name: Stage pinned LP07 FBX proof fixtures
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $fixtureRoot = 'Tests/Fixtures/LP07'
          New-Item -ItemType Directory -Force -Path $fixtureRoot | Out-Null
          $upstreamCommit = 'fcc5d6ba444cfd3eb80677dba5e37e493941abe5'
          $fixtures = @(
            @{ Name = 'maya_cube_6100_ascii.fbx'; Blob = 'b0aa64ea2361060b4f9bc4cd4e7bd0f730b6f7d8' },
            @{ Name = 'maya_transformed_skin_7700_ascii.fbx'; Blob = '683b74cf082e5adab645082c73dd221e0ff7f281' }
          )
          foreach ($fixture in $fixtures) {
            $path = Join-Path $fixtureRoot $fixture.Name
            $uri = "https://raw.githubusercontent.com/ufbx/ufbx/$upstreamCommit/data/$($fixture.Name)"
            Invoke-WebRequest -Uri $uri -OutFile $path
            $actualBlob = (& git.exe hash-object -- $path).Trim()
            if ($LASTEXITCODE -ne 0 -or $actualBlob -ne $fixture.Blob) {
              throw "LP07 fixture integrity failure for $($fixture.Name)"
            }
          }

      - name: Build and test Debug plus Release candidate
        shell: pwsh
        run: >-
          ./Tools/Build-Studio-Windows.ps1
          -Configuration Debug,Release
          -Clean
          -ArtifactRoot "artifacts/studio/pr57-max-package-recovery"

      - name: Release Studio startup smoke
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $studio = 'BUILD/renegade/Studio/Release/RenegadeStudio.exe'
          if (-not (Test-Path -LiteralPath $studio -PathType Leaf)) {
            throw "Cannot find verified Release Studio at $studio"
          }
          $process = Start-Process -FilePath $studio -ArgumentList 'startup-smoke' -Wait -PassThru
          if ($process.ExitCode -ne 0) {
            throw "Release startup smoke failed with exit code $($process.ExitCode)."
          }
          Write-Host 'PR57_MAX_PACKAGE_RELEASE_STARTUP_PASS'

      - name: Commit only verified package recovery source
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Remove-Item -LiteralPath '.github/workflows/pr57-max-architecture-package-verify.yml' -Force
          Remove-Item -LiteralPath '.github/workflows/pr57-max-architecture-package-verify-v2.yml' -Force
          Remove-Item -LiteralPath '.github/workflows/pr57-max-architecture-package-verify-v3.yml' -Force
          $paths = @(
            'EngineBridge/include/renegade/bridge/ReusableAssetService.h',
            'EngineBridge/src/ReusableAssetService.cpp',
            'EngineBridge/src/ReusableAssetReimportService.cpp',
            'EngineBridge/include/renegade/bridge/CreatorAssetWorkflowService.h',
            'EngineBridge/src/CreatorAssetWorkflowService.cpp',
            'EngineBridge/src/AssetBrowserService.cpp',
            'EngineBridge/src/AssetCatalogueService.cpp',
            'Studio/CMakeLists.txt',
            'Studio/src/StudioApplication.cpp',
            'Tests/AssetBrowserTests.cpp',
            'Tests/ReusableAssetTests.cpp',
            'Tests/ReusableAssetGraphicsProof.cpp',
            'Tests/ReusableAssetReimportGraphicsProof.cpp',
            '.github/workflows/pr57-max-architecture-package-verify.yml',
            '.github/workflows/pr57-max-architecture-package-verify-v2.yml',
            '.github/workflows/pr57-max-architecture-package-verify-v3.yml'
          )
          git add -- $paths
          git diff --cached --check
          if ($LASTEXITCODE -ne 0) { throw 'staged package recovery diff check failed' }
          $allowed = [System.Collections.Generic.HashSet[string]]::new(
            [string[]]$paths,
            [System.StringComparer]::Ordinal)
          $unexpected = git diff --cached --name-only | Where-Object {
            -not $allowed.Contains($_)
          }
          if ($unexpected) { throw "Unexpected staged paths: $($unexpected -join ', ')" }
          git config user.name 'mav3r1ckmediastudio-glitch'
          git config user.email 'mav3r1ckmediastudio@gmail.com'
          git commit -m 'feat(assets): make creator package writes atomic'
          if ($LASTEXITCODE -ne 0) { throw 'verified package recovery commit failed' }
          git push origin HEAD:scratch/pr57-max-architecture
          if ($LASTEXITCODE -ne 0) { throw 'verified package recovery push failed' }
