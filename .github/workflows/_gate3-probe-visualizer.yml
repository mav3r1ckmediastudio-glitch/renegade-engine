name: Gate 3 probe visualizer staging

on:
  push:
    branches:
      - phase5/scene-render-gate3-decals-probes
    paths:
      - .github/workflows/_gate3-probe-visualizer.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply bounded production patch
        run: python3 scripts/_gate3_probe_visualizer_patch.py
      - name: Remove staging helpers
        run: |
          rm scripts/_gate3_probe_visualizer_patch.py
          rm .github/workflows/_gate3-probe-visualizer.yml
      - name: Validate diff
        run: git diff --check
      - name: Run Gate 3 source contract
        run: cmake -DRENEGADE_SOURCE_DIR="$GITHUB_WORKSPACE" -P Tests/Phase5Gate3SourceContract.cmake
      - name: Commit clean production tree
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Studio/src/StudioApplication.cpp Tests/Phase5Gate3SourceContract.cmake scripts/_gate3_probe_visualizer_patch.py .github/workflows/_gate3-probe-visualizer.yml
          git commit -m "Phase 5 Gate 3: show native probe cubemap visualizer"
          git push origin HEAD:phase5/scene-render-gate3-decals-probes
