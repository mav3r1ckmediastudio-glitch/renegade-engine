              r'        if \(!bridge::ResolveScreenWidgetRect\(.*?\n        \}\n'
              r'        nameInput_\.SetValue', re.S)
          text, count = refresh_pattern.subn('        nameInput_.SetValue', text, count=1)
          if count != 1:
