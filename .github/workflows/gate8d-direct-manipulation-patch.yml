          old_outline = '''                Outline(selected->x - 2.0f, selected->y - 2.0f,\n                    selected->width + 4.0f, selected->height + 4.0f,\n                    Cyan, 2.0f, cmd);\n'''
          new_outline = '''                Outline(selected->x - 2.0f, selected->y - 2.0f,\n                    selected->width + 4.0f, selected->height + 4.0f,\n                    Cyan, 2.0f, cmd);\n                const float half = ResizeHandleSize * 0.5f;\n                const float corners[][2] = {\n                    {selected->x, selected->y},\n                    {selected->x + selected->width, selected->y},\n                    {selected->x, selected->y + selected->height},\n                    {selected->x + selected->width,\n                        selected->y + selected->height},\n                };\n                for (const auto& corner : corners)\n                {\n                    Rect(corner[0] - half, corner[1] - half,\n                        ResizeHandleSize, ResizeHandleSize, Cyan, cmd);\n                    Outline(corner[0] - half, corner[1] - half,\n                        ResizeHandleSize, ResizeHandleSize,\n                        Text, 1.0f, cmd);\n                }\n'''
          text = replace_once(text, old_outline, new_outline, 'render resize handles')
