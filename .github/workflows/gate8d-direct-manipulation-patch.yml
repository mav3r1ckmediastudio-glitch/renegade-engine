          text=once(text,'        std::size_t hierarchyScroll_ = 0;\n        bool inspectorSuppressed_ = false;\n','        std::size_t hierarchyScroll_ = 0;\n        bool inspectorSuppressed_ = false;\n        DirectManipulationMode directManipulationMode_ = DirectManipulationMode::None;\n        XMFLOAT2 directManipulationStartPointer_ = {};\n        bridge::ScreenRect directManipulationStartRect_;\n        float directManipulationScaleX_ = 1.0f;\n        float directManipulationScaleY_ = 1.0f;\n        bool directManipulationChanged_ = false;\n','direct state')
          for t in ('xInput_','yInput_','widthInput_','heightInput_'): text=re.sub(r'        RenegadeTextInputField '+t+r';\n','',text)
          write(path,text)

          path='Studio/src/RenegadeScreenEditorWorkspace.cpp'; text=read(path)
          text=text.replace('#include <iomanip>\n','').replace('#include <sstream>\n','')
          text=text.replace('    constexpr float HierarchyRowsTop = HeaderHeight + 160.0f;\n','    constexpr float HierarchyRowsTop = HeaderHeight + 160.0f;\n    constexpr float ResizeHandleSize = 12.0f;\n',1)
          text=re.sub(r'\n    std::string Number\(const float value\)\n    \{.*?\n    \}\n\n    bool ParseNumber\(const std::string& value, float& result\)\n    \{.*?\n    \}\n','\n',text,count=1,flags=re.S)
          for line in ('        configureInput(xInput_, "Screen Element X", "X");\n','        configureInput(yInput_, "Screen Element Y", "Y");\n','        configureInput(widthInput_, "Screen Element Width", "Width");\n','        configureInput(heightInput_, "Screen Element Height", "Height");\n'): text=text.replace(line,'')
          text=re.sub(r'        heightInput_\.OnInputAccepted\(.*?        \}\);\n','',text,count=1,flags=re.S)
          for t in ('xInput_','yInput_','widthInput_','heightInput_'): text=re.sub(r'\s*static_cast<(?:const )?wi::gui::Widget\*>\(&'+t+r'\),?\n','\n',text)
          text,n=re.subn(r'        field\(nameInput_\);\n        field\(textInput_\);\n\n        xInput_\.SetPos.*?        visibleButton_\.SetPos\(XMFLOAT2\(inspectorX, y\)\);\n','        field(nameInput_);\n        field(textInput_);\n\n        // Geometry is authored directly in the Runtime preview.\n        y += 8.0f;\n        visibleButton_.SetPos(XMFLOAT2(inspectorX, y));\n',text,count=1,flags=re.S)
          if n!=1: raise SystemExit(f'numeric layout: found {n}')
          text=re.sub(r'        bridge::ScreenRect rect;\n        std::string error;\n        if \(!bridge::ResolveScreenWidgetRect\(.*?\n        \}\n        nameInput_\.SetValue','        nameInput_.SetValue',text,count=1,flags=re.S)
          for line in ('        xInput_.SetValue(Number(rect.x));\n','        yInput_.SetValue(Number(rect.y));\n','        widthInput_.SetValue(Number(rect.width));\n','        heightInput_.SetValue(Number(rect.height));\n'): text=text.replace(line,'')
          text,n=re.subn(r'        if \(!ParseNumber\(xInput_\.GetValue\(\), edit\.resolvedRect\.x\).*?        std::string error;\n','        std::string error;\n        if (!bridge::ResolveScreenWidgetRect(session_->Document(), selectedWidgetId_, edit.resolvedRect, error))\n        {\n            SetStatus("EDIT REJECTED // " + error);\n            RefreshInspector();\n            return;\n        }\n\n',text,count=1,flags=re.S)
          if n!=1: raise SystemExit(f'basic apply: found {n}')
          text,n=re.subn(r'                Label\("POSITION  X / Y".*?                    inspectorX, HeaderHeight \+ 410\.0f, 9, Muted, cmd\);\n','                Label("DRAG ELEMENT IN PREVIEW TO MOVE", inspectorX, HeaderHeight + 190.0f, 9, Muted, cmd);\n                Label("DRAG CORNER HANDLES TO RESIZE", inspectorX, HeaderHeight + 208.0f, 9, Muted, cmd);\n                Label(widget->layoutMode == bridge::ScreenLayoutMode::Anchored ? "LAYOUT // ANCHORED" : "LAYOUT // ABSOLUTE", inspectorX, HeaderHeight + 238.0f, 9, Muted, cmd);\n',text,count=1,flags=re.S)
