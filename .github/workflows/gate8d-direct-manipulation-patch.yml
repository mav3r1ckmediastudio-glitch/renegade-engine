              text=re.sub(r'\s*static_cast<wi::gui::Widget\*>\(&'+t+r'\),?\n','\n',text)
          text=re.sub(r'            heightInput_\.OnInputAccepted\(.*?            \}\);\n','',text,count=1,flags=re.S)
