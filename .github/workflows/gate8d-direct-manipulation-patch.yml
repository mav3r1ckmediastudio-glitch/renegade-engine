          for line in (
              '        xInput_.SetValue(Number(rect.x));\n',
              '        yInput_.SetValue(Number(rect.y));\n',
              '        widthInput_.SetValue(Number(rect.width));\n',
              '        heightInput_.SetValue(Number(rect.height));\n'):
              text = text.replace(line, '')

          apply_pattern = re.compile(
              r'        if \(!ParseNumber\(xInput_\.GetValue\(\), edit\.resolvedRect\.x\).*?'
              r'        std::string error;\n', re.S)
          apply_replacement = '''        std::string error;
        if (!bridge::ResolveScreenWidgetRect(
