'''
          text, count = apply_pattern.subn(apply_replacement, text, count=1)
          if count != 1:
              raise SystemExit(f'basic apply geometry preservation: found {count}')

          labels_pattern = re.compile(
              r'                Label\("POSITION  X / Y".*?'
              r'                    inspectorX, HeaderHeight \+ 410\.0f, 9, Muted, cmd\);\n',
