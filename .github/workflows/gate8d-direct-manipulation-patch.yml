          proof = r'''    // Direct manipulation emits many live geometry snapshots but one
    // pointer gesture is one Undo boundary.
    ScreenRect beforeDirectEdit;
    if (!ResolveScreenWidgetRect(
            authored.Document(), creatorTextId, beforeDirectEdit, error))
        return Fail("could not resolve direct-edit fixture: " + error);
    const std::size_t undoBeforeDirectEdit = authored.UndoCount();
    const auto* directWidget = authored.FindWidget(creatorTextId);
    if (!directWidget) return Fail("direct-edit fixture widget is missing");
    authored.BeginCoalescedEdit();
    ScreenWidgetAuthoringEdit directEdit{
        directWidget->name, directWidget->text,
        {beforeDirectEdit.x + 20.0f, beforeDirectEdit.y + 10.0f,
         beforeDirectEdit.width + 30.0f, beforeDirectEdit.height + 15.0f},
        directWidget->visible, directWidget->enabled};
    if (!authored.UpdateWidget(creatorTextId, directEdit, error))
        return Fail("first direct geometry frame failed: " + error);
    directEdit.resolvedRect.x += 25.0f;
    directEdit.resolvedRect.width += 10.0f;
    if (!authored.UpdateWidget(creatorTextId, directEdit, error))
        return Fail("second direct geometry frame failed: " + error);
    authored.EndCoalescedEdit();
    if (authored.UndoCount() != undoBeforeDirectEdit + 1)
        return Fail("one direct manipulation gesture created multiple Undo entries");
    ScreenRect afterDirectEdit;
    if (!ResolveScreenWidgetRect(
            authored.Document(), creatorTextId, afterDirectEdit, error) ||
        afterDirectEdit.x != directEdit.resolvedRect.x ||
        afterDirectEdit.width != directEdit.resolvedRect.width)
        return Fail("direct manipulation did not preserve final geometry");
    if (!authored.Undo(error))
        return Fail("direct manipulation Undo failed: " + error);
    ScreenRect undoneDirectEdit;
    if (!ResolveScreenWidgetRect(
            authored.Document(), creatorTextId, undoneDirectEdit, error) ||
        !SameRect(beforeDirectEdit, undoneDirectEdit))
        return Fail("direct manipulation Undo did not restore pre-drag geometry");
    if (!authored.Redo(error))
        return Fail("direct manipulation Redo failed: " + error);

'''
          text = once(text, anchor, anchor + proof, 'direct manipulation regression proof')
