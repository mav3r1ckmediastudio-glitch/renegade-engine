          labels_replacement = '''                Label("DRAG ELEMENT IN PREVIEW TO MOVE", inspectorX,
                    HeaderHeight + 190.0f, 9, Muted, cmd);
                Label("DRAG CORNER HANDLES TO RESIZE", inspectorX,
                    HeaderHeight + 208.0f, 9, Muted, cmd);
                Label(widget->layoutMode == bridge::ScreenLayoutMode::Anchored
                        ? "LAYOUT // ANCHORED"
                        : "LAYOUT // ABSOLUTE",
                    inspectorX, HeaderHeight + 238.0f, 9, Muted, cmd);
'''
          text, count = labels_pattern.subn(labels_replacement, text, count=1)
          if count != 1:
              raise SystemExit(f'creator geometry labels: found {count}')

          marker = '''    void RenegadeScreenEditorWorkspace::SetStatus(std::string status)
    {
        status_ = std::move(status);
    }

'''
          direct = r'''    RenegadeScreenEditorWorkspace::DirectManipulationMode
    RenegadeScreenEditorWorkspace::HitResizeHandle(
        const XMFLOAT4& pointer) const noexcept
    {
        if (!renderer_ || selectedWidgetId_.empty())
            return DirectManipulationMode::None;
        const auto* rect = renderer_->LogicalRect(selectedWidgetId_);
        if (!rect) return DirectManipulationMode::None;
        const float half = ResizeHandleSize * 0.5f;
        const auto hit = [&pointer, half](const float x, const float y)
        {
            return pointer.x >= x - half && pointer.x <= x + half &&
                pointer.y >= y - half && pointer.y <= y + half;
        };
        if (hit(rect->x, rect->y)) return DirectManipulationMode::ResizeTopLeft;
        if (hit(rect->x + rect->width, rect->y))
            return DirectManipulationMode::ResizeTopRight;
        if (hit(rect->x, rect->y + rect->height))
            return DirectManipulationMode::ResizeBottomLeft;
        if (hit(rect->x + rect->width, rect->y + rect->height))
            return DirectManipulationMode::ResizeBottomRight;
        return DirectManipulationMode::None;
    }

    void RenegadeScreenEditorWorkspace::BeginDirectManipulation(
        const DirectManipulationMode mode,
        const XMFLOAT4& pointer)
    {
        if (!session_ || !renderer_ || selectedWidgetId_.empty() ||
            mode == DirectManipulationMode::None) return;
        const auto* logical = renderer_->LogicalRect(selectedWidgetId_);
        bridge::ScreenRect resolved;
        std::string error;
        if (!logical || !bridge::ResolveScreenWidgetRect(
                session_->Document(), selectedWidgetId_, resolved, error) ||
            resolved.width <= 0.0f || resolved.height <= 0.0f ||
            logical->width <= 0.0f || logical->height <= 0.0f)
        {
            SetStatus("DIRECT EDIT REJECTED // COULD NOT RESOLVE ELEMENT GEOMETRY");
            return;
        }
        directManipulationMode_ = mode;
        directManipulationStartPointer_ = {pointer.x, pointer.y};
        directManipulationStartRect_ = resolved;
        directManipulationScaleX_ = logical->width / resolved.width;
        directManipulationScaleY_ = logical->height / resolved.height;
        directManipulationChanged_ = false;
        session_->BeginCoalescedEdit();
        SetStatus(mode == DirectManipulationMode::Move
            ? "DRAGGING ELEMENT // RELEASE TO FINISH"
            : "RESIZING ELEMENT // RELEASE TO FINISH");
    }

    void RenegadeScreenEditorWorkspace::UpdateDirectManipulation(
        const XMFLOAT4& pointer)
    {
        if (!session_ || directManipulationMode_ == DirectManipulationMode::None ||
            directManipulationScaleX_ <= 0.0f || directManipulationScaleY_ <= 0.0f)
            return;
        const auto* widget = session_->FindWidget(selectedWidgetId_);
        if (!widget) { EndDirectManipulation(); return; }

        const float dx = (pointer.x - directManipulationStartPointer_.x) /
            directManipulationScaleX_;
        const float dy = (pointer.y - directManipulationStartPointer_.y) /
            directManipulationScaleY_;
        bridge::ScreenRect next = directManipulationStartRect_;
        const float canvasWidth = session_->Document().designWidth;
        const float canvasHeight = session_->Document().designHeight;
        constexpr float minimumSize = 8.0f;

        switch (directManipulationMode_)
        {
        case DirectManipulationMode::Move:
            next.x = std::clamp(directManipulationStartRect_.x + dx, 0.0f,
                std::max(0.0f, canvasWidth - directManipulationStartRect_.width));
            next.y = std::clamp(directManipulationStartRect_.y + dy, 0.0f,
                std::max(0.0f, canvasHeight - directManipulationStartRect_.height));
            break;
        case DirectManipulationMode::ResizeTopLeft:
        {
            const float right = directManipulationStartRect_.x + directManipulationStartRect_.width;
            const float bottom = directManipulationStartRect_.y + directManipulationStartRect_.height;
            next.x = std::clamp(directManipulationStartRect_.x + dx, 0.0f, right - minimumSize);
            next.y = std::clamp(directManipulationStartRect_.y + dy, 0.0f, bottom - minimumSize);
            next.width = right - next.x;
            next.height = bottom - next.y;
            break;
        }
        case DirectManipulationMode::ResizeTopRight:
        {
            const float bottom = directManipulationStartRect_.y + directManipulationStartRect_.height;
            const float right = std::clamp(
                directManipulationStartRect_.x + directManipulationStartRect_.width + dx,
                directManipulationStartRect_.x + minimumSize, canvasWidth);
            next.y = std::clamp(directManipulationStartRect_.y + dy, 0.0f, bottom - minimumSize);
            next.width = right - directManipulationStartRect_.x;
            next.height = bottom - next.y;
            break;
        }
        case DirectManipulationMode::ResizeBottomLeft:
        {
            const float right = directManipulationStartRect_.x + directManipulationStartRect_.width;
            const float bottom = std::clamp(
                directManipulationStartRect_.y + directManipulationStartRect_.height + dy,
                directManipulationStartRect_.y + minimumSize, canvasHeight);
            next.x = std::clamp(directManipulationStartRect_.x + dx, 0.0f, right - minimumSize);
            next.width = right - next.x;
            next.height = bottom - directManipulationStartRect_.y;
            break;
        }
        case DirectManipulationMode::ResizeBottomRight:
        {
            const float right = std::clamp(
                directManipulationStartRect_.x + directManipulationStartRect_.width + dx,
                directManipulationStartRect_.x + minimumSize, canvasWidth);
            const float bottom = std::clamp(
                directManipulationStartRect_.y + directManipulationStartRect_.height + dy,
                directManipulationStartRect_.y + minimumSize, canvasHeight);
            next.width = right - directManipulationStartRect_.x;
            next.height = bottom - directManipulationStartRect_.y;
            break;
        }
        case DirectManipulationMode::None:
            return;
        }

        bridge::ScreenWidgetAuthoringEdit edit{
            widget->name, widget->text, next, widget->visible, widget->enabled};
        std::string error;
        if (!session_->UpdateWidget(selectedWidgetId_, std::move(edit), error))
        {
            SetStatus("DIRECT EDIT REJECTED // " + error);
            return;
        }
        directManipulationChanged_ = true;
        RefreshInspector();
        if (documentChanged_) documentChanged_();
    }

    void RenegadeScreenEditorWorkspace::EndDirectManipulation()
    {
        if (session_) session_->EndCoalescedEdit();
        if (directManipulationMode_ != DirectManipulationMode::None)
            SetStatus(directManipulationChanged_
                ? "DIRECT GEOMETRY UPDATED // UNSAVED SCREEN CHANGE"
                : "ELEMENT SELECTED // DRAG TO MOVE OR RESIZE");
        directManipulationMode_ = DirectManipulationMode::None;
        directManipulationChanged_ = false;
    }

'''
          text = once(text, marker, marker + direct, 'direct implementation insertion')

          update_pattern = re.compile(
              r'    void RenegadeScreenEditorWorkspace::Update\(\n.*?\n    \}\n\n'
              r'    void RenegadeScreenEditorWorkspace::Render\(', re.S)
          new_update = r'''    void RenegadeScreenEditorWorkspace::Update(
        const wi::Canvas& canvas,
        const float dt)
    {
        Widget::Update(canvas, dt);
        UpdateControls(canvas, dt);
        if (!IsVisible() || !IsEnabled() || !session_ ||
            !session_->IsLoaded()) return;

        const XMFLOAT4 pointer = wi::input::GetPointer();
        if (directManipulationMode_ != DirectManipulationMode::None)
        {
            if (wi::input::Down(wi::input::MOUSE_BUTTON_LEFT))
                UpdateDirectManipulation(pointer);
            else
                EndDirectManipulation();
            return;
        }

        const float rowTop = HierarchyRowsTop;
        const std::size_t visibleRows = static_cast<std::size_t>(std::max(
            1.0f, std::floor((height_ - rowTop - FooterHeight) /
                HierarchyRowHeight)));
        const auto& widgets = session_->Document().widgets;
        if (pointer.x < HierarchyWidth && pointer.y >= HeaderHeight &&
            pointer.y < height_ - FooterHeight)
        {
            if (pointer.z != 0.0f && widgets.size() > visibleRows)
            {
                if (pointer.z < 0.0f)
                    hierarchyScroll_ = std::min(
                        hierarchyScroll_ + 1, widgets.size() - visibleRows);
                else if (hierarchyScroll_ > 0) --hierarchyScroll_;
            }
            if (wi::input::Press(wi::input::MOUSE_BUTTON_LEFT) && pointer.y >= rowTop)
            {
                const std::size_t row = static_cast<std::size_t>(
                    (pointer.y - rowTop) / HierarchyRowHeight);
                const std::size_t index = hierarchyScroll_ + row;
                if (row < visibleRows && index < widgets.size())
                    SelectWidget(widgets[index].id);
            }
            return;
        }

        const auto preview = PreviewBounds();
        if (!Contains(preview, pointer) || !renderer_ ||
            !wi::input::Press(wi::input::MOUSE_BUTTON_LEFT)) return;

        const auto handle = HitResizeHandle(pointer);
        if (handle != DirectManipulationMode::None)
        {
            BeginDirectManipulation(handle, pointer);
            return;
        }
        for (auto iterator = widgets.rbegin(); iterator != widgets.rend(); ++iterator)
        {
            const auto* bounds = renderer_->LogicalRect(iterator->id);
            if (bounds && Contains(*bounds, pointer))
            {
                SelectWidget(iterator->id);
                BeginDirectManipulation(DirectManipulationMode::Move, pointer);
                return;
            }
        }
    }

