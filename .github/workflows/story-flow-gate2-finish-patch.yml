name: Story Flow Gate 2 finish patch

on:
  push:
    branches:
      - agent/story-flow-gate2-screen-semantics
    paths:
      - ".github/workflows/story-flow-gate2-finish-patch.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/story-flow-gate2-screen-semantics
          fetch-depth: 0

      - name: Apply bounded Gate 2 source/test patches
        shell: python
        run: |
          from pathlib import Path

          workspace = Path("Studio/src/RenegadeStoryFlowWorkspace.cpp")
          text = workspace.read_text(encoding="utf-8")
          old = '''        case FlowNodeKind::GameStart: return "GAME START";
                  case FlowNodeKind::Level: return "LEVEL";
                  case FlowNodeKind::CompleteGame: return "COMPLETE GAME";
          '''
          new = '''        case FlowNodeKind::GameStart: return "GAME START";
                  case FlowNodeKind::Level: return "LEVEL";
                  case FlowNodeKind::Screen: return "SCREEN";
                  case FlowNodeKind::CompleteGame: return "COMPLETE GAME";
          '''
          if text.count(old) != 1:
              raise SystemExit("Story Flow workspace kind-label block not found exactly once")
          workspace.write_text(text.replace(old, new), encoding="utf-8")

          test = Path("Tests/StoryFlowScreenSemanticsTests.cpp")
          text = test.read_text(encoding="utf-8")
          anchor = '''    FlowInterpreter interpreter;
          '''
          insertion = '''    DependencyNode flowDependencyNode;
              flowDependencyNode.id = "flow-root";
              flowDependencyNode.projectRelativePath = "Content/Flow/Main.renegade-flow";
              flowDependencyNode.dependencyClass = DependencyClass::StoryFlowDocument;
              StoryFlowDependencyProvider dependencyProvider(dependencyReader);
              std::vector<DependencyCandidate> emittedDependencies;
              DependencyProviderContext dependencyContext;
              dependencyContext.projectRoot = root.generic_u8string();
              dependencyContext.source = &flowDependencyNode;
              if (!dependencyProvider.Discover(
                      dependencyContext,
                      [&](const DependencyCandidate& candidate)
                      {
                          emittedDependencies.push_back(candidate);
                      },
                      [](const DependencyProviderDiagnostic&) {},
                      error))
              {
                  return Fail(temporary.path,
                      "Story Flow dependency provider rejected the Gate 2 Flow");
              }
              std::size_t sceneDependencyCount = 0;
              std::size_t screenDependencyCount = 0;
              for (const auto& dependency : emittedDependencies)
              {
                  if (dependency.dependencyClass == DependencyClass::Scene)
                      ++sceneDependencyCount;
                  if (dependency.dependencyClass == DependencyClass::RuntimeScreenDocument)
                      ++screenDependencyCount;
              }
              if (sceneDependencyCount != 1 || screenDependencyCount != 2)
              {
                  return Fail(temporary.path,
                      "Story Flow provider did not type Level and Screen dependencies correctly");
              }

              FlowInterpreter interpreter;
          '''
          if text.count(anchor) != 1:
              raise SystemExit("Gate 2 test insertion anchor not found exactly once")
          test.write_text(text.replace(anchor, insertion), encoding="utf-8")

          Path(".github/workflows/story-flow-gate2-finish-patch.yml").unlink()

      - name: Commit bounded patch
        shell: bash
        run: |
          git config user.name "renegade-ci"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "story-flow: complete Screen presentation and dependency proof"
          git push origin HEAD:agent/story-flow-gate2-screen-semantics
