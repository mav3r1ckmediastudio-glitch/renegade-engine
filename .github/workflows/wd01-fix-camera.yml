name: WD01 camera compile repair

on:
  push:
    branches:
      - wd01/grass-vegetation-painting

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: wd01/grass-vegetation-painting
          fetch-depth: 0
      - name: Repair camera access
        shell: python
        run: |
          from pathlib import Path
          path = Path('Studio/src/WD01Vegetation.cpp')
          text = path.read_text(encoding='utf-8')
          old = '''        auto* camera = GetCamera();\n        if (camera == nullptr)\n            return false;\n'''
          new = '''        if (camera == nullptr)\n            return false;\n'''
          if old not in text:
              raise SystemExit('Expected WD01 GetCamera seam not found')
          text = text.replace(old, new, 1)
          path.write_text(text, encoding='utf-8')
          Path('.github/workflows/wd01-fix-camera.yml').unlink()
      - name: Commit repair
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Studio/src/WD01Vegetation.cpp .github/workflows/wd01-fix-camera.yml
          git commit -m "WD01: use StudioRenderPath camera member"
          git push origin HEAD:wd01/grass-vegetation-painting
