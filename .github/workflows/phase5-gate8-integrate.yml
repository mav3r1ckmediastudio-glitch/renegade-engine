name: Phase 5 Gate 8 Integrate

on:
  push:
    branches:
      - phase5/scene-render-gate8-lightmap-baking
    paths:
      - ".github/workflows/phase5-gate8-integrate.yml"

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: false

      - name: Verify Gate 7 base
        shell: bash
        run: |
          git fetch origin main
          base="$(git merge-base HEAD origin/main)"
          test "$base" = "4a89c05475eadb8bc060f50816b3ca7d766cce74" || {
            echo "Gate 8 integration refused: expected Gate 7 base 4a89c05475eadb8bc060f50816b3ca7d766cce74, got $base"
            exit 1
          }

      - name: Apply guarded Gate 8 integration
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(relative, old, new):
              path = Path(relative)
              text = path.read_text(encoding="utf-8")
              count = text.count(old)
              if count != 1:
                  raise SystemExit(
                      f"Gate 8 integration refused: {relative} expected exactly one anchor, found {count}: {old[:120]!r}"
                  )
              path.write_text(text.replace(old, new, 1), encoding="utf-8")

          replace_once(
              "CMakeLists.txt",
              "add_subdirectory(WickedEngine)\nadd_subdirectory(EngineBridge)\ninclude(EngineBridge/JP01PhysicsLua.cmake)\ninclude(EngineBridge/Phase5Gate5.cmake)\n",
              "add_subdirectory(WickedEngine)\nadd_subdirectory(EngineBridge)\ninclude(EngineBridge/JP01PhysicsLua.cmake)\ninclude(EngineBridge/Phase5Gate5.cmake)\ninclude(EngineBridge/Phase5Gate8.cmake)\n",
          )
          replace_once(
              "CMakeLists.txt",
              "    add_subdirectory(ScreenRenderer)\n    add_subdirectory(Studio)\n    add_subdirectory(Runtime)\n",
              "    add_subdirectory(ScreenRenderer)\n    add_subdirectory(Studio)\n    include(Studio/Phase5Gate8.cmake)\n    add_subdirectory(Runtime)\n",
          )
          replace_once(
              "CMakeLists.txt",
              "    include(Tests/Phase5Gate6.cmake)\n    include(Tests/Phase5Gate7.cmake)\n    include(Tests/SceneUiGate2.cmake)\n",
              "    include(Tests/Phase5Gate6.cmake)\n    include(Tests/Phase5Gate7.cmake)\n    include(Tests/Phase5Gate8.cmake)\n    include(Tests/SceneUiGate2.cmake)\n",
          )

          replace_once(
              "Studio/src/StudioApplication.h",
              '#include "renegade/bridge/RenderSettingsService.h"\n#include "renegade/bridge/RenderLutService.h"\n#include "renegade/bridge/ImportService.h"\n',
              '#include "renegade/bridge/RenderSettingsService.h"\n#include "renegade/bridge/RenderLutService.h"\n#include "renegade/bridge/LightmapBakeService.h"\n#include "renegade/bridge/ImportService.h"\n',
          )
          replace_once(
              "Studio/src/StudioApplication.h",
              "        void SetPathTracePreviewActive(bool active);\n        void RestartPathTracePreview();\n        void RefreshPathTracePreviewStatus();\n        void BeginRenderSlider(RenderField field);\n",
              "        void SetPathTracePreviewActive(bool active);\n        void RestartPathTracePreview();\n        void RefreshPathTracePreviewStatus();\n        void CreateGate8BakeControls();\n        void LayoutGate8BakeControls(float fieldWidth, float& y);\n        void RefreshGate8BakeControls();\n        void TickGate8BakeControls();\n        [[nodiscard]] std::vector<wi::ecs::Entity> SelectedBakeTargets() const;\n        void BeginSelectedLightmapBake();\n        void FinishSelectedLightmapBake();\n        void CancelGate8Bake();\n        void ClearSelectedLightmap();\n        void ComputeSelectedVertexAo();\n        void ClearSelectedVertexAo();\n        void BeginRenderSlider(RenderField field);\n",
          )
          replace_once(
              "Studio/src/StudioApplication.h",
              "        SceneInspectorSlider renderPathTraceSamples_;\n        SceneInspectorSlider renderPathTraceBounces_;\n        SceneInspectorButton renderPathTraceRestart_;\n        SceneInspectorButton focusButton_;\n",
              "        SceneInspectorSlider renderPathTraceSamples_;\n        SceneInspectorSlider renderPathTraceBounces_;\n        SceneInspectorButton renderPathTraceRestart_;\n        wi::gui::Label renderLightmapBakeLabel_;\n        wi::gui::Label renderLightmapBakeStatus_;\n        SceneInspectorComboBox renderLightmapResolution_;\n        SceneInspectorComboBox renderLightmapUvSource_;\n        SceneInspectorCheckBox renderLightmapBlockCompression_;\n        SceneInspectorButton renderLightmapStart_;\n        SceneInspectorButton renderLightmapStop_;\n        SceneInspectorButton renderLightmapClear_;\n        SceneInspectorButton renderLightmapPreview_;\n        wi::gui::Label renderVertexAoBakeLabel_;\n        wi::gui::Label renderVertexAoBakeStatus_;\n        SceneInspectorSlider renderVertexAoRayCount_;\n        SceneInspectorSlider renderVertexAoRayLength_;\n        SceneInspectorButton renderVertexAoCompute_;\n        SceneInspectorButton renderVertexAoClear_;\n        bridge::LightmapBakeSettings lightmapBakeSettings_;\n        bridge::LightmapBakeSession lightmapBakeSession_;\n        bridge::VertexAoBakeSettings vertexAoBakeSettings_;\n        std::string renderBakeLastMessage_;\n        SceneInspectorButton focusButton_;\n",
          )

          replace_once(
              "Studio/src/Phase5Gate5RenderWorkspace.cpp",
              "        CreateGate7RenderControls();\n\n        // Wicked Window::AddWidget() copies Window::IsEnabled() into each child,\n",
              "        CreateGate7RenderControls();\n        CreateGate8BakeControls();\n\n        // Wicked Window::AddWidget() copies Window::IsEnabled() into each child,\n",
          )
          replace_once(
              "Studio/src/Phase5Gate5RenderWorkspace.cpp",
              "        LayoutGate7RenderControls(fieldWidth, y);\n    }\n\n    void StudioRenderPath::RefreshRenderWorkspace()\n",
              "        LayoutGate7RenderControls(fieldWidth, y);\n        LayoutGate8BakeControls(fieldWidth, y);\n    }\n\n    void StudioRenderPath::RefreshRenderWorkspace()\n",
          )
          replace_once(
              "Studio/src/Phase5Gate5RenderWorkspace.cpp",
              "        RefreshGate7RenderControls(state);\n\n        renderBloomThreshold_.SetEnabled(state.bloomEnabled);\n",
              "        RefreshGate7RenderControls(state);\n        RefreshGate8BakeControls();\n\n        renderBloomThreshold_.SetEnabled(state.bloomEnabled);\n",
          )
          replace_once(
              "Studio/src/Phase5Gate5RenderWorkspace.cpp",
              "        else\n        {\n            if (pathTracePreviewActive_)\n                SetPathTracePreviewActive(false);\n            studioChrome_.SetRenderWorkspaceActive(false);\n",
              "        else\n        {\n            if (lightmapBakeSession_.IsActive())\n                CancelGate8Bake();\n            if (pathTracePreviewActive_)\n                SetPathTracePreviewActive(false);\n            studioChrome_.SetRenderWorkspaceActive(false);\n",
          )

          replace_once(
              "Studio/src/StudioApplication.cpp",
              "        if (renderWorkspaceActive_)\n        {\n            // The Window owns child transforms while it processes scrolling and\n            // pointer state. Never relayout its children from the frame loop.\n            renderWorkspacePanel_.SetVisible(!projectHubVisible_);\n            inspectorPanel_.SetVisible(false);\n        }\n        PollTestLevel();\n",
              "        if (renderWorkspaceActive_)\n        {\n            // The Window owns child transforms while it processes scrolling and\n            // pointer state. Never relayout its children from the frame loop.\n            renderWorkspacePanel_.SetVisible(!projectHubVisible_);\n            inspectorPanel_.SetVisible(false);\n            TickGate8BakeControls();\n        }\n        PollTestLevel();\n",
          )

          replace_once(
              "EngineBridge/src/LightmapBakeService.cpp",
              "#include <xatlas.h>\n",
              "#include <xatlas.h>\n#include <wiTextureHelper.h>\n",
          )
          replace_once(
              "EngineBridge/src/LightmapBakeService.cpp",
              "                object->lightmapTextureData.assign(\n                    state.lightmapTextureData.begin(),\n                    state.lightmapTextureData.end());\n                object->vertex_ao.assign(\n                    state.vertexAo.begin(),\n                    state.vertexAo.end());\n                object->CreateRenderData();\n",
              "                object->lightmapTextureData.assign(\n                    state.lightmapTextureData.begin(),\n                    state.lightmapTextureData.end());\n                object->vertex_ao.assign(\n                    state.vertexAo.begin(),\n                    state.vertexAo.end());\n                if (!object->lightmapTextureData.empty() &&\n                    object->lightmapWidth > 0 && object->lightmapHeight > 0)\n                {\n                    const wi::graphics::Format format =\n                        state.lightmapDisableBlockCompression\n                            ? wi::graphics::Format::R11G11B10_FLOAT\n                            : wi::graphics::Format::BC6H_UF16;\n                    if (!wi::texturehelper::CreateTexture(\n                            object->lightmap,\n                            object->lightmapTextureData.data(),\n                            object->lightmapWidth,\n                            object->lightmapHeight,\n                            format))\n                    {\n                        return false;\n                    }\n                    wi::graphics::GetDevice()->SetName(\n                        &object->lightmap, \"lightmap\");\n                }\n                object->CreateRenderData();\n",
          )
          replace_once(
              "EngineBridge/src/LightmapBakeService.cpp",
              "            object->SetLightmapRenderRequest(false);\n            object->SaveLightmap();\n",
              "            if (!object->lightmap.IsValid() ||\n                object->lightmapIterationCount == 0)\n            {\n                error = \"The native lightmap bake has not produced a sample yet.\";\n                Cancel(scene, session);\n                return false;\n            }\n            object->SetLightmapRenderRequest(false);\n            object->SaveLightmap();\n            if (object->lightmapTextureData.empty())\n            {\n                error = \"Wicked did not return persisted lightmap data.\";\n                Cancel(scene, session);\n                return false;\n            }\n",
          )
          replace_once(
              "EngineBridge/src/LightmapBakeService.cpp",
              "            object->CreateRenderData();\n            return true;\n        }\n    }\n\n    struct LightmapBakeSession::Impl\n",
              "            object->CreateRenderData();\n            if (!mesh->IsBVHEnabled())\n            {\n                mesh->bvh = {};\n                mesh->bvh_leaf_aabbs.clear();\n            }\n            return true;\n        }\n    }\n\n    struct LightmapBakeSession::Impl\n",
          )

          replace_once(
              "Studio/src/Phase5Gate8LightmapBaking.cpp",
              "        const bool realtime = !pathTracePreviewActive_;\n        renderLightmapResolution_.SetEnabled(status.eligible && !active && realtime);\n",
              "        const bool realtime = !pathTracePreviewActive_;\n        renderPathTraceToggle_.SetEnabled(!active);\n        renderLightmapResolution_.SetEnabled(status.eligible && !active && realtime);\n",
          )
          PY

          git diff --check

      - name: Commit clean Gate 8 product integration
        shell: bash
        run: |
          git config user.name "mav3r1ckmediastudio-glitch"
          git config user.email "mav3r1ckmediastudio@gmail.com"
          git add CMakeLists.txt EngineBridge Studio Tests docs
          git rm .github/workflows/phase5-gate8-integrate.yml
          git diff --cached --check
          git commit -m "Phase 5 Gate 8: integrate lightmap and baking"
          git push origin HEAD:phase5/scene-render-gate8-lightmap-baking
