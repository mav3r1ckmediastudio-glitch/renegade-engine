name: Gate 8D rebuild patcher

on:
  push:
    branches:
      - feature/story-flow-gate8d-creator-controls
    paths:
      - .github/workflows/gate8d-rebuild-patcher.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/story-flow-gate8d-creator-controls
          fetch-depth: 0

      - name: Apply bounded Gate 8D contract repairs
        shell: python
        run: |
          from pathlib import Path

          authoring = Path("EngineBridge/src/ScreenAuthoringSession.cpp")
          text = authoring.read_text(encoding="utf-8")
          old_include = '#include <cmath>\n#include <utility>\n'
          new_include = '#include <cmath>\n#include <iterator>\n#include <utility>\n'
          if old_include not in text:
              raise SystemExit("ScreenAuthoringSession include anchor missing")
          text = text.replace(old_include, new_include, 1)
          authoring.write_text(text, encoding="utf-8")

          service = Path("EngineBridge/src/ScreenService.cpp")
          text = service.read_text(encoding="utf-8")
          old_image = '''            case ScreenWidgetKind::Image:\n                if (!widget.visible ||\n                    !IsContentRelativePath(widget.resourcePath) ||\n                    !widget.text.empty() || !widget.actionId.empty())\n'''
          new_image = '''            case ScreenWidgetKind::Image:\n                if ((!widget.resourcePath.empty() &&\n                     !IsContentRelativePath(widget.resourcePath)) ||\n                    !widget.text.empty() || !widget.actionId.empty())\n'''
          if old_image not in text:
              raise SystemExit("Screen image validation anchor missing")
          text = text.replace(old_image, new_image, 1)
          service.write_text(text, encoding="utf-8")

      - name: Commit bounded repairs
        shell: bash
        run: |
          git config user.name "Renegade Repair Bot"
          git config user.email "actions@users.noreply.github.com"
          git add EngineBridge/src/ScreenAuthoringSession.cpp EngineBridge/src/ScreenService.cpp
          git diff --cached --check
          git commit -m "Story Flow Gate 8D: repair creator image contract"
          git push origin HEAD:feature/story-flow-gate8d-creator-controls
