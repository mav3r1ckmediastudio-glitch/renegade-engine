name: Apply S2 Windows path identity fix

on:
  push:
    branches:
      - scripting/s2-script-document-source-model
    paths:
      - .github/workflows/apply-s2-windows-path-identity-fix.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Check out S2 branch
        uses: actions/checkout@v4
        with:
          ref: scripting/s2-script-document-source-model
          fetch-depth: 0

      - name: Tighten source path identity and add regression test
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          source_path = Path('EngineBridge/src/ScriptDocumentService.cpp')
          test_path = Path('Tests/S2ScriptDocumentTests.cpp')
          source = source_path.read_text(encoding='utf-8')
          tests = test_path.read_text(encoding='utf-8')

          old = '''            const std::string normalizedPath =\n                fs::u8path(attachment.sourcePath).lexically_normal().generic_u8string();\n'''
          new = '''            // Renegade is Windows-first and Windows project paths are case-insensitive.\n            // One physical governed Lua source must never acquire multiple source IDs\n            // merely because two document entries use different path casing.\n            const std::string normalizedPath = LowerAscii(\n                fs::u8path(attachment.sourcePath).lexically_normal().generic_u8string());\n'''
          if source.count(old) != 1:
              raise SystemExit(f'expected one source identity seam, found {source.count(old)}')
          source = source.replace(old, new, 1)

          marker = '''    if (AddScriptAttachment(conflictDocument, conflictingPath, error))\n        return Fail("same source path with different sourceId should be rejected");\n\n'''
          addition = marker + '''    ScriptAttachment conflictingPathCase = CreateScriptAttachment(\n        ScriptScope::Entity,\n        ownerA,\n        MakeSource("content/scripts/SHARED # ACTION.lua", ScriptPresentation::Action));\n    conflictDocument = document;\n    if (AddScriptAttachment(conflictDocument, conflictingPathCase, error))\n        return Fail("Windows-equivalent source path casing with different sourceId should be rejected");\n\n'''
          if tests.count(marker) != 1:
              raise SystemExit(f'expected one source conflict test seam, found {tests.count(marker)}')
          tests = tests.replace(marker, addition, 1)

          source_path.write_text(source, encoding='utf-8', newline='\n')
          test_path.write_text(tests, encoding='utf-8', newline='\n')
          PY

      - name: Commit fix and remove helper workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/apply-s2-windows-path-identity-fix.yml
          git add EngineBridge/src/ScriptDocumentService.cpp Tests/S2ScriptDocumentTests.cpp
          git diff --cached --check
          git commit -m "S2: make governed source path identity Windows-safe"
          git push origin HEAD:scripting/s2-script-document-source-model
