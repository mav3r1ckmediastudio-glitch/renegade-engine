name: Temporary Phase 6 repair v2

on:
  push:
    branches:
      - staging/phase6-nav-terrain-repair
    paths:
      - ".github/workflows/_temporary-phase6-repair-v2.yml"

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply audited substitutions
        shell: bash
        run: python3 Tools/_temporary_phase6_repair.py

      - name: Verify and commit repaired tree
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/_temporary-phase6-repair.yml
          rm -f .github/workflows/_temporary-phase6-repair-v2.yml
          rm -f Tools/_temporary_phase6_repair.py
          git diff --check
          git config user.name "Renegade Patch Builder"
          git config user.email "patch@renegade.local"
          git add -A
          git diff --cached --check
          git commit -m "Phase 6: repair terrain foundation and navigation obstacles"
          git push origin HEAD:staging/phase6-nav-terrain-repair
