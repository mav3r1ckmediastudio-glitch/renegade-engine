name: PR57 full MAX architecture recovery v3

on:
  push:
    branches:
      - scratch/pr57-max-architecture
    paths:
      - ".github/workflows/pr57-full-recovery-verify-v3.yml"

permissions:
  contents: write

jobs:
  build:
    name: Verify ${{ matrix.configuration }}
    runs-on: windows-2025
    timeout-minutes: 70
    strategy:
      fail-fast: false
      matrix:
        configuration:
          - Debug
          - Release
    steps:
      - name: Check out recovery branch and pinned Wicked
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Configure MSBuild
        uses: microsoft/setup-msbuild@v2
        with:
          msbuild-architecture: x64

      - name: Apply compiler-proven audited recovery candidate
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          python .github/pr57-patch-core.py
          if ($LASTEXITCODE -ne 0) { throw 'core recovery patch failed' }
          python .github/pr57-patch-thumbnail.py
          if ($LASTEXITCODE -ne 0) { throw 'thumbnail recovery patch failed' }
          python .github/pr57-patch-drag.py
          if ($LASTEXITCODE -ne 0) { throw 'drag recovery patch failed' }
          python .github/pr57-patch-save.py
          if ($LASTEXITCODE -ne 0) { throw 'save-safety recovery patch failed' }
          python .github/pr57-patch-preview-corrections.py
          if ($LASTEXITCODE -ne 0) { throw 'audited preview correction failed' }
          python .github/pr57-patch-compile-fixes.py
          if ($LASTEXITCODE -ne 0) { throw 'compiler-proven correction failed' }
          git diff --check
          if ($LASTEXITCODE -ne 0) { throw 'recovery diff check failed' }

          $preview = Get-Content 'Studio/src/CreatorAssetDragPreview.cpp' -Raw
          $studio = Get-Content 'Studio/src/StudioApplication.cpp' -Raw
          $browser = Get-Content 'EngineBridge/src/AssetBrowserService.cpp' -Raw
          if ($preview.Contains('prepared.ReleaseScene()')) {
            throw 'cursor preview still consumes production prepared scene'
          }
          if (-not $preview.Contains('FindRootEntities') -or
              -not $preview.Contains('pointer.x < bounds.z') -or
              -not $preview.Contains('preview.scale, preview.scale, preview.scale') -or
              -not $preview.Contains('CreatorModelImportRecipe.h') -or
              -not $preview.Contains('CreatePreview(*session')) {
            throw 'compiler-proven WYSIWYG cursor semantics incomplete'
          }
          if (($studio.Split('workflow.PrepareModelPlacement(').Count - 1) -ne 1) {
            throw 'Studio must prepare only direct PLACE; drag/drop consumes retained preview'
          }
          if (-not $studio.Contains('ConsumeCreatorAssetDragPreview') -or
              -not $studio.Contains('CreatorAssetDragPreviewBlocksSave')) {
            throw 'WYSIWYG consume/save guard missing'
          }
          if (-not $studio.Contains('SaveCreatorSquareThumbnail') -or
              -not $studio.Contains('BeginCreatorThumbnailPresentation')) {
            throw 'deterministic thumbnail pipeline missing'
          }
          if (-not $browser.Contains('.rasset.json')) {
            throw 'managed projection browser suppression missing'
          }
          Write-Host 'PR57_V3_SOURCE_INVARIANTS_PASS'

      - name: Stage pinned LP07 FBX proof fixtures
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $fixtureRoot = 'Tests/Fixtures/LP07'
          New-Item -ItemType Directory -Force -Path $fixtureRoot | Out-Null
          $upstreamCommit = 'fcc5d6ba444cfd3eb80677dba5e37e493941abe5'
          $fixtures = @(
            @{ Name = 'maya_cube_6100_ascii.fbx'; Blob = 'b0aa64ea2361060b4f9bc4cd4e7bd0f730b6f7d8' },
            @{ Name = 'maya_transformed_skin_7700_ascii.fbx'; Blob = '683b74cf082e5adab645082c73dd221e0ff7f281' }
          )
          foreach ($fixture in $fixtures) {
            $path = Join-Path $fixtureRoot $fixture.Name
            $uri = "https://raw.githubusercontent.com/ufbx/ufbx/$upstreamCommit/data/$($fixture.Name)"
            Invoke-WebRequest -Uri $uri -OutFile $path
            $actualBlob = (& git.exe hash-object -- $path).Trim()
            if ($LASTEXITCODE -ne 0 -or $actualBlob -ne $fixture.Blob) {
              throw "LP07 fixture integrity failure for $($fixture.Name)"
            }
          }

      - name: Build and test
        shell: pwsh
        run: >-
          ./Tools/Build-Studio-Windows.ps1
          -Configuration ${{ matrix.configuration }}
          -Clean
          -ArtifactRoot "artifacts/studio/pr57-full-recovery-${{ matrix.configuration }}"

      - name: Studio startup smoke
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $studio = 'BUILD/renegade/Studio/${{ matrix.configuration }}/RenegadeStudio.exe'
          if (-not (Test-Path -LiteralPath $studio -PathType Leaf)) {
            throw "Cannot find verified Studio at $studio"
          }
          $process = Start-Process -FilePath $studio -ArgumentList 'startup-smoke' -Wait -PassThru
          if ($process.ExitCode -ne 0) {
            throw "Startup smoke failed with exit code $($process.ExitCode)."
          }
          Write-Host 'PR57_V3_STARTUP_SMOKE_PASS configuration=${{ matrix.configuration }}'

      - name: Upload verified candidate
        uses: actions/upload-artifact@v4
        with:
          name: pr57-full-recovery-${{ matrix.configuration }}-${{ github.sha }}
          path: artifacts/studio/pr57-full-recovery-${{ matrix.configuration }}
          if-no-files-found: error
          retention-days: 14

  publish-scratch:
    name: Publish proven recovery to scratch
    needs: build
    runs-on: windows-2025
    steps:
      - name: Check out exact recovery head
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply exact proven source candidate
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          python .github/pr57-patch-core.py
          python .github/pr57-patch-thumbnail.py
          python .github/pr57-patch-drag.py
          python .github/pr57-patch-save.py
          python .github/pr57-patch-preview-corrections.py
          python .github/pr57-patch-compile-fixes.py
          if ($LASTEXITCODE -ne 0) { throw 'publish candidate patch failed' }
          git diff --check
          if ($LASTEXITCODE -ne 0) { throw 'publish candidate diff check failed' }

      - name: Commit proven source and remove temporary verifier
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $temporary = @(
            '.github/pr57-patch-core.py',
            '.github/pr57-patch-thumbnail.py',
            '.github/pr57-patch-drag.py',
            '.github/pr57-patch-save.py',
            '.github/pr57-patch-preview-corrections.py',
            '.github/pr57-patch-compile-fixes.py',
            '.github/workflows/pr57-full-recovery-verify.yml',
            '.github/workflows/pr57-full-recovery-verify-v2.yml',
            '.github/workflows/pr57-full-recovery-verify-v3.yml'
          )
          foreach ($path in $temporary) {
            if (Test-Path -LiteralPath $path) { Remove-Item $path -Force }
          }
          $paths = @(
            'EngineBridge/src/AssetBrowserService.cpp',
            'EngineBridge/src/AssetCatalogueService.cpp',
            'EngineBridge/src/CreatorAssetWorkflowService.cpp',
            'Studio/src/CreatorAssetDragPreview.cpp',
            'Studio/src/RenegadeStudioChrome.h',
            'Studio/src/StudioApplication.cpp',
            'Studio/src/StudioApplication.h',
            'Tests/AssetBrowserTests.cpp'
          ) + $temporary
          git add -- $paths
          git diff --cached --check
          if ($LASTEXITCODE -ne 0) { throw 'staged recovery diff check failed' }
          git config user.name 'mav3r1ckmediastudio-glitch'
          git config user.email 'mav3r1ckmediastudio@gmail.com'
          git commit -m 'feat(assets): complete MAX-style creator workflow recovery'
          if ($LASTEXITCODE -ne 0) { throw 'proven recovery commit failed' }
          git push origin HEAD:scratch/pr57-max-architecture
          if ($LASTEXITCODE -ne 0) { throw 'proven recovery push failed' }
